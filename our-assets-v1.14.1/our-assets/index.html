.day-warn{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--expense);background:var(--expense-soft);border-radius:12px;padding:9px 12px;line-height:1.45}
.field input.day-in,.sheet .field input.day-in,.day-in{box-sizing:border-box;display:block;height:44px;min-height:0;
  width:2.2ch;margin:0;padding:0;line-height:44px;-webkit-appearance:none;appearance:none;
  border:none;border-radius:0;background:transparent;
  color:var(--brand-ink);text-align:center;font-size:13px;font-weight:700;outline:none}
.opt-list button{width:100%;display:flex;align-items:center;gap:12px;padding:15px 4px;font-size:16px;font-weight:600;text-align:left}
.opt-list button+button{border-top:1px solid var(--line)}
.opt-list .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex-shrink:0;display:grid;place-items:center}
.opt-list button.on .rd{border-color:var(--brand)}.opt-list button.on .rd::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--brand)}
.opt-list .ol-sub{font-size:12.5px;color:var(--text-3);font-weight:500}
.two-btn{display:flex;gap:10px}.two-btn .btn{flex:1}.two-btn .cancel{flex:0 0 34%}
.del-link{width:100%;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--expense);font-size:14px;font-weight:700;margin-top:8px;border-radius:var(--r-sm)}
.del-link:active{background:var(--expense-soft)}
.del-link svg{width:17px;height:17px}
.manage-row{display:flex;align-items:center;gap:12px;padding:13px 4px}
.manage-row+.manage-row{border-top:1px solid var(--line)}
.manage-row .mn{font-weight:600;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.varpill{flex-shrink:0;font-size:12.5px;font-weight:700;padding:7px 15px;border-radius:var(--r-pill);background:var(--sunken);color:var(--text-3);transition:background .15s,color .15s}
.varpill.on{background:var(--brand-soft);color:var(--brand-ink)}
.add-inline .emo-pick.a-food{background:var(--expense-soft);color:var(--expense-ink)}
.add-inline .emo-pick.a-in{background:var(--income-soft);color:var(--income)}
.add-inline .emo-pick.a-save{background:var(--save-soft);color:var(--save-ink)}
.manage-row .msub{font-size:12px;color:var(--text-3);font-weight:500;margin-top:2px}
.manage-row .msub2{font-size:11.5px;color:var(--text-3);font-weight:500;margin-top:1px;opacity:.8}
.manage-row .mc{display:inline-flex;color:var(--text-3);flex-shrink:0;margin-left:2px}
.manage-row .mc svg{width:15px;height:15px}
.manage-row{transition:opacity .15s}
.manage-row:active{opacity:.6}
.manage-row .ic{color:var(--text-3);padding:6px}
.add-inline{display:flex;gap:8px;margin-top:12px}
.add-inline input{flex:1;min-width:0;height:44px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface-2);padding:0 13px;font-size:14.5px;color:var(--text);outline:none}
.add-inline button{flex-shrink:0;width:46px;height:44px;border-radius:var(--r-sm);background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.add-inline button svg{width:18px;height:18px}
.add-inline .emo-pick{flex-shrink:0;width:46px;height:44px;border-radius:var(--r-sm);display:grid;place-items:center}
.add-inline .emo-pick svg{width:20px;height:20px}
.add-inline .emo-pick:active{transform:scale(.93)}
.cat-edit-row{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.cat-edit-row input{flex:1;min-width:0;height:52px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface-2);padding:0 14px;font-size:15px;color:var(--text);outline:none}
.emo-pick.lg{flex-shrink:0;width:56px;height:52px;border-radius:15px;display:grid;place-items:center;transition:transform .12s var(--spring)}
.emo-pick.lg svg{width:24px;height:24px}
.emo-pick.lg:active{transform:scale(.94)}
.icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.icon-cell{height:52px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text-2);transition:transform .1s var(--spring),background .15s,color .15s,border-color .15s}
.icon-cell svg{width:22px;height:22px}
.icon-cell:active{transform:scale(.9)}
.icon-cell.on{background:var(--brand);border-color:transparent;color:var(--on-brand)}
.accent-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;margin-top:4px}
.accent-sw{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 2px;border-radius:14px;transition:transform .12s var(--spring)}
.accent-sw:active{transform:scale(.94)}
.accent-dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 6px -3px rgba(0,0,0,.35);transition:box-shadow .15s}
.accent-dot svg{width:22px;height:22px;color:#fff}
.accent-sw.on .accent-dot{box-shadow:0 0 0 3px var(--surface),0 0 0 5px currentColor}
.accent-sw.on{color:var(--brand-ink)}
.accent-nm{font-size:12.5px;font-weight:700;color:var(--text-2)}
.accent-sw.on .accent-nm{color:var(--text);font-weight:700}
.end-row{display:flex;gap:10px;align-items:stretch}
.end-box{flex:1;min-width:0;height:50px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);padding:0 14px;font-size:15px;font-weight:600;box-sizing:border-box;outline:none}
button.end-box{display:flex;align-items:center;text-align:left}
button.end-box.placeholder,input.end-box::placeholder{color:var(--text-3);font-weight:500}
.end-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px;padding-left:2px}
.end-foot .psub{flex:1;min-width:0}
.sheet .end-box{background:var(--glass-field);border-color:var(--glass-border)}
.rate-row{display:flex;align-items:center;gap:12px;padding:12px 0}
.rate-row+.rate-row{border-top:1px solid var(--line)}
.rate-row .rn{font-weight:700;font-size:15px;flex:1}.rate-row .rsub{font-size:12px;color:var(--text-3);margin-top:1px}
.rate-row input{width:118px;height:44px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface-2);text-align:right;padding:0 12px;font-size:15px;font-weight:700;color:var(--text);outline:none}
.help-row{display:flex;gap:12px;padding:12px 2px;align-items:flex-start}
.help-row+.help-row{border-top:1px solid var(--line)}
.help-row .ht{font-weight:700;font-size:14.5px}
.help-row .hs{font-size:13px;color:var(--text-2);margin-top:3px;line-height:1.55}

.toast-wrap{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--ad-h) + env(safe-area-inset-bottom) + 12px);z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:12px 18px;border-radius:var(--r-pill);font-size:14px;font-weight:600;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(14px) scale(.96);transition:.42s var(--bounce);max-width:90%}
.toast.show{opacity:1;transform:none}.toast svg{width:17px;height:17px;color:var(--brand)}
html[data-theme="dark"] .toast{background:var(--surface-2);color:var(--text);border:1px solid var(--line-2)}
.toast.undo{pointer-events:auto;gap:12px}
.toast.fail svg{color:var(--expense)}
.toast-undo{background:transparent;color:var(--brand);font-weight:700;font-size:14px;padding:2px 6px;margin-left:2px;flex-shrink:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
html[data-theme="dark"] .toast.undo .toast-undo{color:var(--brand-ink)}
.sw-update-bar{display:none;position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--ad-h) + env(safe-area-inset-bottom) + 12px);z-index:199;align-items:center;gap:10px;padding:13px 16px;border-radius:var(--r-md);background:var(--brand);color:var(--on-brand);font-size:13.5px;font-weight:700;box-shadow:var(--sh-lg);cursor:pointer}
.sw-update-bar.show{display:flex}
.sw-update-bar svg{width:18px;height:18px;flex-shrink:0}
/* install-bar: sw-update-bar와 같은 자리를 쓰지만 둘이 동시에 뜨지는 않는다
 * (maybeShowInstallBar()가 SW_UPDATE_AVAILABLE이면 항상 숨김 — app-evolve cycle236 advance) */
.install-bar{display:none;position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--ad-h) + env(safe-area-inset-bottom) + 12px);z-index:199;align-items:center;gap:10px;padding:13px 16px;border-radius:var(--r-md);background:var(--brand);color:var(--on-brand);font-size:13.5px;font-weight:700;box-shadow:var(--sh-lg);cursor:pointer}
.install-bar.show{display:flex}
.install-bar svg{width:18px;height:18px;flex-shrink:0}
.install-bar .ib-txt{flex:1}
.install-bar .ib-x{flex-shrink:0;background:transparent;border:0;color:var(--on-brand);font-weight:700;font-size:13px;padding:6px 10px;opacity:.85;cursor:pointer}
.err-banner{display:none;position:fixed;left:0;right:0;top:0;z-index:400;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--expense);color:#fff;font-size:13.5px;font-weight:700;box-shadow:var(--sh-lg)}
.err-banner.show{display:flex}
.err-banner svg{width:18px;height:18px;flex-shrink:0}
.err-banner span{flex:1}
.err-banner button{flex-shrink:0;background:rgba(255,255,255,.22);color:#fff;border-radius:var(--r-pill);padding:7px 14px;font-size:13px;font-weight:700}
.empty{text-align:center;padding:40px 20px;color:var(--text-3)}
.empty .ei{width:56px;height:56px;border-radius:20px;background:var(--sunken);display:grid;place-items:center;margin:0 auto 14px;color:var(--text-3)}
.empty .ei svg{width:28px;height:28px}
.empty-cta{display:inline-flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;height:40px;padding:0 18px;border-radius:var(--r-pill);background:var(--brand);color:var(--on-brand);font-size:14px;font-weight:700;transition:transform .15s var(--spring)}
.empty-cta svg{width:16px;height:16px}.empty-cta:active{transform:scale(.95)}.empty .et{font-size:15px;font-weight:700;color:var(--text-2)}.empty .es{font-size:13px;margin-top:5px}
/* pick field — 탭하면 열리는 선택 (통장/카테고리/종류/귀속) */
.pick{width:100%;min-height:54px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface-2);padding:9px 14px;display:flex;align-items:center;gap:11px;text-align:left;transition:border .15s,transform .15s var(--spring)}
.pick:active{transform:scale(.99);border-color:var(--brand)}
.pick .pav{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.pick .pav svg{width:18px;height:18px}
.pick .pbody{flex:1;min-width:0}
.pick .pn{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .psub{font-size:12px;color:var(--text-3);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .pc{color:var(--text-3);flex-shrink:0}.pick .pc svg{width:18px;height:18px}
.pick.placeholder .pn{color:var(--text-3);font-weight:600}

/* picker sheet */
.pk-back{position:absolute;top:14px;left:14px;width:34px;height:34px;border-radius:50%;background:var(--sunken);color:var(--text-2);display:grid;place-items:center;z-index:2;transition:transform .15s var(--spring)}
.pk-back svg{width:18px;height:18px}.pk-back:active{transform:scale(.9)}
.pk-h{font-size:19px;font-weight:700;margin:2px 0 12px;padding-left:56px;min-height:34px;display:flex;align-items:center}
.pk-group{position:relative;margin:0 -6px}
.pk-blob{position:absolute;top:0;left:0;width:0;height:0;border-radius:var(--r-md);
  background:var(--brand-soft);border:1.5px solid var(--brand);
  box-shadow:0 1px 3px rgba(0,0,0,.10);
  transition:transform .42s cubic-bezier(.32,.72,0,1),width .42s cubic-bezier(.32,.72,0,1),height .42s cubic-bezier(.32,.72,0,1);
  pointer-events:none;z-index:0;opacity:0}
.pk-blob.on{opacity:1}
.pk-blob.squish{transform:var(--pbT)!important} /* 출렁임 제거 */
.pk-item{position:relative;z-index:1}
.pk-cap{font-size:12px;font-weight:700;color:var(--text-3);margin:14px 10px 4px;letter-spacing:.02em}
.pk-cap:first-child{margin-top:2px}
.pk-item{width:100%;display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:var(--r-md);text-align:left;transition:background .12s,transform .12s var(--spring)}
.pk-item:active{transform:scale(.99);background:var(--surface-2)}
.pk-item.on{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.pk-item.on .pn{color:var(--brand-ink);font-weight:700}
.pk-item .pav{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.pk-item .pav svg{width:19px;height:19px}
.pk-item .pbody{flex:1;min-width:0}
.pk-item .pn{font-weight:700;font-size:15px}
.pk-item .psub{font-size:12px;color:var(--text-3);font-weight:500;margin-top:2px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pk-item .amt{margin-left:auto;text-align:right;font-weight:700;font-size:13.5px;white-space:nowrap;color:var(--text-2)}
.pk-item .rc{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex-shrink:0;display:grid;place-items:center;margin-left:8px}
.pk-item:not(.hasamt) .rc{margin-left:auto}
.pk-item.on .rc{border-color:var(--brand);background:var(--brand)}
.pk-item .rc svg{width:13px;height:13px;color:#fff;opacity:0}.pk-item.on .rc svg{opacity:1}
.pk-cat-grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:4px}
.cat-blob{position:absolute;top:0;left:0;width:0;height:0;border-radius:var(--r-md);
  background:var(--brand-soft);border:1.5px solid var(--brand);
  box-shadow:0 1px 3px rgba(0,0,0,.10);
  transition:transform .42s cubic-bezier(.32,.72,0,1),width .42s cubic-bezier(.32,.72,0,1),height .42s cubic-bezier(.32,.72,0,1);
  pointer-events:none;z-index:0;opacity:0}
.cat-blob.on{opacity:1}
.cat-blob.squish{transform:var(--gbT)!important}
.pk-cat{position:relative;z-index:1}
.pk-cat{height:74px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:700;color:var(--text-2);transition:transform .12s var(--spring)}
.pk-cat:active{transform:scale(.96)}
.pk-cat .cav{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.pk-cat .cav svg{width:18px;height:18px}
.pk-cat.on{background:transparent;border-color:transparent;color:var(--brand-ink);font-weight:700;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.pk-cat.on .cav{background:var(--brand);color:#fff}

/* 관리 목록 액션 버튼 (수정/삭제 — 명확히 보이게) */
.row-acts{display:flex;gap:7px;flex-shrink:0}
.act-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sunken);color:var(--text-2);transition:transform .15s var(--spring)}
.act-btn svg{width:18px;height:18px}
.act-btn:active{transform:scale(.9)}
.act-btn.danger{background:var(--expense-soft);color:var(--expense)}
.manage-row .ic svg{width:19px;height:19px}

/* 홈 금액 자동 맞춤 */
.fit{white-space:nowrap;display:block}
.hero-split .fit{display:block}

.hd-l{min-width:0}
.month-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 14px}
.thismonth-row{display:flex;justify-content:center;margin:-8px 0 14px}
.mn-arw{width:40px;height:40px;border-radius:13px;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;box-shadow:var(--sh-sm);transition:transform .15s var(--spring)}
.mn-arw svg{width:18px;height:18px}.mn-arw:active{transform:scale(.9)}
.month-nav.solo{justify-content:center}
.month-nav.solo .mn-lbl{flex:0 1 auto;width:min(320px,86%);max-width:none;padding:0 20px}
.mn-lbl{flex:1;max-width:230px;height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:7px;font-size:16px;font-weight:700;letter-spacing:-.02em;box-shadow:var(--sh-sm);transition:transform .15s var(--spring)}
.mn-lbl svg{width:15px;height:15px;color:var(--text-3)}.mn-lbl:active{transform:scale(.97)}

.as-tools{display:flex;align-items:center;gap:10px;margin:16px 0 10px;min-height:34px}
.as-actions{flex:1;display:flex;gap:10px}
.nw-carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-top:2px}
.nw-carousel::-webkit-scrollbar{display:none}
.nw-carousel>.hero{flex:0 0 100%;scroll-snap-align:start}
.nw-dots{display:flex;justify-content:center;gap:6px;margin:11px 0 2px}
.nw-dots i,.nw-dots button{width:6px;height:6px;border-radius:50%;background:var(--line-2);transition:background .22s,width .22s;border:none;padding:0;-webkit-appearance:none}
.nw-dots button{cursor:pointer}
.nw-dots i.on,.nw-dots button.on{background:var(--brand);width:18px;border-radius:3px}
#nwCarousel{outline-offset:4px}
.as-tools.hidden{visibility:hidden;pointer-events:none} /* 자리는 유지 → 선택 모드에서 목록이 밀리지 않음 */
.as-tbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 13px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-2);font-size:14px;font-weight:700;color:var(--text-2);transition:transform .15s var(--spring)}
.as-tbtn svg{width:16px;height:16px}.as-tbtn:active{transform:scale(.96)}
.as-tbtn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

.ledsum{padding:11px 10px 9px;margin-bottom:14px}
.ledsum button{pointer-events:none} /* 제스처는 카드가 수신 (내부 버튼 비활성) */
.ledsum.peek{background:var(--surface-2)} /* 미리보기 표시는 은은하게 (형광 느낌 제거) */
@keyframes rowFlash{0%{background:var(--surface)}18%{background:var(--brand-soft)}100%{background:var(--surface)}}
.flash{animation:rowFlash 1.3s var(--ease)}
@keyframes numIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.num-in{animation:numIn .34s var(--ease)}
.totbox.peek{background:var(--surface-2)}
.card.ledsum,.card.totbox{border:1.5px solid var(--brand)} /* 대표 카드 셸 통일 (플랜 카드와 동일) */
.ledsum .k{font-size:11.5px;color:var(--text);font-weight:600;letter-spacing:.02em}
.ledsum .v{letter-spacing:-.03em;font-weight:700}
.ls1{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0 9px;width:100%;border-bottom:1px solid var(--line)}
.ls1 .v{font-size:27px;letter-spacing:-.035em}
.ls3{display:flex;padding:9px 0 8px;text-align:center}
.ls3>button{flex:1;position:relative;padding:2px 4px;border-radius:10px}
.ls3>button:active{background:var(--sunken)}
.ls3>button+button::before{content:"";position:absolute;left:0;top:12%;height:76%;width:1px;background:var(--line)}
.ls3 .k{display:block}.ls3 .v{font-size:15px;font-weight:700;margin-top:6px;display:block}
.lsr{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 8px 1px;border-top:1px solid var(--line)}
.lsr .k{font-weight:600}.lsr .v{font-size:14px;color:var(--text-2)}

.home-alert{position:relative;display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;text-align:left;background:var(--expense-soft);border:none;border-radius:var(--r-md);padding:13px 14px 13px 18px;margin-bottom:14px;box-shadow:var(--sh-sm);overflow:hidden;transition:transform .15s var(--spring)}
.home-alert::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--expense)}
.home-alert:active{transform:scale(.99)}
.alert-stack-wrap{margin-bottom:14px}
.alert-stack{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  touch-action:pan-x;overscroll-behavior-x:contain}
.alert-stack::-webkit-scrollbar{display:none}
.alert-stack>.home-alert{flex:0 0 100%;scroll-snap-align:center;margin-bottom:0}
.alert-dots{display:flex;gap:6px;justify-content:center;margin-top:9px}
.alert-dots .ad{width:6px;height:6px;border-radius:50%;background:var(--line-2);transition:all .22s var(--spring)}
.alert-dots .ad.on{background:var(--expense);width:18px;border-radius:3px}
.home-alert.mat{background:var(--gold-soft)}.home-alert.mat::before{background:var(--gold)}.home-alert.mat .ha-ic{background:var(--gold)}
.home-alert.mat .ha-t,.home-alert.mat .ha-c{color:var(--gold)}
.home-alert.confirm{background:var(--brand-soft)}.home-alert.confirm::before{background:var(--brand)}
.home-alert.confirm .ha-ic{background:var(--brand)}
.home-alert.confirm .ha-t,.home-alert.confirm .ha-c{color:var(--brand-ink)}
.home-alert.tidy{background:var(--sunken)}.home-alert.tidy::before{background:var(--text-3)}
.home-alert.tidy .ha-ic{background:var(--text-3)}
.home-alert.tidy .ha-t{color:var(--text)}
.home-alert.tidy .ha-c{color:var(--text-3)}
.home-alert.quick{background:var(--income-soft)}.home-alert.quick::before{background:var(--income)}
.home-alert.quick .ha-ic{background:var(--income)}
.home-alert.quick .ha-t,.home-alert.quick .ha-c{color:var(--income)}
/* 다음에 나갈 큰돈 — 홈의 주인공 */
.next-card{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--brand);
  border-radius:var(--r-lg);padding:20px 22px 18px;margin-bottom:14px;box-shadow:var(--sh-sm);
  transition:transform .3s var(--bounce)}
.next-card:not(.ok){cursor:pointer} /* .ok(60일간 큰 지출 없음)은 onclick이 없는 안내 카드라 제외 */
.next-card:active{transform:scale(.985)}
.next-card.warn{border-color:var(--expense);border-width:1.5px}
.nc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nc-lb{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.02em}
.nc-dd{font-size:12px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);border-radius:999px;padding:4px 10px}
.next-card.warn .nc-dd{color:var(--expense);background:var(--expense-soft)}
.nc-amt{font-size:34px;font-weight:700;letter-spacing:-.04em;margin-top:10px;line-height:1.05;color:var(--text)}
.nc-amt small{font-size:17px;margin-left:2px;font-weight:700;color:var(--text-2)}
.nc-nm{font-size:13.5px;color:var(--text-2);font-weight:600;margin-top:4px}
.nc-foot{font-size:12.5px;font-weight:600;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--text-2)}
.nc-foot b{font-weight:700}
.nc-foot.bad{color:var(--expense)}
.nc-foot.good b{color:var(--text)}
.nc-empty{font-size:14px;color:var(--text-2);font-weight:600;margin-top:10px}
.nc-fix{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;height:44px;border-radius:14px;
  background:var(--expense);color:#fff;font-size:14px;font-weight:700;box-shadow:0 6px 18px -6px var(--expense);
  transition:transform .3s var(--bounce)}
.nc-fix svg{width:17px;height:17px}
.nc-fix:active{transform:scale(.96)}
.fix-cap{font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:.02em;margin:16px 2px 8px}
/* + 버튼 말풍선 팝업 */
.fab-pop{position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--ad-h) + env(safe-area-inset-bottom) + 70px);z-index:56;
  width:224px;padding:6px;border-radius:18px;
  background:var(--glass-panel);-webkit-backdrop-filter:saturate(190%) blur(30px);backdrop-filter:saturate(190%) blur(30px);
  border:1px solid var(--glass-border);box-shadow:0 16px 40px rgba(18,26,22,.25);
  opacity:0;transform:translateY(8px) scale(.9);transform-origin:bottom right;pointer-events:none;
  transition:opacity .2s var(--ease),transform .42s var(--bounce)}
.fab-pop.show{opacity:1;transform:none;pointer-events:auto}
.fab-pop::after{content:"";position:absolute;right:20px;bottom:-6px;width:12px;height:12px;
  background:var(--glass-panel);border-right:1px solid var(--glass-border);border-bottom:1px solid var(--glass-border);
  transform:rotate(45deg)}
.fp-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:13px;
  transition:background .15s,transform .3s var(--bounce)}
.fp-item:active{transform:scale(.96);background:var(--sunken)}
.fp-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.fp-ic svg{width:17px;height:17px}
.fp-b{display:flex;flex-direction:column;min-width:0}
.fp-t{font-size:14.5px;font-weight:700;color:var(--text)}
.fp-s{font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:1px}
.fab.open{transform:rotate(45deg)}
/* 홈 빠른 입력 버튼 */
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--ad-h) + env(safe-area-inset-bottom) + 16px);z-index:55;
  width:46px;height:46px;border-radius:50%;background:var(--brand);color:#fff;display:none;place-items:center;
  box-shadow:0 8px 22px -8px var(--brand),0 2px 6px rgba(0,0,0,.1);
  transition:transform .4s var(--bounce),opacity .25s}
.fab::before,.fab::after{content:"";position:absolute;background:#fff;border-radius:2px}
.fab::before{width:17px;height:2.2px}
.fab::after{width:2.2px;height:17px}
body.show-fab .fab{display:grid}
body.selmode .fab{display:none}
.fab:active{transform:scale(.9) rotate(90deg)}
/* 통장 안전 신호등 */
.sig{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.sig.ok{background:var(--brand)}
.sig.warn{background:var(--gold)}
.sig.bad{background:var(--expense)}
.sig-t{font-weight:700;margin-top:2px}
.sig-t.ok{color:var(--text-3)}
.sig-t.warn{color:var(--gold)}
.sig-t.bad{color:var(--expense)}
/* 이번 달 나갈 돈 */
.of-card{padding:16px 18px}
.of-total{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;margin-bottom:6px;
  border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--text-3)}
.of-total .num{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.03em}
.of-row{display:flex;align-items:center;gap:10px;padding:9px 0;transition:opacity .15s}
.of-row:active{opacity:.55}
.of-row+.of-row{border-top:1px solid var(--line)}
.of-nm{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.of-dt{font-size:12px;color:var(--text-3);font-weight:600;flex-shrink:0}
.of-am{font-size:14px;font-weight:700;flex-shrink:0}
.of-more{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;margin-top:6px;padding:11px 0 3px;
  font-size:12.5px;color:var(--text-2);font-weight:700;border-top:1px solid var(--line);
  transition:transform .3s var(--bounce),color .2s}
.of-more svg{width:14px;height:14px}
.of-ar{display:inline-flex;transition:transform .34s var(--bounce)}
.of-ar.up{transform:rotate(180deg)}
.of-more:active{transform:scale(.97);color:var(--brand-ink)}
/* 다 잘 되고 있을 때 */
.home-alert.safe{background:var(--brand-soft)}.home-alert.safe::before{background:var(--brand)}
.home-alert.safe .ha-ic{background:var(--brand)}
.home-alert.safe .ha-t{color:var(--brand-ink)}
/* 해냈을 때의 작은 축하 */
.celebrate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;pointer-events:none;
  opacity:0;transition:opacity .3s var(--ease)}
.celebrate.show{opacity:1}
.cel-card{background:var(--glass-panel);-webkit-backdrop-filter:saturate(190%) blur(30px);backdrop-filter:saturate(190%) blur(30px);
  border:1px solid var(--glass-border);border-radius:24px;padding:22px 30px;
  font-size:19px;font-weight:700;color:var(--text);letter-spacing:-.02em;
  box-shadow:0 20px 60px rgba(18,26,22,.28);
  transform:scale(.7);transition:transform .55s var(--bounce)}
.celebrate.show .cel-card{transform:scale(1)}
.confirm-btn{flex-shrink:0;margin-left:8px;background:var(--brand);color:#fff;font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 13px;box-shadow:var(--sh-sm)}
.confirm-btn:active{transform:scale(.93)}
.dup-btn{flex-shrink:0;margin-left:8px;width:30px;height:30px;border-radius:999px;display:grid;place-items:center;color:var(--text-3);background:var(--surface-2)}
.dup-btn:active{transform:scale(.88);color:var(--text)}
.ha-ic{width:38px;height:38px;border-radius:11px;background:var(--expense);color:#fff;display:grid;place-items:center;flex-shrink:0}
.ha-ic svg{width:19px;height:19px}
.ha-b{flex:1;min-width:0}
.ha-t{font-weight:700;font-size:14px;color:var(--expense)}
.ha-s{font-size:12.5px;color:var(--text-2);font-weight:500;margin-top:2px}
.ha-c{color:var(--expense);flex-shrink:0}.ha-c svg{width:18px;height:18px}

.balance-head.neg .v{color:var(--expense)}

/* 잔액 부족 경고 — 사각 배경 대신 아이콘 색 + 점으로 (물방울과 겹치지 않게) */
.nav-btn.warn{color:var(--expense)}
.nav-btn.warn.on{color:var(--expense)}
.nav-badge{position:absolute;top:6px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  background:var(--expense);color:#fff;font-size:10.5px;font-weight:700;font-style:normal;line-height:17px;text-align:center;
  box-shadow:0 0 0 2px var(--glass),0 2px 6px -1px var(--expense);
  opacity:0;transform:scale(.5);transition:opacity .25s,transform .45s var(--bounce);pointer-events:none}
.nav-badge.on{opacity:1;transform:scale(1);animation:warnPulse 2.4s ease-in-out infinite}
@keyframes warnPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.9}}
/* 경고 탭이 선택되면 물방울도 경고색으로 */
.nav-blob.warn{background:var(--expense-soft);box-shadow:0 4px 14px -4px var(--expense),0 1px 0 rgba(255,255,255,.5) inset}

/* auth screen */
.auth-view{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:0 22px;padding-top:max(48px,calc(env(safe-area-inset-top) + 40px));padding-bottom:40px}
.auth-card{width:100%;max-width:400px;margin:auto 0}
.auth-logo{width:66px;height:66px;border-radius:20px;background:var(--brand-tint);display:grid;place-items:center;font-size:34px;margin:0 auto 14px}
.boot-splash{position:fixed;inset:0;z-index:1001;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.boot-splash .auth-logo{margin:0}
.boot-spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--brand);animation:bootSpin .8s linear infinite}
@keyframes bootSpin{to{transform:rotate(360deg)}}
.auth-title{text-align:center;font-size:24px;font-weight:700;letter-spacing:-.03em}
.auth-sub{text-align:center;color:var(--text-2);font-size:13.5px;font-weight:500;margin:6px 0 22px}
.kakao-btn{width:100%;height:52px;border-radius:14px;background:#FEE500;color:#191600;font-size:15.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--spring)}
.kakao-btn:active{transform:scale(.98)}.kakao-btn .kico{display:inline-flex}.kakao-btn .kico svg{width:20px;height:20px}
.auth-div{display:flex;align-items:center;gap:12px;margin:18px 2px;color:var(--text-3);font-size:12px;font-weight:600}
.auth-div::before,.auth-div::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-seg{display:flex;background:var(--sunken);border-radius:12px;padding:4px;margin-bottom:14px}
.auth-seg button{flex:1;height:38px;border-radius:9px;font-size:14px;font-weight:700;color:var(--text-2)}
.auth-seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-sm)}
.auth-field{margin-bottom:12px}.auth-field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.auth-field input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 14px;font-size:16px;color:var(--text);outline:none;transition:border .15s}
.auth-field input:focus{border-color:var(--brand)}
.auth-err{color:var(--expense);font-size:13px;font-weight:600;margin:2px 2px 10px}
.auth-submit{width:100%;margin-top:4px}
.auth-guest{display:block;width:100%;height:44px;margin-top:10px;font-size:14px;font-weight:700;color:var(--text-2)}
.auth-guest:active{color:var(--text)}
.auth-forgot{display:block;width:100%;text-align:center;font-size:12.5px;font-weight:600;color:var(--text-3);text-decoration:underline;margin-top:2px}
.auth-forgot:active{color:var(--text-2)}
.auth-bio{height:48px;font-size:14.5px;margin-bottom:16px}
.auth-note{font-size:11.5px;color:var(--text-3);line-height:1.65;margin-top:16px;text-align:center}
.auth-note b{color:var(--text-2)}
.kkey{margin-top:12px;padding:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);text-align:left}
.kkey label{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.kkey input{width:100%;height:46px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;font-size:14px;color:var(--text);outline:none}
.kkey input:focus{border-color:var(--brand)}
.kkey-row{display:flex;gap:8px;margin-top:10px}.kkey-row .btn{height:44px}
.kkey-help{font-size:11.5px;color:var(--text-3);line-height:1.6;margin-top:10px}
.kkey-help b{color:var(--text-2)}

/* account card + menu footer actions */
.acct-card{padding:14px 16px;margin-bottom:14px}
.acct-head{display:flex;align-items:center;gap:12px}
.acct-av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--brand-tint);flex-shrink:0}
.acct-i .an{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-i .ak{font-size:12.5px;color:var(--text-3);font-weight:600;margin-top:2px}
.acct-card .mc{color:var(--text-3)}.acct-card .mc svg{width:18px;height:18px}
.menu-foot-actions{display:flex;gap:10px;margin-top:14px}
.mfa{flex:1;height:48px;border-radius:14px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);transition:transform .15s var(--spring)}
.mfa svg{width:17px;height:17px}.mfa:active{transform:scale(.97)}
.mfa.danger{color:var(--expense);border-color:transparent;background:var(--expense-soft)}
.help-body{font-size:13.5px;line-height:1.7;color:var(--text-2)}
.help-body p{margin-bottom:14px}.help-body b{color:var(--text);font-weight:700}


/* spending analysis */
.spend-row{display:flex;align-items:center;gap:11px;padding:10px 0;cursor:pointer}
.spend-row+.spend-row{border-top:1px solid var(--line)}
.spend-av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.spend-av svg{width:17px;height:17px}
.spend-mid{flex:1;min-width:0}
.spend-nm{font-size:14px;font-weight:700}
.trend{font-size:11px;font-weight:600}
.spend-track{height:7px;border-radius:5px;background:var(--sunken);margin-top:6px;overflow:hidden}
.spend-track i{display:block;height:100%;background:var(--expense);border-radius:5px}
.spend-track i.budgeted{background:var(--brand)}
.spend-track i.over{background:var(--expense)}
.spend-track i.income{background:var(--income)}
.spend-amt{text-align:right;flex-shrink:0}
.spend-amt .a{font-size:14px;font-weight:700}.spend-amt .p{font-size:11px;color:var(--text-3);font-weight:600;margin-top:1px}
.spend-amt .a.over,.spend-amt .p.over{color:var(--expense)}
.spend-amt .a .bgt{font-size:11px;font-weight:600;color:var(--text-3)}


@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="bootSplash" class="boot-splash"><div class="auth-logo">💰</div><div class="boot-spin"></div></div>
<div class="err-banner" id="errBanner" role="alert"></div>
<div id="authView" class="auth-view" style="display:none"></div>
<div id="lockView" class="auth-view" style="display:none"></div>
<div id="app">
  <div class="viewport">
    <section class="page active" id="page-home"></section>
    <section class="page" id="page-assets"></section>
    <section class="page" id="page-ledger"></section>
    <section class="page" id="page-history"></section>
    <section class="page" id="page-plan"></section>
    <section class="page" id="page-menu"></section>
  </div>
  <div class="ad-slot" id="adSlot">카카오페이지 · 지금 바로 열기</div>
  <nav class="bottom-nav" id="nav"></nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
<div class="dp-scrim" id="dpScrim"></div>
<div class="dp-modal" id="dpModal" role="dialog" aria-modal="true" aria-label="날짜 선택"></div>
<div class="dp-wheel" id="dpWheel" role="dialog" aria-modal="true"></div>
<div class="fab-pop" id="fabPop"></div>
<button class="fab" id="fab" onclick="fabTap()" aria-label="추가"></button>
<div class="selbar-bottom" id="selBarBottom"></div>
<div class="sw-update-bar" id="swUpdateBar" onclick="reloadForUpdate()" role="button" tabindex="0" onkeydown="rowKeydown(event,reloadForUpdate)"></div>
<div class="install-bar" id="installBar" role="button" tabindex="0" onclick="onInstallBarClick()" onkeydown="rowKeydown(event,onInstallBarClick)"></div>
<div class="toast-wrap" id="toastWrap"></div>
<div class="sr-only" id="ariaLivePolite" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="sr-only" id="ariaLiveAssertive" role="alert" aria-live="assertive" aria-atomic="true"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">
<input type="file" id="importCsvFile" accept="text/csv,.csv" style="display:none">

<!-- TODO(SRI): 세 CDN 리소스(pretendard/kakao/supabase, 28행 포함)에 integrity(SRI) 해시를 추가할 것.
     이 컨테이너의 네트워크 정책이 cdn.jsdelivr.net/t1.kakaocdn.net egress를 차단해 실제 응답 바이트로
     해시를 계산할 수 없었다 — 틀린 해시를 넣으면 브라우저가 무결성 불일치로 스크립트 실행을 막아
     Kakao 로그인/Supabase 동기화가 전면 중단되므로(하지 않느니만 못함), 억지로 채우지 않았다.
     CDN 접근이 가능한 환경에서 각 URL의 실제 응답을 내려받아 sha384 해시를 계산해 채울 것. -->
<script>
/* Kakao SDK/Supabase JS를 정적 <script src>(파서 블로킹) 대신 동적 로더로 올린다. sw.js는 타 origin
 * 요청을 캐싱하지 않으므로(오프라인 캐시 대상 밖) 이 두 스크립트는 PWA 오프라인 설계의 유일한 예외였다 —
 * 캡티브 포털/불안정 네트워크에서 TCP 연결이 수초~수십초 행(hang)하면 boot()도, window.onerror도,
 * 게스트 전용 로컬 기능조차 전혀 못 뜨고 화면이 완전히 빈 채로 멈췄다. loadScriptWithTimeout은
 * 성공/실패/타임아웃을 구분하지 않고 항상 resolve하는 Promise를 돌려줘(withTimeout/fetchWithTimeout과
 * 같은 타임아웃 관례), boot()이 SDK_READY를 기다리더라도 최악의 경우에도 6초 뒤엔 반드시 풀려난다. */
function loadScriptWithTimeout(src,ms){
 return new Promise(resolve=>{
  let done=false;
  const finish=()=>{if(done)return;done=true;clearTimeout(timer);resolve()};
  const timer=setTimeout(finish,ms||6000);
  const el=document.createElement('script');
  /* crossOrigin을 일부러 설정하지 않는다 — Kakao SDK 호스트(t1.kakaocdn.net)가 CORS 헤더를
   * 내려주지 않으면 'anonymous'는 로드 자체를 막아버리고(일반 <script src>면 성공할 요청이
   * 실패로 바뀜), recordError()(아래 전역 에러 바운더리)의 'crossorigin 없는 서드파티 스크립트의
   * Script error.는 조용히 무시한다' 필터도 crossOrigin이 있으면 무력화된다. */
  el.src=src;
  el.onload=finish;el.onerror=finish;
  document.head.appendChild(el);
 });
}
const SDK_READY=Promise.all([
 loadScriptWithTimeout('https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js'),
 loadScriptWithTimeout('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js')
]);
</script>

/* ================= PWA 설치 유도 배너 =================
 * manifest.webmanifest/iOS 메타는 설치 기준을 이미 다 만족하지만, 설치 가능하다는 사실을
 * 알려주는 UI가 전혀 없었다(app-evolve cycle236 critique). beforeinstallprompt(Android/Chrome)를
 * 캡처해 직접 들고 있다가 배너 탭 시 띄우고, beforeinstallprompt가 영영 안 뜨는 iOS Safari는
 * UA로 감지해 "공유 → 홈 화면에 추가" 안내 문구로 분기한다. 이미 설치된 사용자에게는 절대
 * 다시 띄우지 않는다. IS_IOS는 이 함수들보다 한참 아래(라인 ~6336)에서 선언되지만, 이
 * 함수들은 이벤트/부팅 시점에만 "실행"되고 그 시점엔 이미 스크립트 전체가 로드돼 있으므로
 * 참조에 문제가 없다(라인 5534의 기존 함수가 이미 같은 방식으로 IS_IOS를 참조 중). */
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
function installSnoozed(){let t=0;try{t=+(localStorage.getItem('asset_app_install_dismiss_ts')||0)}catch(e){}return Date.now()<t}
/* 첫 실행 즉시 설치를 들이밀면 거부감만 키우므로(tidyList 등과 같은 원칙), 최소 3회 실행 후부터
 * 노출 대상으로 본다. 카운터 증가는 boot당 1회만 일어나야 하므로 startApp()에서만 부른다 —
 * installBarVisible() 자체는 카운터를 건드리지 않아 몇 번을 불러도 상태가 바뀌지 않는다. */
function bumpInstallVisitCount(){let n=0;try{n=(parseInt(localStorage.getItem('asset_app_visit_count'),10)||0)+1;localStorage.setItem('asset_app_visit_count',String(n))}catch(e){}}
function installVisitGateOk(){let n=0;try{n=parseInt(localStorage.getItem('asset_app_visit_count'),10)||0}catch(e){}return n>=3}
function installBarVisible(){
 if(isStandalone())return false;
 if(SW_UPDATE_AVAILABLE)return false; /* 업데이트 배너가 더 급함 — 동시에 띄우지 않는다 */
 try{if(localStorage.getItem('asset_app_installed')==='1')return false}catch(e){}
 if(installSnoozed())return false;
 if(!installVisitGateOk())return false;
 if(IS_IOS)return true; /* iOS는 beforeinstallprompt가 없어 캡처 여부와 무관하게 안내문구만 보여준다 */
 return !!window._deferredInstallPrompt;
}
function maybeShowInstallBar(){
 const el=$('installBar');if(!el)return;
 if(!installBarVisible()){el.classList.remove('show');return}
 el.innerHTML=svg('download',18)+(IS_IOS
   ?'<span class="ib-txt">홈 화면에 추가하면 더 빠르게 열 수 있어요 · 공유 버튼 → 홈 화면에 추가</span>'
   :'<span class="ib-txt">홈 화면에 추가하고 더 빠르게 열어보세요</span>')
   +'<button type="button" class="ib-x" onclick="event.stopPropagation();dismissInstallBar()">나중에</button>';
 el.classList.add('show');
}
function hideInstallBar(){const el=$('installBar');if(el)el.classList.remove('show')}
function dismissInstallBar(){
 try{localStorage.setItem('asset_app_install_dismiss_ts',String(Date.now()+14*24*60*60*1000))}catch(e){}
 hideInstallBar();
 toast('14일 뒤에 다시 알려드릴게요');
}
function onInstallBarClick(){
 if(IS_IOS){toast('공유 버튼을 눌러 "홈 화면에 추가"를 선택하세요');return}
 const p=window._deferredInstallPrompt;if(!p)return;
 p.prompt();
 p.userChoice.then(()=>{window._deferredInstallPrompt=null;hideInstallBar()}).catch(()=>{});
}
/* beforeinstallprompt는 로드당 한 번만 뜨고, 리스너가 미리 붙어 있어야 잡히므로 가능한 한 일찍
 * 최상위 스코프에서 등록한다(boot()/startApp() 뒤로 미루지 않음). */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._deferredInstallPrompt=e;maybeShowInstallBar()});
window.addEventListener('appinstalled',()=>{
 window._deferredInstallPrompt=null;
 try{localStorage.setItem('asset_app_installed','1')}catch(e){}
 hideInstallBar();
});

/* ================= 전역 에러 바운더리 =================
 * recordError()가 로깅과 사용자 노출(showErrBanner)을 모두 담당하는 단일 지점이다.
 * renderCurrent() 내부 try/catch뿐 아니라 window.onerror/unhandledrejection이 잡는
 * 나머지 모든 미처리 예외(onclick 핸들러 등, renderCurrent() 이전에 던져진 것 포함)도
 * 여기로 모여 배너로 노출된다 — 그래야 "탭해도 반응 없음"으로만 보이는 silent failure가
 * 없다. crossorigin 속성 없는 서드파티 스크립트(Supabase 등)에서 오는 정보 없는
 * 'Script error.'(err가 Error 인스턴스가 아님)까지 배너로 띄우면 소음이 되므로,
 * renderCurrent 예외이거나 err가 Error 인스턴스인 경우에만 노출한다. */
let lastError=null;
function recordError(err,kind){
 lastError={kind,message:(err&&err.message)||String(err),stack:(err&&err.stack)||'',time:Date.now()};
 console.error('[app-error]',kind,err);
 if(kind==='renderCurrent'||err instanceof Error)showErrBanner();
}
window.onerror=(msg,src,line,col,err)=>{recordError(err||msg,'onerror')};
window.addEventListener('unhandledrejection',e=>{recordError(e&&e.reason,'unhandledrejection')});
function showErrBanner(){
 const el=$('errBanner');if(!el)return;
 if(!el.childElementCount)el.innerHTML=svg('alert',20)+'<span>문제가 발생했어요. 새로고침해 주세요.</span><button onclick="location.reload()">새로고침</button>';
 el.classList.add('show');
}
function hideErrBanner(){
 const el=$('errBanner');if(el)el.classList.remove('show');
}

function _saveCore(opts){invalidateBalances(opts&&opts.fromDate,opts);

  * 반영을 closeSheet()로 미루는데, saveTx/saveAsset/saveRec 등 모든 저장 흐름은 closeSheet()보다
  * save()를 먼저 부르므로 그 사이 이 탭이 save()를 호출하면 병합 없이 자신의(다른 탭 변경을 모르는)

/* storage 이벤트로 들어온 다른 탭의 __savedAt 문자열이 이 탭이 마지막으로 알고 있던 시각(TAB_SAVED_AT)보다

function applyForeignSave(at){

 if(!raw)return;

/* 시트가 열려 있으면(편집 중인 드래프트가 있을 수 있음) 곧바로 덮어쓰지 않고 비파괴적으로만 알리고,

/* ================= RECURRENCE ================= */
/* recDates()/expandRec() 확장 결과 캐시: DB.recurrences가 바뀌지 않는 한 같은 [from,to]는
   매 렌더/저장마다 다시 순회할 필요가 없다. _balCache와 같은 규칙으로 invalidateBalances()에서
   함께 비운다(balancesUpTo()가 이미 allTxns()->expandRec()를 거쳐 DB.recurrences에 의존하므로
   기존 무효화 지점들이 이미 이 캐시에도 유효한 계약이다). */
const REC_CACHE_MAX=40;
const _recCache=new Map();
function expandRec(from,to){
 const key=from+'|'+to;
 if(_recCache.has(key))return _recCache.get(key);
 const out=[];
 DB.recurrences.forEach(r=>{if(!r.active)return;
  recDates(r,from,to).forEach(d=>{
   if((r.skip||[]).includes(d))return;
   const ed=(r.edits||{})[d]||{};
   out.push({id:'rec_'+r.id+'_'+d,recId:r.id,date:d,type:r.type,category:r.category,
     memo:ed.memo!=null?ed.memo:r.memo,amount:ed.amount!=null?ed.amount:r.amount,
     fromAssetId:r.fromAssetId,toAssetId:r.toAssetId,fromAssetName:r.fromAssetName,toAssetName:r.toAssetName,isRec:true});
  });
 });
 _recCache.set(key,out);
 if(_recCache.size>REC_CACHE_MAX)_recCache.delete(_recCache.keys().next().value);
 return out;
}
function allTxns(from,to){return DB.txns.filter(t=>t.date>=from&&t.date<=to).concat(expandRec(from,to))}
/* 가계부 달력: calCellsFor()가 셀(최대 42개)마다 dayTxns()→allTxns()를 개별 호출하면
   3개월(이전/현재/다음) 패널을 렌더할 때마다 전체 거래를 수십 번 다시 스캔한다.
   allTxns()를 범위 전체에 한 번만 불러 날짜별로 버킷화해두면 셀마다 Map 조회 한 번으로 끝난다. */
function txnsByDateInRange(from,to){
 const map=new Map();

}
const RANGE_FROM='2023-01-01';let RANGE_TO=addDays(TODAY,760);

   저장/가져오기/복원 전에 이 헬퍼들로 걸러내 '저장은 됐는데 잔액엔 안 잡히는' 상태를 막는다 */

function assetEval(a){
 const R=DB.rates;

  default: return assetBalance(a.id); /* 현금·저축·부동산·부채·연금 등: 기준액 + 모든 입출금(잔액식) */

function assetBase(a){return a.baseAmount!=null?a.baseAmount:(a.amountKRW||0)}
/* ④ 이번 달 지출 카테고리별 합계 (지출만 · 큰 순) */
function expenseByCat(y,m){

/* 잔액 다중 슬롯 캐시: 렌더 1회 동안(서로 다른 날짜로 여러 번 불려도) 자산별 잔액을 재사용.

 * allTxns(RANGE_FROM,upto)가 fromDate 이전 거래만 재생한 결과라 이번 변경으로 절대 바뀔 수
 * 없음이 보장되므로 그대로 재사용해도 안전하다(그 밖엔 전부 제거)(app-evolve cycle204 advance,

 * 명시적으로 false로 넘긴 호출부(saveTx의 비반복 거래 저장, deleteTxnsUndo, 잔액조정/만기이체 보조

function invalidateBalances(fromDate,opts){

function balancesUpTo(dateStr){

 if(_balCache.has(key))return _balCache.get(key);
 const map={},sign={};
 DB.assets.forEach(a=>{map[a.id]=assetBase(a);sign[a.id]=(a.type==='debt'?-1:1)});
 /* allTxns를 항상 고정폭 (RANGE_FROM,RANGE_TO)로 불러 expandRec()의 _recCache가 [from,to] 키를
    공유하게 한다 — dateStr마다 다른 upto를 그대로 넘기면 매 호출이 새 캐시 키가 되어, 렌더 한 번
    안에서 서로 다른 날짜로 balanceAt을 여러 번 부를 때마다(플랜/자산 상세 등) daily/weekly

 allTxns(RANGE_FROM,RANGE_TO).forEach(t=>{

   키(tx:<id>:dir / rec:<id>:dir)가 영구히 남아 DB.settings에 쌓이고 백업·클라우드 동기화

/* nwhChart/assetBalChart(두 차트 모두 {date,nw} 모양의 pts 배열을 공유)의 스크러버 라인+라벨을
 * idx 위치로 그린다 — 포인터로 짚었을 때(nwChartPeekMove/assetBalPeekMove)와 키보드로 이동했을 때
 * (nwChartPeekKey/assetBalPeekKey) 양쪽에서 똑같이 쓰는 공용 렌더러(app-evolve cycle142
 * critique/advance, 중복 제거 겸 키보드 접근성 추가). */
function chartPeekRenderAt(pts,lineElId,labelElId,prefix,idx){
 const p=pts[idx];
 const totalDays=Math.max(1,daysBetween(pts[0].date,pts[pts.length-1].date));
 const x=daysBetween(pts[0].date,p.date)/totalDays*300;
 const line=$(lineElId);if(line){line.setAttribute('x1',x.toFixed(1));line.setAttribute('x2',x.toFixed(1));line.style.display='';}
 const label=$(labelElId);if(label){label.textContent=`${shortDate2(p.date)} · ${comma(p.nw)}원`;label.style.left=Math.max(4,Math.min(96,x/300*100))+'%';label.classList.add('on');}
 announceLive(`${shortDate2(p.date)} ${prefix} ${comma(p.nw)}원`);
}
let _nwChartPts=null,_nwPeekIdx=null;
/* 차트를 누르고 있는 동안 가장 가까운 스냅샷의 날짜·금액을 보여준다(포인터 이동마다, 손 떼면 숨김).
 * 좌표 매핑은 nwChartPath가 그릴 때 쓰는 것과 똑같이 '날짜 간격 비례'라야(nwNearestPointIndex,
 * logic.js) 손가락 위치와 그려진 점이 실제로 맞아떨어진다. svg는 장식용이라 aria-hidden을 그대로
 * 유지하고, 대신 announceLive()로 화면엔 안 보이는 aria-live 리전에 같은 정보를 읽어준다. */
function nwChartPeekStart(e){
 const el=$('nwhChart');if(!el||!_nwChartPts||_nwChartPts.length<2)return;
 if(el.setPointerCapture&&e.pointerId!=null)try{el.setPointerCapture(e.pointerId)}catch(err){}
 nwChartPeekMove(e);
}
function nwChartPeekMove(e){
 const el=$('nwhChart');if(!el||!_nwChartPts||_nwChartPts.length<2)return;
 const rect=el.getBoundingClientRect();if(!rect.width)return;
 const ratio=(e.clientX-rect.left)/rect.width;
 const idx=nwNearestPointIndex(_nwChartPts,ratio);
 if(idx<0||idx===_nwPeekIdx)return;
 _nwPeekIdx=idx;
 chartPeekRenderAt(_nwChartPts,'nwhPeekLine','nwhPeekLabel','순자산',idx);
}
/* nwChartPeekMove(포인터)와 짝이 되는 키보드 경로 — ArrowLeft/Right로 이전/다음 스냅샷, Home/End로
 * 양끝, Escape로 숨김(pointerleave와 동일). nwChartKeyStep(logic.js)이 다음 인덱스를 고른다. */
function nwChartPeekKey(e){
 if(!_nwChartPts||_nwChartPts.length<2)return;
 if(e.key==='Escape'){nwChartPeekEnd();return;}
 if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
 e.preventDefault();
 const idx=nwChartKeyStep(_nwPeekIdx,e.key,_nwChartPts.length);
 if(idx<0||idx===_nwPeekIdx)return;
 _nwPeekIdx=idx;
 chartPeekRenderAt(_nwChartPts,'nwhPeekLine','nwhPeekLabel','순자산',idx);
}
function nwChartPeekEnd(){
 _nwPeekIdx=null;
 const line=$('nwhPeekLine');if(line)line.style.display='none';
 const label=$('nwhPeekLabel');if(label)label.classList.remove('on');
}

/* 전체내역 탭에서 특정 계좌로 필터링했을 때(openAssetHistory) 꽂는 잔액 추이 미니 차트.

 * (app-evolve cycle140 critique/advance — renderAssetSheet/openAssetHistory 둘 다 개별 자산의
 * 현재 금액만 보여주고 추이가 전혀 없던 공백 해소). */
function assetBalCard(assetId,preset){
 preset=preset||'m3';
 const a=DB.assets.find(x=>x.id===assetId);
 if(!a||!['cash','savings','realestate','etc','pension','debt'].includes(a.type))return '';
 const segHTML=`<div class="seg nwh-seg" role="group" aria-label="기간 선택"><div class="seg-blob"></div>${[['m1','1개월'],['m3','3개월'],['y1','1년'],['all','전체']].map(([p,l])=>`<button type="button" class="${preset===p?'on':''}" aria-pressed="${preset===p}" onclick="assetBalPresetSel('${a.id}','${p}')">${l}</button>`).join('')}</div>`;
 const to=TODAY;
 const days={m1:30,m3:90,y1:365}[preset];
 let from=days?addDays(to,-days):RANGE_FROM;
 if(from<RANGE_FROM)from=RANGE_FROM;
 const dates=assetBalSampleDates(from,to,60);
 const txns=allTxns(RANGE_FROM,to).filter(t=>!isPending(t));
 const series=assetBalanceSeries(txns,a.id,assetBase(a),a.type==='debt'?-1:1,dates);
 const pts=series.map(p=>({date:p.date,nw:p.bal}));
 if(pts.length<2)return `<div class="card nwh-card">
   <div class="section-title" style="margin-top:0">잔액 추이</div>
   ${segHTML}
   <div class="empty" style="padding:18px 0"><div class="es">이 계좌의 추이는 곧 쌓여요</div></div>
 </div>`;
 const {line,area}=nwChartPath(pts,300,80);
 const first=pts[0],last=pts[pts.length-1];
 const diff=last.nw-first.nw,up=diff>=0;
 const color=up?'var(--income)':'var(--expense)';
 _assetBalChartPts=pts;
 /* debt 전용 상환완료 예상일 투사 — goalRowHTML의 '이대로면 YYYY쯤 달성 예상' 문구 패턴과 어조를 맞춘다.
    debtPayoffProjection은 내부적으로 최근 90일 추세만 본다는 계약이 있는데(trendWindowDays
    기본값), 차트의 '1개월' 프리셋처럼 pts 자체가 90일보다 짧으면 그 cutoff 필터가 무력화되어
    훨씬 짧은 구간의 추세로 투사일이 왜곡된다(app-evolve cycle189 develop). 그래서 화면에 그리는
    pts(preset에 따라 짧을 수 있음)와는 별도로, 투사 전용 pfPts를 항상 최근 90일(또는 RANGE_FROM
    까지) 고정 구간으로 다시 샘플링해 선택된 기간 탭과 무관하게 같은 투사일이 나오게 한다. */
 let payoffHTML='';
 if(a.type==='debt'){
  let pfFrom=addDays(to,-90);
  if(pfFrom<RANGE_FROM)pfFrom=RANGE_FROM;
  let pfPts;
  if(pfFrom===from){
   pfPts=pts.map(p=>({date:p.date,bal:p.nw}));
  }else{
   const pfDates=assetBalSampleDates(pfFrom,to,60);
   const pfSeries=assetBalanceSeries(txns,a.id,assetBase(a),-1,pfDates);
   pfPts=pfSeries.map(p=>({date:p.date,bal:p.bal}));
  }
  const pf=debtPayoffProjection(pfPts,TODAY);
  payoffHTML=`<div class="msub2" style="margin-top:4px">${pf.achieved?'이미 다 갚았어요':pf.projectedDate?`이 속도로 갚으면 ${shortDate2(pf.projectedDate)}쯤 다 갚아요`:'최근엔 줄어들고 있지 않아요'}</div>`;
 }
 return `<div class="card nwh-card">
   <div class="section-title" style="margin-top:0">잔액 추이</div>
   ${segHTML}
   <div class="nwh-range">${shortDate2(first.date)} ~ ${shortDate2(last.date)} <b class="${up?'':'minus'}">${up?'+':''}${comma(diff)}원</b></div>
   <div class="nwh-chart" id="assetBalChart" tabindex="0" role="img" aria-label="잔액 추이 차트, 화살표 키로 날짜별 값 탐색" onpointerdown="assetBalPeekStart(event)" onpointermove="assetBalPeekMove(event)" onpointerup="assetBalPeekEnd()" onpointercancel="assetBalPeekEnd()" onpointerleave="assetBalPeekEnd()" onkeydown="assetBalPeekKey(event)" onblur="assetBalPeekEnd()">
     <svg viewBox="0 0 300 80" preserveAspectRatio="none" aria-hidden="true" focusable="false">
       <path d="${area}" fill="${color}" opacity="0.12" stroke="none"/>
       <path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
       <line id="assetBalPeekLine" x1="0" x2="0" y1="0" y2="80" stroke="var(--text-3)" stroke-dasharray="2,2" style="display:none"/>
     </svg>

 </div>`;
}

/* 자산관리 탭 순자산 추이 카드 아래에 꽂는 자산유형별 비중(allocation) 카드 — expenseBreakdownCard와
 * 같은 스택형 가로 막대+범례(eb-* 클래스)를 재사용한다. 집계 자체(assetAllocation)는 logic.js 순수
 * 함수이고, 여기선 owner/includeInTotal/부채 제외 필터링과 assetEval 평가(DB.rates 의존)만 맡는다
 * (app-evolve cycle125 critique/advance — TYPE_COLOR 상수가 정의된 채 미사용으로 남아있던 공백). */
function allocationCard(owner){
 owner=owner||'all';
 let items=DB.assets.filter(a=>a.includeInTotal&&a.type!=='debt');
 if(owner!=='all')items=items.filter(a=>a.owner===owner);
 const alloc=assetAllocation(items.map(a=>({type:a.type,amount:assetEval(a)})));
 if(!alloc.length)return '';
 // 퍼센트 합이 정확히 100이 되도록 보정 (expenseBreakdownCard와 동일한 최대 잔여법)
 const floor=alloc.map(x=>Math.floor(x.pct));
 let rem=100-floor.reduce((s,v)=>s+v,0);
 const order=alloc.map((x,i)=>({i,frac:x.pct-Math.floor(x.pct)})).sort((a,b)=>b.frac-a.frac);
 for(let k=0;k<rem&&k<order.length;k++)floor[order[k].i]++;
 const seg=alloc.map(x=>`<i style="width:${x.pct}%;background:${TYPE_COLOR[x.type]}"></i>`).join('');
 const rows=alloc.map((x,i)=>
   `<div class="eb-row"><span class="eb-dot" style="background:${TYPE_COLOR[x.type]}"></span>
     <span class="eb-cat">${esc(ASSET_TYPES[x.type].label)}</span><span class="eb-pc num">${floor[i]}%</span><span class="eb-v num">${comma(Math.round(x.amount))}원</span></div>`).join('');
 /* assetAllocation()은 rateUnknown(시세 미확인) 자산을 amount=0으로 받아 분모(total)에는 포함하되
  * 집계 맵에서는 빼버린다(logic.js 주석) — 그 결과 이 함수의 퍼센트 잔여 보정(바로 위 floor 로직)이
  * "보이는 유형들"의 퍼센트 합을 억지로 100%까지 끌어올려, 시세를 아직 못 받아온 자산의 몫이 다른
  * 유형들에게 조용히 흡수돼 보인다(예: 현금 90만 + 시세미확인 주식 100만이면 전체는 190만인데 이
  * 카드는 "현금 100%"만 보여줘 주식이 존재 자체를 모르게 됨). nwPane()/assetBodyHTML() 그룹소계가
  * 이미 쓰는 "산술은 그대로 두고 캡션만 붙인다" 원칙(app-evolve cycle183 advance)을 이 카드에도
  * 그대로 적용한다 — cycle183은 히어로/그룹소계/행 배지까지만 다루고 이 비중 카드는 비워뒀었다. */
 const hasUnknown=items.some(rateUnknown);
 /* assetAllocation()이 이제 음수 평가액(마이너스통장 등)을 분모·집계 둘 다에서 제외한다(logic.js,
  * app-evolve cycle187 advance) — 위 "일부 미확인" 캡션과 같은 이유로, 그 자산유형 자체가 왜 이
  * 카드에 안 보이는지 설명 없이는 사용자가 알 길이 없다. */
 const hasNeg=items.some(a=>assetEval(a)<0);
 const captions=[hasUnknown?'일부 미확인':null,hasNeg?'마이너스 잔액 자산 제외':null].filter(Boolean)
   .map(c=>` <span class="mini warn">${c}</span>`).join('');
 return `<div class="section-title">자산 비중${captions}</div>
   <div class="card eb-card"><div class="eb-bar">${seg}</div><div class="eb-list">${rows}</div></div>`;
}

/* 자산 비중 카드 바로 아래에 꽂는 투자자산 전체 손익 카드 — assetGainLoss(a)/assetGainLossBadge가
 * 자산 1건씩만 행 배지로 보여주던 걸(assetSubline, 3479행대) 전체 합산 관점으로 보완한다
 * (app-evolve cycle226 critique/advance — 총자산/비중/순자산추이/목표는 전체 합산 카드가 있는데
 * 투자 손익만 없던 공백). 집계(portfolioGainLoss)는 logic.js 순수 함수, 여기선 allocationCard와
 * 동일하게 owner/includeInTotal 필터링과 assetEval/rateUnknown 평가만 맡는다. */
function investGainLossCard(owner){
 owner=owner||'all';
 let items=DB.assets.filter(a=>a.includeInTotal&&isMarketValued(a));
 if(owner!=='all')items=items.filter(a=>a.owner===owner);
 const usable=items.filter(a=>a.costBasis>0&&!rateUnknown(a));
 const gl=portfolioGainLoss(usable.map(a=>({evalValue:assetEval(a),costBasis:a.costBasis})));
 if(!gl)return '';
 const up=gl.amount>=0;
 /* assetGainLoss()와 같은 이유(rateUnknown 시점의 매입가 전액손실 오표시 방지)로 costBasis 미입력/
  * 시세 미확인 자산은 집계에서 통째로 빠진다 — "일부만 더한 값"임을 숨기지 않고 캡션으로 안내한다
  * (allocationCard의 hasUnknown/hasNeg 캡션과 동일한 "산술은 그대로 두고 캡션만 붙인다" 원칙). */
 const hasNoCostBasis=items.some(a=>!(a.costBasis>0));
 const hasUnknown=items.some(a=>a.costBasis>0&&rateUnknown(a));
 const captions=[hasNoCostBasis?'매입가 미입력 자산 제외':null,hasUnknown?'시세 미확인 자산 제외':null].filter(Boolean)
   .map(c=>` <span class="mini warn">${c}</span>`).join('');
 return `<div class="section-title">투자 손익${captions}</div>
   <div class="card eb-card"><div class="eb-list">
     <div class="eb-row"><span class="eb-cat">평가손익</span>
       <span class="eb-v num" style="color:var(--${up?'income':'expense'})">${up?'+':''}${gl.pct.toFixed(1)}% · ${up?'+':''}${comma(gl.amount)}원</span></div>
     <div class="eb-row"><span class="eb-cat">총매입</span><span class="eb-v num">${comma(gl.totalCost)}원</span></div>
     <div class="eb-row"><span class="eb-cat">총평가</span><span class="eb-v num">${comma(gl.totalEval)}원</span></div>
   </div></div>`;
}

/* ===== 순자산 목표 (MVP: 순자산 1종, DB.goals) =====
   진행률·투사(goalProgress)는 logic.js 순수 함수 — 여기는 렌더/폼만 담당. */
function goalOwnerEff(g){ /* goal.owner가 'all'이거나 이미 사라진 귀속이면 전체로 간주 — ST.assetOwner/renderAssets의
 "귀속 사라지면 전체로" 가드(doRenameOwner는 이름변경 시 goal.owner를 함께 옮기지만, delOwner처럼 자산이 하나도
 없는 귀속은 삭제가 가능해 goal.owner만 낡은 이름으로 남을 수 있음)와 동일한 원칙을 목표에도 적용한다. */
 const o=g&&g.owner;
 return (o&&o!=='all'&&(DB.owners||[]).includes(o))?o:'all';
}
function nearestGoal(owner){ /* owner(기본 'all')가 추적하는 목표 중 목표일 있는 것 중 가장 가까운 것 → 없으면 등록된 첫 목표 */
 owner=owner||'all';
 const gs=(DB.goals||[]).filter(g=>goalOwnerEff(g)===owner);if(!gs.length)return null;
 const withDate=gs.filter(g=>g.targetDate).sort((a,b)=>a.targetDate<b.targetDate?-1:1);
 return withDate[0]||gs[0];
}
/* 순자산 목표의 cur/pct는 goalProgress()가 nwHistoryForOwner(byOwner 스냅샷)를 그대로 쓰는데,
 * 그 스냅샷은 totalAssets/ownerAssets와 같은 assetEval() 합산이라 시세 미확인(rateUnknown) 자산이
 * 경고 없이 ₩0으로 섞여 들어간다 — nwPane()이 이미 쓰는 "산술은 그대로 두고 캡션만 붙인다" 원칙
 * (app-evolve cycle183 advance)을 목표 화면에도 적용하기 위한 판정(app-evolve cycle186 advance). */
function goalHasUnknown(g){
 if(g.type==='asset'){const a=(DB.assets||[]).find(x=>x.id===g.linkedAssetId);return !!a&&rateUnknown(a)}
 const o=goalOwnerEff(g);
 return (DB.assets||[]).some(a=>a.includeInTotal&&(o==='all'||a.owner===o)&&rateUnknown(a));
}
/* 연결된 자산이 삭제된 asset형 목표 — 자산 1급 전제가 깨진 상태라 cur/추세를 추측하지 않고 중립 안내로 대체한다
 * (nextOutflowCard의 assetNm 스냅샷 폴백과 동일한 "단정하지 않는다" 원칙, app-evolve cycle214 advance) */
function goalLinkedAssetGone(g){return g.type==='asset'&&!(DB.assets||[]).some(a=>a.id===g.linkedAssetId)}
/* 연결된 자산이 살아있지만 더 이상 목표 추적 대상이 아닌 asset형 목표 — openAssetPicker(excludeMarketValued,
 * excludeDebt)가 goalOpenAsset()에서 자산을 "고를 때"만 fx/gold/stock/debt를 막을 뿐, 이미 연결해둔 뒤에
 * asOpenType()으로 그 자산의 종류를 바꾸는 건 아무 제약이 없다. isMarketValued(fx/gold/stock)는 거래가
 * 쌓이는 원장이 아니라 qty×시세로 평가되고, debt는 assetBalanceSeries의 sign 규약이 반대라(자산 +1 ·
 * 부채 -1, assetBalCard/debtPayoffProjection과 동일) goalHistoryFor가 이 자산들에 그대로 sign=1을 쓰면
 * 진행률이 조용히 0%에 멈추거나(시세평가) 상환할수록 목표에서 멀어지는 것처럼(부호 반전) 보인다
 * (app-evolve cycle214 develop). */
function goalLinkedAssetBroken(g){
 if(g.type!=='asset')return false;
 const a=(DB.assets||[]).find(x=>x.id===g.linkedAssetId);
 return !!a&&(isMarketValued(a)||a.type==='debt');
}
/* g.type에 따라 goalProgress에 넘길 이력을 고른다 — 'networth'는 기존처럼 귀속별 순자산 추이(nwHistoryForOwner),
 * 'asset'은 연결된 자산 하나의 잔액 추이를 assetBalCard/debtPayoffProjection과 동일한 방식(assetBalanceSeries)으로
 * 구해 goalProgress가 받는 {date,nw} 모양으로 매핑한다 — goalProgress(logic.js)는 필드 이름만 보고 '순자산'인지
 * '자산 하나의 잔액'인지는 가리지 않으므로 그대로 재사용할 수 있다(새 순수 함수를 만들 필요가 없음).
 * 연결 자산이 삭제됐거나(goalLinkedAssetGone) 더 이상 추적 대상이 아니면(goalLinkedAssetBroken) 빈 배열 —
 * goalProgress(hist.length 0)가 cur:0·achieved:false로 중립 처리하고, homeAlerts의 goalBehind도 hist.length>=2
 * 요건에 걸려 같이 억제된다. */
function goalHistoryFor(g){
 if(g.type==='asset'){
  const a=(DB.assets||[]).find(x=>x.id===g.linkedAssetId);
  if(!a||isMarketValued(a)||a.type==='debt')return [];
  const dates=assetBalSampleDates(RANGE_FROM,TODAY,60);
  const txns=allTxns(RANGE_FROM,TODAY).filter(t=>!isPending(t));
  return assetBalanceSeries(txns,a.id,assetBase(a),1,dates).map(p=>({date:p.date,nw:p.bal}));
 }
 return nwHistoryForOwner(DB.nwHistory,goalOwnerEff(g));
}
function goalRowHTML(g){

 const color=p.achieved?'var(--income)':'var(--brand)';
 const assetGone=goalLinkedAssetGone(g);

 const hasUnknown=goalHasUnknown(g);
 const overdue=goalIsOverdue(g.targetDate,p.achieved,TODAY); /* homeAlerts()의 goalBehind 알림은 hist.length>=2·!hasUnknown을 요구해 안 뜰 때가 있어도, 목표 화면 자체엔 지남 표시가 있어야 함(app-evolve cycle195 develop) */
 return `<div class="pg-row" tabindex="0" role="button" aria-label="${esc(g.name)} 목표 진행률 ${p.pct}%${overdue?' 목표일 지남':''}" onclick="openGoalForm('${g.id}')" onkeydown="rowKeydown(event,()=>openGoalForm('${g.id}'))">

     <span class="pg-nums"><b class="num">${comma(p.cur)}</b><span class="pg-of num"> / ${comma(p.target)}원</span></span></div>
   <div class="pg-bar"><i style="width:${p.pct}%;background:${color}"></i></div>
   ${!p.achieved&&p.projectedDate?`<div class="msub2" style="margin-top:4px">이대로면 ${shortDate2(p.projectedDate)}쯤 달성 예상</div>`:''}
 </div>`;
}
/* 자산관리 탭 순자산 추이 카드 아래에 꽂는 요약 — 지금 캐러셀에서 보고 있는 귀속(owner)의 목표만 보여준다(nwHistoryCard와

 if(!gs.length)return '';

function openGoalsList(){ /* 관리 목록은 캐러셀 귀속과 무관하게 전체 목표를 보여준다 — 각 줄의 진행률만 그 목표 자신의 귀속(goalOwnerEff)을 쓴다 */

/* 카테고리별 지출 비중 스택바+범례(색상 점·퍼센트·금액) — expenseBreakdownCard(홈 브리핑)와
 * openSpendAnalysis(지출 분석 상세 시트)가 공유하는 순수 렌더 함수. cats는 {cat,v}[] (정렬은
 * 호출부 책임). 반환 HTML은 스스로 접근성 트리에 참여하지 않으므로(장식), 같은 데이터를
 * 접근 가능한 형태(목록 등)로 따로 보여주지 않는 화면에서 쓸 때는 호출부가 책임지고 노출해야 한다. */
function buildExpenseBarHtml(cats){
 const spent=cats.reduce((s,c)=>s+c.v,0);
 if(!spent)return '';
 const PAL=['var(--brand)','var(--gold)','var(--stock)','var(--income)','var(--expense)','#7CC7B8','#C9A227','var(--save)'];
 const col=i=>PAL[i%PAL.length];
 // 퍼센트 합이 정확히 100이 되도록 보정 (최대 잔여법)
 const raw=cats.map(c=>c.v/spent*100);
 const floor=raw.map(v=>Math.floor(v));
 let rem=100-floor.reduce((s,v)=>s+v,0);
 const order=raw.map((v,i)=>({i,frac:v-Math.floor(v)})).sort((a,b)=>b.frac-a.frac);
 for(let k=0;k<rem&&k<order.length;k++)floor[order[k].i]++;
 const rows=cats.map((c,i)=>
   `<div class="eb-row"><span class="eb-dot" style="background:${col(i)}"></span>
     <span class="eb-cat">${esc(c.cat)}</span><span class="eb-pc num">${floor[i]}%</span><span class="eb-v num">${comma(c.v)}원</span></div>`).join('');
 const seg=cats.map((c,i)=>`<i style="width:${c.v/spent*100}%;background:${col(i)}"></i>`).join('');
 return `<div class="eb-bar">${seg}</div><div class="eb-list">${rows}</div>`;
}

 if(!spent)return '';
 return `<div class="section-title">이번 달 지출 분석</div>
   <div class="card eb-card"><div class="eb-total"><span>총 지출</span><b class="num">${comma(spent)}원</b></div>

 * buildExpenseBarHtml(스택바+범례)을 expenseBreakdownCard와 그대로 공유해 같은 디자인을 쓴다.
 * expenseBreakdownCard 자신은 분석 링크가 없고 그 역할을 monthOutflowCard(바로 위, '지출 분석' 링크)가

/* ===== 시세 연동 =====
   · 보유한 자산의 시세만 가져옵니다 (없으면 네트워크 호출 자체가 없음)
   · 환율·금·주식: 모두 Netlify 중계 함수 경유 (네이버 금융)
   · 10분마다 자동 · 토 06시~월 08시는 휴장                          */
const RATE_TTL=10*60*1000;

function heldCurrencies(){return [...new Set(DB.assets.filter(a=>a.type==='fx'&&a.currency).map(a=>a.currency))]}
function heldStockCodes(){return [...new Set(DB.assets.filter(a=>a.type==='stock'&&a.stockCode).map(a=>a.stockCode))]}
function heldCryptoCodes(){return [...new Set(DB.assets.filter(a=>a.type==='crypto'&&a.cryptoCode).map(a=>a.cryptoCode))]}
function needFx(){return heldCurrencies().length>0}
function needGold(){return DB.assets.some(a=>a.type==='gold')}
function needStock(){return heldStockCodes().length>0}
function needCrypto(){return heldCryptoCodes().length>0}
function hasRateAssets(){return needFx()||needGold()||needStock()||needCrypto()}

function inQuietWindow(d){ /* 토 06:00 ~ 월 08:00 휴장(KST 기준, 기기 시간대 무관) */
 d=d||new Date();
 /* d.getTimezoneOffset()+로컬 getDay/getHours를 쓰면 기기 DST 전환 시각이 끼어들 때
  * offset이 자기 자신과 어긋나 틀릴 수 있다 — UTC+9 고정 산술과 getUTC*로 기기 설정을 완전히 배제한다. */
 const kst=new Date(d.getTime()+9*60*60000);
 const day=kst.getUTCDay(),h=kst.getUTCHours();
 return (day===6&&h>=6)||day===0||(day===1&&h<8);
}

/* 서버 함수가 멎어도(캡티브 포털·모바일 네트워크 전환·콜드스타트 중 연결 끊김) fetch가 영원히
 * pending 상태로 남지 않도록 AbortController로 강제 타임아웃한다(서버쪽 rates.js/stock.js는
 * 이미 6초 타임아웃을 갖고 있었는데 클라이언트만 무제한 대기였다). */
async function fetchWithTimeout(url,opts,ms){
 ms=ms||8000;
 const ctrl=new AbortController();
 const timer=setTimeout(()=>ctrl.abort(),ms);
 try{
  return await fetch(url,{...(opts||{}),signal:ctrl.signal});
 }finally{
  clearTimeout(timer);
 }
}
/* 환율 + 금 (한 번의 호출로 둘 다) */
async function fetchFxGold(){
 const curs=heldCurrencies(),gold=needGold();
 if(!curs.length&&!gold)return null;
 /* 브라우저에서 외부 시세 API를 직접 부르면 CORS로 막히므로 중계 함수를 경유합니다. */
 const qs=`cur=${curs.join(',')||'USD'}${gold?'&gold=1':''}`;
 const r=await fetchWithTimeout(`/.netlify/functions/rates?${qs}`);
 if(!r.ok)throw new Error('fx');
 const j=await r.json();
 const out={fx:{},goldPerG:0};
 Object.entries(j.fx||{}).forEach(([c,v])=>{if(v>0)out.fx[c]=v});
 if(gold&&j.goldPerG>0)out.goldPerG=j.goldPerG;
 if(!Object.keys(out.fx).length&&!out.goldPerG)throw new Error('fx empty');
 return out;
}
/* 주식 (국내 6자리 + 해외 티커, 서버가 알아서 처리 → 원화로 반환) */
async function fetchStocks(){
 const codes=heldStockCodes();
 if(!codes.length)return null;
 const r=await fetchWithTimeout(`/.netlify/functions/stock?codes=${codes.join(',')}`);
 if(!r.ok)throw new Error('stock');
 return await r.json();
}
/* 암호화폐 (업비트 KRW 마켓 현재가를 서버 경유로 그대로 반환 — stock과 동일한 중계 패턴) */
async function fetchCrypto(){
 const codes=heldCryptoCodes();
 if(!codes.length)return null;
 const r=await fetchWithTimeout(`/.netlify/functions/crypto?codes=${codes.join(',')}`);
 if(!r.ok)throw new Error('crypto');
 return await r.json();
}

let syncing=false;
async function syncRates(silent){
 if(syncing||!hasRateAssets())return;
 syncing=true;
 const btn=$('syncBtn');btn&&btn.classList.add('spin');
 try{
  const [fg,st,ct]=await Promise.allSettled([fetchFxGold(),fetchStocks(),fetchCrypto()]);
  const R=DB.rates;
  let ok=0,fail=0;

  if(fg.status==='fulfilled'){
   if(fg.value){
    Object.entries(fg.value.fx).forEach(([c,v])=>{R.fx[c]=c==='JPY'?Math.round(v*100)/100:Math.round(v*10)/10});
    if(fg.value.goldPerG)R.goldPerG=Math.round(fg.value.goldPerG);
    ok++;
   }
   R.fxFail=false;
  }else{R.fxFail=true;fail++}

  if(st.status==='fulfilled'){
   if(st.value){Object.entries(st.value).forEach(([code,p])=>{if(code!=='_debug'&&p>0)R.stocks[code]=p});ok++}
   R.stockFail=false;
  }else{R.stockFail=true;fail++}

  if(ct.status==='fulfilled'){
   if(ct.value){Object.entries(ct.value).forEach(([code,p])=>{if(code!=='_debug'&&p>0)R.crypto[code]=p});ok++}
   R.cryptoFail=false;
  }else{R.cryptoFail=true;fail++}

  if(ok){R.syncedAt=Date.now();R.ratesUpdatedAt=R.syncedAt;R.failStreak=0}else R.failStreak=(R.failStreak||0)+1;
  save();renderCurrent();
  if(!silent)toast(ok?(fail?'일부 시세만 반영했어요':'시세를 반영했어요'):'시세를 가져오지 못했어요');
 }finally{
  syncing=false;btn&&btn.classList.remove('spin');
 }
}
function autoSyncRates(){
 /* inQuietWindow()는 KRX/원화 환전·금 시세가 쉬는 토 06시~월 08시(KST)를 뜻하는데, 업비트
  * 암호화폐 시세는 휴일 없이 24시간 거래된다 — crypto를 보유 중이면 이 창 안에서도
  * 자동 갱신을 건너뛰지 않는다(app-evolve cycle220 develop, crypto 자산 종류 신설 직후
  * hasRateAssets()/heldCryptoCodes()만 추가되고 이 가드는 그대로 남아 생긴 회귀). */
 if(!DB.settings.autoRates||!hasRateAssets()||(inQuietWindow()&&!needCrypto()))return;
 if(Date.now()-(DB.rates.syncedAt||0)<RATE_TTL)return;
 syncRates(true);
}
function fmtSynced(ts){
 const min=Math.floor((Date.now()-ts)/60000);
 if(min<1)return '방금 갱신';
 if(min<60)return min+'분 전 갱신';
 const d=new Date(ts);
 return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 갱신`;
}
function rateStatusText(){
 const R=DB.rates;
 if(!R.syncedAt)return '시세 연동을 눌러 최신 시세를 받아오세요';
 const base=fmtSynced(R.syncedAt);
 const stale=R.fxFail||R.stockFail||R.cryptoFail||(R.failStreak||0)>0;
 if(stale)return base+' · <span style="color:var(--text-2)">최신 아님</span>'; /* 마지막 성공값 유지 + 차분한 안내 */
 /* autoSyncRates()와 같은 이유로 crypto 보유 중엔 '주말 휴장' 대신 평소 문구를 보여준다. */
 return base+((inQuietWindow()&&!needCrypto())?' · 주말 휴장':' · 10분마다 자동');
}

 if(DB.settings.autoRates){toast('시세 자동 연동을 켰어요');syncRates(true)}else toast('시세 자동 연동을 껐어요')}
function toggleConfirmTransfers(){

 if(turningOff){
  /* 일반 이체뿐 아니라 반복 이체(autoConfirm:false)의 도래한 미확인 회차도 함께 센다
     (pendingTransferCount()/일정 화면과 동일하게 '도래한'(isDuePending, KST 기준) 것만 대상 — 아직
     안 온 미래 회차까지 지금 완료 처리해버리면 안 됨). 전엔 t.date<=TODAY를 여기서만 따로
     인라인했는데(기기-로컬 TODAY 기준이라 isDuePending()과 다른 기준으로 어긋날 수 있었음),

 * 항목은 이미 moveGroup()/moveAsset()으로 순서를 바꿀 수 있는데, DB.categories[k]는 addCat()이
 * 끝에 push만 해서 추가된 순서 그대로 영원히 고정이라 자주 쓰는 카테고리를 거래 입력 카테고리
 * 피커 맨 위로 올릴 방법이 전혀 없었다(cycle248 critique가 자산 피커 검색에 밀려 다음 순번으로
 * 미뤄둔 항목). DB.categories[k]는 자산과 달리 별도 order 필드가 없는 '배열 순서 자체가 순서'인
 * 문자열 목록이라, moveCat()이 이 배열을 그대로 바꿔 쓰면 되므로 id→order 맵 대신 바뀐 배열을
 * 그대로 반환한다. */
function movedCatOrder(arr,i,dir){
 const j=i+dir;
 if(i<0||i>=arr.length||j<0||j>=arr.length)return null;
 const out=arr.slice();
 [out[i],out[j]]=[out[j],out[i]];
 return out;
}

 if(editing&&['cash','savings','realestate','etc','pension','debt'].includes(asDraft.type))asDraft._dispAmt=balanceAt(asDraft.id,TODAY);
 if(editing&&isMarketValued(asDraft))asDraft._origQty=asDraft.type==='fx'?(asDraft.fxAmount||0):asDraft.type==='gold'?(asDraft.goldDon||0):asDraft.type==='crypto'?(asDraft.cryptoQty||0):(asDraft.stockQty||0); /* qtyBasisWarn/costBasisField가 수량 증가(추가매수) 경고를 판단할 기준값 — saveAsset()은 이걸 쓰지 않고 DB.assets[i]의 실제 원본값을 다시 읽는다 */

function costBasisField(d,editing){ /* fx/gold/stock 공통 — 매입 원가는 선택 입력이라 비워두면 손익을 표시하지 않는다(assetGainLoss). fx/gold/stock 폼의 마지막 입력이라 Enter로 제출

function _applyType(draft,t){draft.type=t;draft.category=t==='transfer'?'이체':catListOf(t)[0]||'기타';delete draft.splits; /* 유형이 바뀌면 카테고리 목록 자체가 바뀌므로 이전 유형 기준으로 고른 분할 항목들은 더 이상 유효하지 않음 */
 if((t==='income'||t==='transfer'||t==='saving')&&!draft.toAssetId)draft.toAssetId=firstCash()}
function _applyFreq(draft,start,v){draft.freq=v;if(v==='monthly'&&!draft.day)draft.day=Number(String(start).slice(8,10))||1}
function _applyDay(draft,start,v){if(v==='last'){draft.day='last';draft._custom=false}else if(v==='custom'){draft._custom=true;if([1,5,15,25].includes(draft.day)||draft.day==='last'||!draft.day)draft.day=Number(String(start).slice(8,10))||10}else{draft.day=Number(v);draft._custom=false}}

/* ── 반복 종료조건(선택): [종료일][횟수] 두 박스 한 줄, 양방향 자동 계산 ──────
   pfx='tx'(내역 입력 반복) 또는 'rec'(반복 설정 편집) */
function endCondFields(d,pfx){
 const start=d.startDate||d.date;
 const base={freq:d.freq,day:d.day,startDate:start,weekend:d.weekend};
 const cnt=(d.count!=null&&d.count!=='')?d.count:(d.endDate?recCountUntil(base,d.endDate):'');
 const has=!!(d.endDate||cnt);
 const hint=(d.endDate&&cnt)?`${fmtDateFull(d.endDate)}까지 총 ${cnt}번 반복돼요`:'종료일이나 횟수 중 하나만 넣으면 나머지가 자동 계산돼요';
 return `<div class="field"><label>종료조건 (선택)</label>
  <div class="end-row">
   <button class="end-box ${d.endDate?'':'placeholder'}" id="${pfx}EndDateBox" onclick="${pfx}OpenEnd()">${d.endDate?d.endDate.replace(/-/g,'.'):'종료일'}</button>
   <input class="end-box num" id="${pfx}CountBox" inputmode="numeric" value="${cnt||''}" placeholder="횟수" aria-label="반복 횟수" oninput="${pfx}Count(this.value)">
  </div>
  <div class="end-foot"><span class="psub" id="${pfx}EndHint">${hint}</span>${has?`<button class="txt-btn" onclick="${pfx}ClearEnd()">지우기</button>`:''}</div>
 </div>`;
}
/* 주기/반복일/주말규칙/시작일이 바뀌면 기존 count↔endDate 쌍이 그 조합 기준으로 어긋나므로, count 우선으로 재계산해 둘 다 최신 상태로 맞춘다 */
function recalcEndCond(d,start){
 if(!d.count&&!d.endDate)return;
 const base={freq:d.freq,day:d.day,startDate:start||d.startDate||d.date,weekend:d.weekend};
 if(d.count)d.endDate=recNthDate(base,d.count);
 else d.count=recCountUntil(base,d.endDate);
}
/* 횟수 입력 → 종료일 실시간 반영 (재렌더 없이 DOM만 갱신, 포커스 유지) */
function _applyCount(pfx,draft,v,rerender){
 const n=Math.min(999,Math.max(0,Number(String(v).replace(/[^0-9]/g,''))||0));
 draft.count=n||null;
 const ed=n>=1?recNthDate({freq:draft.freq,day:draft.day,startDate:draft.startDate||draft.date,weekend:draft.weekend},n):null;
 draft.endDate=ed;
 const box=$(pfx+'EndDateBox');if(box){box.textContent=ed?ed.replace(/-/g,'.'):'종료일';box.classList.toggle('placeholder',!ed)}
 const h=$(pfx+'EndHint');if(h)h.textContent=(ed&&n)?`${fmtDateFull(ed)}까지 총 ${n}번 반복돼요`:'종료일이나 횟수 중 하나만 넣으면 나머지가 자동 계산돼요';
}

function saveTx(){
 if(twGuard())return;
 syncTxInputs();const d=txDraft;if(_savedDrafts.has(d))return;if(!d.amount){toast('금액을 입력해 주세요');return}
 if(d.type!=='transfer'&&Array.isArray(d.splits)&&d.splits.length){ /* 분할 입력 검증 — 합계가 전체 금액과 어긋나면 잔액 계산(t.amount 기준)이 조용히 틀어지므로 저장을 막는다(app-evolve cycle198 advance) */
  if(d.splits.some(s=>!s.category)){toast('분할 항목의 카테고리를 선택해 주세요');return}
  if(d.splits.some(s=>!s.amount)){toast('분할 항목의 금액을 입력해 주세요');return}
  const sum=d.splits.reduce((s,x)=>s+(Number(x.amount)||0),0);
  if(sum!==d.amount){toast('분할 금액의 합이 전체 금액과 달라요');return}
  d.category=d.splits[0].category; /* 최상위 category는 하위호환 fallback(첫 항목) — CATICON 조회 등 분할을 모르는 코드도 합리적인 값을 본다 */
 }else if(d.type!=='transfer'&&!d.category){toast('카테고리를 선택해 주세요');return}
 if(dateBelowRangeFloor(d.date)){toast(`${RANGE_FROM} 이전 날짜는 저장할 수 없어요`);return}
 if(dateAboveRangeCeil(d.date)){toast(`${RANGE_TO} 이후 날짜는 저장할 수 없어요`);return}
 if(d.type==='transfer'||d.type==='saving'){
  if(!d.fromAssetId||!d.toAssetId){toast('보내는·받는 자산을 선택해 주세요');return}
  if(d.fromAssetId===d.toAssetId){toast('보내는 자산과 받는 자산이 같아요');return}
 }
 if(d.type==='expense'&&!d.fromAssetId){toast('자산을 선택해 주세요');return}
 if(d.type==='income'&&!d.toAssetId){toast('자산을 선택해 주세요');return}
 if(d.type==='expense')d.toAssetId=null;else if(d.type==='income')d.fromAssetId=null;
 if(!d.id&&d.repeat){ /* 반복 ON → 반복 항목으로 저장 (일회성 내역 대신) */
  delete d.splits; /* DB.recurrences는 분할을 담을 자리가 없는 스키마(txToggleRepeat이 이미 지우지만 방어적으로 한 번 더) */
  const cat=d.type==='transfer'?'이체':d.category;
  const freq=d.freq||'monthly';
  if(freq==='monthly'&&d.day!=='last'){const m=clampDay(d);if(m)toast(m)}
  const day=freq==='monthly'?(d.day||Number(String(d.date).slice(8,10))||1):1;
  const base={freq,day,startDate:d.date,weekend:d.weekend};
  let endDate=d.endDate||null,count=d.count||null;
  if(endDate&&endDate<d.date){toast('종료일은 시작일 이후로 선택해 주세요');return}
  if(endDate&&!count)count=recCountUntil(base,endDate);
  else if(count&&!endDate)endDate=recNthDate(base,count);
  d.memo=(d.memo||'').trim()||cat; /* 메모 없으면 카테고리로 (saveRec과 동일) */
  _savedDrafts.add(d);
  DB.recurrences.push(touch({id:uid(),active:true,type:d.type,category:cat,memo:d.memo,amount:d.amount,
   fromAssetId:d.fromAssetId,toAssetId:d.toAssetId,freq,day,startDate:d.date,endDate,count,
   skip:[],edits:{},autoConfirm:true,confirmedDates:[],varying:isVarCat(d.type,cat)}));
  save({fromDate:d.date});closeSheet();renderCurrent();toast('반복 내역으로 저장했어요');return;
 }
 ['repeat','freq','day','endDate','endMode','count'].forEach(k=>delete d[k]); /* 일회성 내역엔 반복 필드 제거 */
 d.memo=(d.memo||'').trim()||d.category; /* 메모 없으면 카테고리로 (saveRec과 동일) */
 if(d.type==='transfer'&&d.confirmed===undefined)d.confirmed=!(DB.settings.confirmTransfers&&isFuture(d.date));
 _savedDrafts.add(d);touch(d);
 /* invalidateBalances(fromDate)는 fromDate 이전까지만 반영된 _balCache 항목을 그대로 재사용한다
  * (2427행) — 날짜를 바꿔 수정한 경우 원래 날짜와 새 날짜 중 더 이른 쪽부터 잔액이 달라질 수 있으므로
  * min(oldDate,d.date)를 넘겨야 한다(app-evolve cycle204 advance). */
 let fromDate=d.date;
 if(d.id){const i=DB.txns.findIndex(x=>x.id===d.id);if(i>=0&&DB.txns[i].date<fromDate)fromDate=DB.txns[i].date;DB.txns[i]=d}else{d.id=uid();DB.txns.push(d)}
 save({fromDate,recsChanged:false});closeSheet();renderCurrent();toast(isFuture(d.date)?'예정 내역으로 저장했어요':'내역을 저장했어요'); /* 이 분기는 반복 등록(위 4411행)과 달리 일회성 거래만 DB.txns에 저장하므로 _recCache는 보존해도 안전(app-evolve cycle207 advance) */
}
function editTx(id,recId,date){

/* 복제(빠른 재입력): 매일 반복되는 소액 비정형 지출(커피/점심/교통 등)을 유형→카테고리→

 * isRec(반복에서 파생된 가상 행, DB.txns에 없어 find가 애초에 실패함)와 잔액조정(adjust,

   <button onclick="recApply('${recId}','${date}','${mode}','future')"><span class="rd"></span><div><div>이 날부터 이후 모두</div><div class="ol-sub">${shortDate(date)} 이후 반복 전체</div></div></button>
   <button onclick="recApply('${recId}','${date}','${mode}','all')"><span class="rd"></span><div><div>전체</div><div class="ol-sub">과거 포함 이 반복 전체</div></div></button>

function recApply(recId,date,mode,scope){
 if(twGuard())return;
 const r=DB.recurrences.find(x=>x.id===recId);
 if(mode==='delete'){
  if(scope==='one'){
   const prevSkip=r.skip.slice();r.skip.push(date);touchSave(r);closeSheet();renderCurrent();
   undoToast('삭제했어요',()=>{r.skip=prevSkip;touchSave(r);renderCurrent();toast('되돌렸어요')});return;
  }
  if(scope==='future'){
   const prevEnd=r.endDate,prevCount=r.count,prevSkip=r.skip.slice(),prevEdits=Object.assign({},r.edits),prevConfirmed=(r.confirmedDates||[]).slice();
   const {skipPast,editsPast,confirmedPast}=splitRecOverrides(r.skip,r.edits,r.confirmedDates,date); /* date 이후 skip/edits/confirmedDates도 함께 버려야 함(끊어낸 회차 자체이므로 recSave future처럼 분리 보관할 곳이 없다) — 안 그러면 나중에 endDate를 다시 늘릴 때 되살아남(skip/edits는 app-evolve cycle121, confirmedDates는 cycle185에서 추가로 고침) */
   r.skip=skipPast;r.edits=editsPast;r.confirmedDates=confirmedPast;
   Object.assign(r,truncateRecEnd({freq:r.freq,day:r.day,startDate:r.startDate,weekend:r.weekend},addDays(date,-1)));
   touchSave(r);closeSheet();renderCurrent();
   undoToast('삭제했어요',()=>{r.endDate=prevEnd;r.count=prevCount;r.skip=prevSkip;r.edits=prevEdits;r.confirmedDates=prevConfirmed;touchSave(r);renderCurrent();toast('되돌렸어요')});return;
  }
  closeSheet();deleteRecsUndo(new Set([recId]));return;
 }
 const ed=(r.edits||{})[date]||{};
 _formScroll=0;
 txDraft={id:null,type:r.type,date,category:r.category,memo:ed.memo!=null?ed.memo:r.memo,amount:ed.amount!=null?ed.amount:r.amount,fromAssetId:r.fromAssetId,toAssetId:r.toAssetId};
 snapDraft('tx');
 window._recCtx={recId,date,scope};
 renderTxSheet();
}

function recSave(){
 if(twGuard())return;
 const ctx=window._recCtx;if(!ctx)return;const r=DB.recurrences.find(x=>x.id===ctx.recId);
 syncTxInputs();
 const amt=txDraft.amount;if(!amt){toast('금액을 입력해 주세요');return}
 const memo=(txDraft.memo||'').trim()||r.category; /* 메모 없으면 카테고리로 (saveTx/saveRec과 동일) */
 let undoFn;
 if(ctx.scope==='one'){
  const edits=(r.edits=r.edits||{});const prevEdit=edits[ctx.date];edits[ctx.date]={amount:amt,memo};touch(r);
  undoFn=()=>{if(prevEdit===undefined)delete edits[ctx.date];else edits[ctx.date]=prevEdit;touchSave(r);renderCurrent();toast('되돌렸어요')};
 }
 else if(ctx.scope==='future'){
  const prevEnd=r.endDate,prevCount=r.count,prevSkip=r.skip.slice(),prevEdits=Object.assign({},r.edits),prevConfirmed=(r.confirmedDates||[]).slice();
  const {skipPast,skipFuture,editsPast,editsFuture,confirmedPast,confirmedFuture}=splitRecOverrides(r.skip,r.edits,r.confirmedDates,ctx.date);
  r.skip=skipPast;r.edits=editsPast;r.confirmedDates=confirmedPast;
  Object.assign(r,truncateRecEnd({freq:r.freq,day:r.day,startDate:r.startDate,weekend:r.weekend},addDays(ctx.date,-1)));
  touch(r);
  const newBase={freq:r.freq,day:r.day,startDate:ctx.date,weekend:r.weekend};
  const newRec=Object.assign({},JSON.parse(JSON.stringify(r)),{id:uid(),startDate:ctx.date,endDate:prevEnd,count:prevEnd?recCountUntil(newBase,prevEnd):null,amount:amt,memo,skip:skipFuture,edits:editsFuture,confirmedDates:confirmedFuture});
  touch(newRec);
  DB.recurrences.push(newRec);
  undoFn=()=>{r.endDate=prevEnd;r.count=prevCount;r.skip=prevSkip;r.edits=prevEdits;r.confirmedDates=prevConfirmed;DB.recurrences=DB.recurrences.filter(x=>x.id!==newRec.id);touchSave(r);renderCurrent();toast('되돌렸어요')};
 }
 else{
  const prevAmt=r.amount,prevMemo=r.memo;r.amount=amt;r.memo=memo;touch(r);

function histPreset(p){const H=ST.hist;H.preset=p;
 if(p==='year'){H.range={from:`${TM.y}-01-01`,to:`${TM.y}-12-31`};}

function addMonths(ds,n){
 const d=new Date(ds+'T00:00:00');const day=d.getDate();
 d.setDate(1);d.setMonth(d.getMonth()+n); /* 월만 먼저 옮기고(일자 롤오버 방지), 그 달의 마지막 날로 일자를 clamp */
 const y=d.getFullYear(),m=d.getMonth()+1;
 return `${y}-${String(m).padStart(2,'0')}-${String(Math.min(day,lastDay(y,m))).padStart(2,'0')}`;
}

function updateHist(){
