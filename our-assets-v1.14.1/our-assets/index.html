  * 홈 탭에 있는 동안은 주기적으로 다시 그려서 카드가 계속 보이게 한다 — 로컬 데이터는 건드리지 않음 */
 if(CLOUD_UID&&CLOUD_SYNC_STATE==='conflict'&&ST.tab==='home')renderCurrent();
 autoSyncRates()
}
/* 백그라운드로 전환되면 즉시 화면을 가려(lockApp) OS 앱 전환화면에 데이터가 노출되지 않게 하면서도,
 * 설정된 유예시간 안에 돌아오면 PIN 재입력 없이 자동으로 다시 연다(app-evolve cycle151 advance) */
document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncNotifyPermission();if(APP_LOCKED&&APPLOCK.enabled()&&APP_HIDDEN_AT&&(Date.now()-APP_HIDDEN_AT)/1000<APPLOCK.getGrace())unlockApp();else maybeRollDay();APP_HIDDEN_AT=0;pullCloudIfStale().catch(()=>{})}else{if(CLOUD_UID){clearTimeout(SB_PUSH_T);pushCloud().catch(()=>{})}checkNotifyAlerts();if(appIsOpen()){APP_HIDDEN_AT=Date.now();lockApp()}}});
window.addEventListener('online',async()=>{
 if(!shouldRetryCloudSync(CLOUD_UID,CLOUD_SYNC_STATE,navigator.onLine))return;
 await pullCloud();await pushCloud();
 if(appIsOpen())renderCurrent();
});
window.addEventListener('focus',()=>{maybeRollDay();pullCloudIfStale().catch(()=>{})});
window.addEventListener('storage',handleForeignStorage); /* 다른 탭이 save()로 덮어쓴 걸 감지 — handleForeignStorage 주석 참고 */
window.addEventListener('pageshow',()=>{maybeRollDay();pullCloudIfStale().catch(()=>{})});
setInterval(maybeRollDay,60000);
/* visibilitychange-visible/focus/pageshow는 '전환'에서만 발동해, 기기가 계속 포그라운드에
 * 떠 있는 동안(가족 공유 계정에서 두 사람이 나란히 동시에 써서 둘 다 백그라운드로 안 가는 경우)
 * 다른 기기의 수정을 영원히 못 받는 공백이 있었다(app-evolve cycle169 critique) — autoSyncRates
 * 3분 간격 선례와 같은 모양으로 60초마다 틱하되, pullCloudIfStale() 내부의 CLOUD_PULL_STALE_MS(3분)
 * 문턱이 실제 pull 빈도를 그대로 제한한다. */
setInterval(()=>{if(!document.hidden)pullCloudIfStale().catch(()=>{})},60*1000);
/* push 실패(CLOUD_SYNC_STATE==='error')는 navigator.onLine이 바뀌는 'online' 이벤트나 다음 로컬 편집에만
 * 재시도가 걸려 있어서, 흔한 일시적 실패(Supabase 5xx·타임아웃처럼 onLine은 안 바뀌는 경우)에서 사용자가
 * 그날 더 편집을 안 하면 영원히 멈췄다(app-evolve cycle170 critique) — PUSH_CLOUD_INFLIGHT가 이미 중복
 * push를 막아주므로 위의 pull interval과 독립적으로 60초마다 재시도만 추가한다. */
setInterval(()=>{if(!document.hidden&&CLOUD_UID&&DB&&CLOUD_SYNC_STATE==='error')pushCloud().catch(()=>{})},60*1000);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(DB.settings.themeMode==='system'){syncThemeColorMeta();renderCurrent()}});
setTimeout(()=>{if(!DB)return;const soon=DB.assets.filter(a=>a.type==='savings'&&a.maturityDate&&a.maturityDate<=addDays(TODAY,7));
 if(soon.length)toast(`저축 만기 ${soon.length}건이 임박했어요`)},1200);
</script>
<script>
/* PWA 서비스워커 등록 — 오프라인 지원 및 홈 화면 설치 */
if('serviceWorker' in navigator){
  /* 페이지가 이미 어떤 서비스워커의 제어를 받고 있었는지를 등록 전에 미리 캡처해 둔다.
   * 처음 방문해 서비스워커가 하나도 없던 상태(hadController=false)에서는 sw.js의
   * clients.claim()이 '무제어→제어됨'으로 바뀌는 것만으로도 controllerchange가 한 번 뜨는데,
   * 이건 실제 업데이트가 아니라 최초 설치일 뿐이라 이 최초 1회는 무시해야 한다(안 그러면
   * 모든 신규 방문자가 첫 로드부터 '새 버전이 있어요' 배너를 잘못 보게 된다). 이미 다른
   * 서비스워커가 이 페이지를 제어 중이던 경우(hadController=true)에만 이후 controllerchange를
   * 진짜 새 배포로 취급한다. */
  var hadController=!!navigator.serviceWorker.controller;
  var SW_REG=null;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!hadController){hadController=true;return}
    SW_UPDATE_AVAILABLE=true;
    hideInstallBar(); /* 업데이트 배너가 더 급하다 — 설치 배너가 떠 있었다면 자리를 비켜준다 */
    showSwUpdateBar();
  });
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){SW_REG=reg}).catch(function(e){
      console.warn('SW registration failed:', e);
    });
  });
  /* controllerchange만으로는 브라우저가 자체적으로 새 버전을 체크하는 navigation(새 페이지
   * 로드/새로고침) 시점에만 업데이트가 발견된다. PWA를 홈 화면에 설치해 며칠씩 켜두고
   * 잠금/해제·백그라운드/포그라운드 전환만 반복하는 사용자는 navigation이 전혀 없어, 새 버전이
   * 여러 번 배포돼도 #swUpdateBar 배너를 전혀 못 보고 강제종료 후 재실행 전까지 구버전을 계속
   * 돈다(app-evolve cycle171 critique) — pullCloudIfStale()의 포그라운드 유지 중 재-pull
   * interval(cycle169)/재-push interval(cycle170)과 같은 '전환 시에만 발동, stay-open은
   * 공백' 버그 클래스의 SW 쪽 나머지 절반. registration.update()가 새 워커를 찾아 설치하면
   * 기존 controllerchange/showSwUpdateBar()가 그대로 배너를 띄우므로 새 UI는 필요 없다. */
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&SW_REG)SW_REG.update().catch(function(){})});
  setInterval(function(){if(!document.hidden&&SW_REG)SW_REG.update().catch(function(){})},30*60*1000);
}
</script>
