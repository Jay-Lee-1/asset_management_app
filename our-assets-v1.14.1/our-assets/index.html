<style>
:root{
  --bg:#F4F6F4;--surface:#FFFFFF;--surface-2:#FAFBFA;--sunken:#EEF1EE;--scrim:rgba(22,28,25,.42);
  --text:#181B19;--text-2:#67716B;--text-3:#767F79;--on-brand:#FFFFFF;
  --line:#E8EBE8;--line-2:#DDE1DD;
  --brand:#227E72;--brand-ink:#1C6A60;--brand-soft:#E4F0EC;--brand-tint:#F1F8F5;
  --income:#2E7BC4;--income-soft:#E8F1FB;--expense:#E06457;--expense-soft:#FBE9E6;
  --gold:#BE8E2C;--gold-soft:#F5ECD5;--stock:#7C5CC4;--stock-soft:#EEE9FA;--save:#2FA36B;--save-soft:#E5F3EC;
  --sh-sm:0 1px 2px rgba(20,30,25,.05),0 1px 3px rgba(20,30,25,.04);
  --sh-md:0 1px 3px rgba(20,30,25,.04),0 6px 20px rgba(20,30,25,.055);
  --sh-lg:0 10px 44px rgba(18,26,22,.16);--sh-nav:0 -1px 0 var(--line),0 -6px 22px rgba(20,30,25,.04);
  --r-xs:8px;--r-sm:11px;--r-md:14px;--r-lg:16px;--r-xl:20px;--r-pill:999px;
  --ease:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--nav-h:64px;--ad-h:52px;
  /* iOS 26 Liquid Glass */
  --glass:rgba(255,255,255,.62);--glass-2:rgba(255,255,255,.46);--glass-line:rgba(255,255,255,.55);
  --glass-panel:rgba(255,255,255,.86);--glass-field:rgba(255,255,255,.78);--glass-card:rgba(255,255,255,.72);
  --glass-btn:rgba(255,255,255,.5);--glass-border:rgba(255,255,255,.6);
  --glass-blur:saturate(180%) blur(22px);--glass-blur-lg:saturate(190%) blur(34px);
  --glass-sh:0 1px 0 rgba(255,255,255,.5) inset,0 8px 32px rgba(18,26,22,.10);
  --bounce:cubic-bezier(.2,1.5,.4,1);
}
html[data-theme="dark"]{
  --bg:#111417;--surface:#1A1E22;--surface-2:#20252A;--sunken:#171B1F;--scrim:rgba(0,0,0,.58);
  --text:#F2F5F3;--text-2:#AEB8B2;--text-3:#8A948E;--on-brand:#06201D;--line:#333A41;--line-2:#3E464E;
  --brand:#4FB8A8;--brand-ink:#74CFBF;--brand-soft:#1A3F3A;--brand-tint:#183833;
  --income:#5FA3E3;--income-soft:#182A3B;--expense:#F1897C;--expense-soft:#3A2623;
  --gold:#DDB55C;--gold-soft:#332B18;--stock:#A78BE6;--stock-soft:#25203A;--save:#5CC48D;--save-soft:#163023;
  --sh-sm:0 1px 2px rgba(0,0,0,.4);--sh-md:0 2px 10px rgba(0,0,0,.4);--sh-lg:0 14px 46px rgba(0,0,0,.6);
  --sh-nav:0 -1px 0 var(--line),0 -8px 26px rgba(0,0,0,.4);
  --glass:rgba(24,28,32,.74);--glass-2:rgba(32,37,42,.66);--glass-line:rgba(255,255,255,.16);
  --glass-panel:rgba(24,28,32,.82);--glass-field:rgba(46,52,60,.78);--glass-card:rgba(40,46,52,.72);
  --glass-btn:rgba(255,255,255,.10);--glass-border:rgba(255,255,255,.16);

  --glass-sh:0 1px 0 rgba(255,255,255,.06) inset,0 8px 32px rgba(0,0,0,.5);
}
@media (prefers-color-scheme:dark){html[data-theme="system"]{
  --bg:#111417;--surface:#1A1E22;--surface-2:#20252A;--sunken:#171B1F;--scrim:rgba(0,0,0,.58);
  --text:#F2F5F3;--text-2:#AEB8B2;--text-3:#8A948E;--on-brand:#06201D;--line:#333A41;--line-2:#3E464E;
  --brand:#4FB8A8;--brand-ink:#74CFBF;--brand-soft:#1A3F3A;--brand-tint:#183833;
  --income:#5FA3E3;--income-soft:#182A3B;--expense:#F1897C;--expense-soft:#3A2623;
  --gold:#DDB55C;--gold-soft:#332B18;--stock:#A78BE6;--stock-soft:#25203A;--save:#5CC48D;--save-soft:#163023;
  --sh-sm:0 1px 2px rgba(0,0,0,.4);--sh-md:0 2px 10px rgba(0,0,0,.4);--sh-lg:0 14px 46px rgba(0,0,0,.6);
  --sh-nav:0 -1px 0 var(--line),0 -8px 26px rgba(0,0,0,.4);
  --glass:rgba(24,28,32,.74);--glass-2:rgba(32,37,42,.66);--glass-line:rgba(255,255,255,.16);
  --glass-panel:rgba(24,28,32,.82);--glass-field:rgba(46,52,60,.78);--glass-card:rgba(40,46,52,.72);
  --glass-btn:rgba(255,255,255,.10);--glass-border:rgba(255,255,255,.16);

  --glass-sh:0 1px 0 rgba(255,255,255,.06) inset,0 8px 32px rgba(0,0,0,.5);
}}
/* ── 메인 색 프리셋 (청록=기본, 나머지 6종). 수입 파랑·지출 빨강·저축 초록과 겹치지 않게 튜닝 ── */
html[data-accent="indigo"]{--brand:#4B54C6;--brand-ink:#383FA0;--brand-soft:#E7E8FB;--brand-tint:#F2F3FD;--on-brand:#FFFFFF}
html[data-accent="plum"]{--brand:#9A4B8F;--brand-ink:#78386F;--brand-soft:#F6E7F3;--brand-tint:#FBF2F9;--on-brand:#FFFFFF}
html[data-accent="forest"]{--brand:#1E7A57;--brand-ink:#145E41;--brand-soft:#E0F1E9;--brand-tint:#F0F8F3;--on-brand:#FFFFFF}
html[data-accent="sunset"]{--brand:#B8661A;--brand-ink:#94520F;--brand-soft:#FAEAD8;--brand-tint:#FDF4EB;--on-brand:#FFFFFF}
html[data-accent="rose"]{--brand:#C24D74;--brand-ink:#9C3A5B;--brand-soft:#FAE5EC;--brand-tint:#FDF2F6;--on-brand:#FFFFFF}
html[data-accent="slate"]{--brand:#4A6178;--brand-ink:#374B5E;--brand-soft:#E7ECF1;--brand-tint:#F2F5F8;--on-brand:#FFFFFF}
html[data-theme="dark"][data-accent="indigo"]{--brand:#8189F0;--brand-ink:#A4AAF6;--brand-soft:#23264D;--brand-tint:#1E2140;--on-brand:#0A0C24}
html[data-theme="dark"][data-accent="plum"]{--brand:#D083C9;--brand-ink:#E0A6DA;--brand-soft:#43213E;--brand-tint:#391C34;--on-brand:#240320}
html[data-theme="dark"][data-accent="forest"]{--brand:#4FCB93;--brand-ink:#77DBAD;--brand-soft:#143D2C;--brand-tint:#163524;--on-brand:#04160E}
html[data-theme="dark"][data-accent="sunset"]{--brand:#F0A659;--brand-ink:#F5C08A;--brand-soft:#4A2E12;--brand-tint:#3E280F;--on-brand:#241202}
html[data-theme="dark"][data-accent="rose"]{--brand:#EE8AAE;--brand-ink:#F4AEC7;--brand-soft:#48222F;--brand-tint:#3C1C28;--on-brand:#260410}
html[data-theme="dark"][data-accent="slate"]{--brand:#8AA4BE;--brand-ink:#A9BFD4;--brand-soft:#26313C;--brand-tint:#202A33;--on-brand:#0A1620}
@media (prefers-color-scheme:dark){
 html[data-theme="system"][data-accent="indigo"]{--brand:#8189F0;--brand-ink:#A4AAF6;--brand-soft:#23264D;--brand-tint:#1E2140;--on-brand:#0A0C24}
 html[data-theme="system"][data-accent="plum"]{--brand:#D083C9;--brand-ink:#E0A6DA;--brand-soft:#43213E;--brand-tint:#391C34;--on-brand:#240320}
 html[data-theme="system"][data-accent="forest"]{--brand:#4FCB93;--brand-ink:#77DBAD;--brand-soft:#143D2C;--brand-tint:#163524;--on-brand:#04160E}
 html[data-theme="system"][data-accent="sunset"]{--brand:#F0A659;--brand-ink:#F5C08A;--brand-soft:#4A2E12;--brand-tint:#3E280F;--on-brand:#241202}
 html[data-theme="system"][data-accent="rose"]{--brand:#EE8AAE;--brand-ink:#F4AEC7;--brand-soft:#48222F;--brand-tint:#3C1C28;--on-brand:#260410}
 html[data-theme="system"][data-accent="slate"]{--brand:#8AA4BE;--brand-ink:#A9BFD4;--brand-soft:#26313C;--brand-tint:#202A33;--on-brand:#0A1620}
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea,select,[contenteditable]{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text}
html,body{overflow-x:hidden;height:100%}
body{font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hidden{display:none!important}

#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
.viewport{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 22px calc(40px + var(--ad-h));
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.page.active{opacity:1;pointer-events:auto}

.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:max(14px,env(safe-area-inset-top));
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:18px;min-height:56px;margin:0 -22px;padding-left:22px;padding-right:22px;
  opacity:var(--hdr-o,1);transition:opacity .18s linear;will-change:opacity}

.hdr h1{font-size:25px;font-weight:700;letter-spacing:-.03em}
.hdr .sub{font-size:13px;color:var(--text-2);font-weight:500;margin-bottom:3px}
.hdr-actions{display:flex;gap:6px;align-items:center;margin-bottom:2px;flex-wrap:nowrap;min-width:0}
.icon-btn{width:40px;height:40px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--text)}
.icon-btn:active{background:var(--sunken)}.icon-btn svg{width:23px;height:23px}
.txt-btn{font-size:14px;font-weight:700;color:var(--brand-ink);padding:8px 10px;border-radius:var(--r-sm);display:inline-flex;align-items:center;gap:3px}
.txt-btn:active{background:var(--sunken)}.txt-btn svg{width:15px;height:15px}
.sch-chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--r-pill);white-space:nowrap;flex-shrink:0;
  border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:700;color:var(--text-2)}
.sch-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--line-2);transition:background .15s}
.sch-chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.sch-chip.on .dot{background:var(--on-brand)}
.today-chip svg{width:14px;height:14px}
.today-chip{position:relative}
.chip-dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 2px var(--surface)}
.ledsum .sch,.totbox .sch{display:block;font-size:10px;font-weight:600;color:var(--text-3);margin-top:2px;white-space:nowrap;line-height:1.2}
.totbox .flow3 .sch{text-align:center}
.ledsum .ls1 .sch,.totbox .tsj .sch{margin-top:3px}
.lsr-r{display:inline-flex;flex-direction:column;align-items:flex-end;gap:1px}
.tsj-r{display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px}
.month-chip{display:inline-flex;align-items:center;gap:6px;font-size:22px;font-weight:700;letter-spacing:-.03em;padding:4px 6px;border-radius:var(--r-sm)}
.month-chip:active{background:var(--sunken)}.month-chip svg{width:18px;height:18px;color:var(--text-2)}

/* iOS-like press animations */
.icon-btn,.txt-btn,.chip,.mnav button,.sch-chip,.month-chip,.summary>button,.filter-2 button,.seg button,.opt-grid button,.sync-btn,.menu-item,.promo .go,.add-inline button,.swipe-actions button{transition:transform .18s var(--spring),background .15s,color .15s,border-color .15s,box-shadow .15s}
.icon-btn:active,.mnav button:active{transform:scale(.88)}
.sch-chip:active,.chip:active,.sync-btn:active,.add-inline button:active{transform:scale(.93)}
.txt-btn:active,.month-chip:active,.summary>button:active,.promo .go:active{transform:scale(.95)}
.filter-2 button:active,.opt-grid button:active,.seg button:active{transform:scale(.96)}
.menu-item:active{transform:scale(.985)}

.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-sm);border:1px solid var(--line);
  overflow:hidden;transition:transform .38s var(--bounce),box-shadow .3s var(--ease)}
html[data-theme="dark"] .card{box-shadow:var(--sh-md),0 1px 0 rgba(255,255,255,.05) inset}
/* ===== 새 홈탭 카드 ===== */
.month-switch{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 14px}
.ms-arrow{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);background:var(--surface-2)}
.ms-arrow:active{transform:scale(.9);background:var(--sunken)}
.ms-arrow svg{width:17px;height:17px}
/* 순자산 추이 (스파크라인) */
.nwh-card{padding:16px 16px 14px}
.nwh-range{font-size:12px;color:var(--text-3);font-weight:500;margin:2px 0 8px}
.nwh-range b{font-weight:700;color:var(--text-2)}
.nwh-chart{height:80px}
.nwh-chart svg{width:100%;height:100%;display:block}
/* ② 오늘 브리핑 */
.brief-card{display:flex;align-items:center;gap:13px;padding:15px 16px;margin-top:11px}
.brief-ic{font-size:24px;flex-shrink:0;width:42px;height:42px;border-radius:var(--r-md);background:var(--brand-soft);display:grid;place-items:center}
.brief-body{flex:1;min-width:0}
.brief-1{font-size:15px;font-weight:600;color:var(--text)}
.brief-1 b{font-weight:700}
.brief-2{font-size:12.5px;color:var(--text-3);font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brief-2 b{color:var(--text-2);font-weight:600}
.brief-dday{color:var(--expense);font-weight:700;margin-left:2px}
.brief-chev{color:var(--text-3);flex-shrink:0}.brief-chev svg{width:18px;height:18px}
.brief-card:active{background:var(--surface-2)}
/* ③ 예산 소진율 */
.budget-card{padding:16px 18px;margin-top:11px}
.bg-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.bg-lb{font-size:12.5px;font-weight:600;color:var(--text-2)}
.bg-edit{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--brand-ink);background:var(--brand-soft);padding:4px 9px;border-radius:var(--r-pill)}
.bg-edit svg{width:12px;height:12px}
.bg-edit:active{transform:scale(.95)}
.bg-nums{display:flex;align-items:baseline;margin-bottom:9px}
.bg-spent{font-size:24px;font-weight:700;letter-spacing:-.03em;color:var(--text)}
.bg-spent.over{color:var(--expense)}
.bg-of{font-size:14px;font-weight:600;color:var(--text-3)}
.bg-bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bg-bar>i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .5s cubic-bezier(.32,.72,0,1)}
.bg-bar>i.over{background:var(--expense)}
.bg-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--text-2);font-weight:600}
.bg-over{color:var(--expense)}
.bg-perday{color:var(--text-3);font-weight:500}
.bg-saved{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--text-2);font-weight:500}
.bg-saved svg{width:15px;height:15px;color:var(--save)}
.bg-saved b{color:var(--save);font-weight:700;margin-left:auto}
/* ③ 예상 대비 3게이지 */
.pg-card{padding:16px 18px}
.pg-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.pg-title{font-size:12.5px;font-weight:600;color:var(--text-2)}
.pg-row{margin-bottom:14px}
.pg-row:last-child{margin-bottom:0}
.pg-done{font-size:10.5px;font-weight:700;padding:1.5px 7px;border-radius:var(--r-pill);letter-spacing:-.01em;margin-left:1px}
.pg-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.pg-k{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--text)}
.pg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pg-nums b{font-size:15px;font-weight:700;color:var(--text)}
.pg-nums b.pg-over{color:var(--expense)}
.pg-of{font-size:12.5px;font-weight:600;color:var(--text-3)}
.pg-bar{height:7px;border-radius:99px;background:var(--sunken);overflow:hidden}
.pg-bar>i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.32,.72,0,1)}
.pg-bar>i.over{background:var(--expense)!important}
.pg-foot{margin-top:5px;font-size:11.5px;font-weight:500;color:var(--text-3)}
.pg-foot.pg-over{color:var(--expense);font-weight:600}
/* 지출 분석 총계 줄 */
.eb-total{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.eb-total span{font-size:12.5px;font-weight:600;color:var(--text-2)}
.eb-total b{font-size:17px;font-weight:700;color:var(--text)}
/* ④ 지출 분석 */
.eb-card{padding:16px 18px}
.eb-bar{display:flex;height:9px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:14px}
.eb-bar>i{display:block;height:100%;border-radius:2px;min-width:3px}
.eb-list{display:flex;flex-direction:column;gap:11px}
.eb-row{display:flex;align-items:center;gap:9px}
.eb-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.eb-cat{font-size:13.5px;font-weight:600;color:var(--text);flex:1}
.eb-pc{font-size:12px;font-weight:600;color:var(--text-3);width:34px;text-align:right}
.eb-v{font-size:13.5px;font-weight:700;color:var(--text);width:88px;text-align:right}
.section-title{font-size:12.5px;font-weight:700;color:var(--text-3);letter-spacing:.02em;margin:34px 4px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.section-title .link{color:var(--brand-ink);font-weight:600;display:flex;align-items:center;gap:2px}
.section-title .link svg{width:15px;height:15px}
.chipmini{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r-pill);font-size:11px;font-weight:700;
  white-space:nowrap;flex-shrink:0}
.own-나{background:var(--brand-soft);color:var(--brand-ink)}.own-배우자{background:var(--stock-soft);color:var(--stock)}
.own-공용{background:var(--income-soft);color:var(--income)}.own-x{background:var(--sunken);color:var(--text-2)}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
.avatar svg{width:22px;height:22px}
.cur-sym{font-size:15px;font-weight:700;letter-spacing:-1.5px;line-height:1;display:inline-flex}
.a-cash{background:var(--brand-soft);color:var(--brand-ink)}.a-bank{background:var(--brand-soft);color:var(--brand-ink)}
.a-fx{background:var(--brand-soft);color:#5FBFAE}.a-gold{background:var(--gold-soft);color:#C9A227}
.a-stock{background:var(--stock-soft);color:var(--stock)}.a-house{background:var(--gold-soft);color:var(--gold)}
.a-food{background:var(--expense-soft);color:var(--expense)}.a-etc{background:var(--sunken);color:var(--text-3)}
.a-save{background:var(--save-soft);color:var(--save)}.a-debt{background:var(--expense-soft);color:var(--expense)}
.a-pension{background:var(--income-soft);color:var(--income)}.a-in{background:var(--income-soft);color:var(--income)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:54px;border-radius:var(--r-md);
  font-size:16px;font-weight:700;transition:transform .15s var(--spring),filter .15s;width:100%}
.btn:active{transform:scale(.95)}
.btn{transition:transform .38s var(--bounce),filter .15s}
.btn-primary{background:var(--brand);color:var(--on-brand);box-shadow:0 6px 16px -6px var(--brand)}
.btn-soft{background:var(--sunken);color:var(--text)}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--line-2)}
.btn-danger{background:var(--expense-soft);color:var(--expense)}
.btn svg{width:19px;height:19px}.btn-sm{height:44px;font-size:14px;border-radius:var(--r-sm)}

.hero{background:var(--surface);border-radius:var(--r-lg);border:1.5px solid var(--brand);box-shadow:var(--sh-sm);padding:17px 20px;position:relative;overflow:hidden}
.hero::before{display:none}
html[data-theme="dark"] .hero::before{background:radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.06),transparent 60%)}
.hero .label{font-size:13px;color:var(--text-2);font-weight:600;display:flex;align-items:center;gap:6px}
.hero .total{font-size:34px;font-weight:700;letter-spacing:-.035em;margin-top:3px;line-height:1.02;color:var(--text)}
.hero .total small{font-size:20px;font-weight:700;color:var(--text-2);margin-left:2px}
.hero-split{display:flex;margin-top:13px;border-top:1px solid var(--line);padding-top:12px}
.hero-split>div{flex:1}.hero-split>div+div{border-left:1px solid var(--line);padding-left:16px}
.hero-split .k{font-size:12px;color:var(--text-3);font-weight:600}
.hero-split .v{font-size:14px;font-weight:700;letter-spacing:-.02em;margin-top:2px}

/* 귀속별 순자산 — 가로 슬라이드 (위아래 카드와 좌우 라인 정렬) */
.owner-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 0 4px;margin-top:10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.owner-scroll::-webkit-scrollbar{display:none}
.owner-card{flex:0 0 auto;min-width:148px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:14px 16px;box-shadow:var(--sh-sm);scroll-snap-align:start}
.owner-card .on{font-size:12.5px;font-weight:700;color:var(--text-2)}
.owner-card .ov{font-size:17px;font-weight:700;margin-top:6px;letter-spacing:-.02em;white-space:nowrap}

.alloc-bar{height:14px;border-radius:var(--r-pill);overflow:hidden;display:flex;background:var(--sunken);margin:2px 0 14px;
  box-shadow:0 0 0 1px rgba(0,0,0,.05) inset}
.alloc-bar i{height:100%;display:block;min-width:3px;position:relative}
.alloc-bar i+i::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1.5px;background:var(--surface);opacity:.95}
html[data-theme="dark"] .alloc-bar{box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
html[data-theme="dark"] .alloc-bar i+i::before{background:var(--bg);opacity:.9}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:13px}
.legend .sw{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.legend .nm{color:var(--text-2);font-weight:500}.legend .pc{margin-left:auto;font-weight:700}

.flow3{display:flex;text-align:center}
.flow3>div{flex:1;position:relative;padding:4px 0}
.flow3>div+div::before{content:"";position:absolute;left:0;top:14%;height:72%;width:1px;background:var(--line)}
.flow3 .k{font-size:12px;color:var(--text);font-weight:600}
.flow3 .v{font-size:16px;font-weight:700;margin-top:6px;letter-spacing:-.02em}

.toggle-row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:13px 16px}
.toggle-row .tl{font-size:14px;font-weight:600}
.switch{width:46px;height:28px;border-radius:var(--r-pill);background:var(--line-2);position:relative;transition:background .2s;flex-shrink:0;appearance:none;-webkit-appearance:none;border:0;padding:0;cursor:pointer}
.switch:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.switch.on{background:var(--brand)}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on i{transform:translateX(18px)}

.mkt-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 4px}
.mkt-head .t{font-size:15px;font-weight:700}.mkt-head .ts{font-size:11px;color:var(--text-3);font-weight:500;margin-top:2px}
.sync-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:var(--r-pill);
  background:var(--brand-tint);color:var(--brand-ink);font-size:12.5px;font-weight:700}
.sync-btn svg{width:15px;height:15px;transition:transform .6s var(--ease)}
.sync-btn.spin svg{transform:rotate(360deg)}
.mkt-list{padding:6px 20px 16px}
.mkt-item{display:flex;align-items:center;gap:12px;padding:11px 0}
.mkt-item+.mkt-item{border-top:1px solid var(--line)}
.mkt-item .nm{font-weight:600;font-size:14.5px}.mkt-item .sub{font-size:12px;color:var(--text-3);font-weight:500;margin-top:1px}
.mkt-item .val{margin-left:auto;text-align:right}.mkt-item .price{font-weight:700;font-size:14.5px}

.grp-title{display:flex;align-items:baseline;justify-content:space-between;margin:20px 4px 8px}
.grp-title .g{font-size:13px;font-weight:600;color:var(--text-2)}.grp-title .gt{font-size:13.5px;font-weight:700}
.asset-item{display:flex;align-items:center;gap:13px;padding:14px 16px}
.asset-item+.asset-item{border-top:1px solid var(--line)}
.asset-item:active{background:var(--surface-2)}
.asset-item .nm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;min-width:0}
.asset-item .nm .nmt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.asset-item .sub{font-size:12px;color:var(--text-3);font-weight:500;margin-top:3px;display:flex;gap:6px;align-items:center}
.asset-item .val{margin-left:auto;text-align:right}
.asset-item .val .k{font-weight:700;font-size:15px}.asset-item .val .s{font-size:11px;color:var(--text-3);margin-top:2px}
.excl{opacity:.5}
.drag-handle{color:var(--text-3);touch-action:none;padding:6px;margin-left:-6px;cursor:grab}
.drag-handle svg{width:20px;height:20px}
.asset-item.dragging{background:var(--brand-tint);box-shadow:var(--sh-lg);border-radius:var(--r-md);position:relative;z-index:5}

.summary{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:12px 2px;margin-bottom:14px}
.summary>button{flex:1;text-align:center;position:relative;padding:4px 0;border-radius:12px}
.summary>button:active{background:var(--sunken)}
.summary>button+button::before{content:"";position:absolute;left:0;top:12%;height:76%;width:1px;background:var(--line)}
.summary .k{font-size:11.5px;color:var(--text-3);font-weight:600}
.summary .v{font-size:14.5px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:8px 8px 10px}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:2px}
.cal-week div{text-align:center;font-size:11px;font-weight:600;color:var(--text-3);padding:3px 0}
.cal-week div.sun{color:var(--expense)}.cal-week div.sat{color:var(--income)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mc-viewport{overflow:hidden;margin:14px 0 14px;padding:0;touch-action:pan-y}
.mc-track{display:flex;align-items:flex-start;will-change:transform}
.mc-track>*{flex:0 0 100%;margin-right:12px;min-width:0}
.cal-pane .ledsum{margin-bottom:14px}
.mc-track>.balance-head{margin-bottom:0}
.cal-cell{min-height:50px;display:flex;flex-direction:column;align-items:center;padding:4px 1px 3px;border-radius:11px;position:relative;overflow:hidden;min-width:0}
.cal-cell:active{background:var(--sunken)}
.cal-cell .d{font-size:13px;font-weight:600;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;flex-shrink:0}
.cal-cell.other .d{color:var(--text-3);opacity:.5}
.cal-cell.sel .d{background:var(--brand);color:var(--on-brand);font-weight:700}
.cal-cell.today .d{color:var(--brand-ink);font-weight:700;
  box-shadow:inset 0 0 0 1.5px var(--brand);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.cal-cell.today.sel .d{color:var(--on-brand);box-shadow:none} /* 선택된 오늘은 채워진 원 */
.cal-amts{display:flex;flex-direction:column;align-items:center;gap:0;margin-top:1px;width:100%;min-width:0}
.cal-cell.three .cal-amts .in,.cal-cell.three .cal-amts .ex,.cal-cell.three .cal-amts .sv{font-size:8.5px;line-height:1.14}
.cal-cell .in{font-size:9.5px;font-weight:600;color:var(--income);line-height:1.2;max-width:100%;text-align:center;white-space:nowrap;letter-spacing:-.02em}
.cal-cell .ex{font-size:9.5px;font-weight:600;color:var(--expense);line-height:1.2;max-width:100%;text-align:center;white-space:nowrap;letter-spacing:-.02em}
.cal-cell .sv{font-size:9.5px;font-weight:600;color:var(--save);line-height:1.2;max-width:100%;text-align:center;white-space:nowrap;letter-spacing:-.02em} /* 저축: 지출과 구분되는 초록 */
.cal-cell .dotp{position:absolute;top:5px;right:calc(50% - 15px);width:5px;height:5px;border-radius:50%;background:var(--gold)}
.cal-cell .dott{position:absolute;top:5px;left:calc(50% - 15px);width:5px;height:5px;border-radius:50%;background:var(--text-3)}
.cal-legend{display:flex;gap:16px;justify-content:center;margin:9px 0 2px;font-size:11.5px;color:var(--text-3);font-weight:600}
.cal-legend i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
.cal-legend .lg-sc{background:var(--gold)}.cal-legend .lg-tr{background:var(--text-3)}
.dp-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:2px 0 12px;min-width:0}
.dp-sel{min-width:0;flex:1;justify-content:center}
.dp-sel select{min-width:0;max-width:50%}
.dp-title{font-size:16px;font-weight:700;color:var(--text)}
.dp-sel{display:flex;gap:8px;align-items:center}
.dp-sel select{font-size:15px;font-weight:700;color:var(--text);background:var(--sunken);border:none;border-radius:10px;padding:7px 12px;-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
.dp-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;font-weight:700;color:var(--text-3);margin-bottom:6px;width:100%}
.dp-week .sun{color:var(--expense)}.dp-week .sat{color:var(--income)}
.dp-grid{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:1fr;gap:1px;width:100%}
.dp-cell{aspect-ratio:1/1;min-width:0;min-height:0;display:grid;place-items:center;border-radius:12px;
  font-size:16px;font-weight:700;color:var(--text);background:none;border:none;
  position:relative;z-index:1;transition:color .3s var(--ease)}
.dp-cell.empty{visibility:hidden;pointer-events:none}
.dp-cell.today{color:var(--brand-ink);font-weight:700}
.dp-cell.today::after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--brand)}
.dp-cell.today.sel::after{background:var(--brand-ink)}
.dp-today-line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 12px;font-size:12.5px;font-weight:700;color:var(--text-2)}
.dp-today-line b{color:var(--brand-ink)}
/* 날짜 선택 전용 팝업 — 시트 위에 뜨는 작은 창 (스크롤 없음) */
.dp-scrim{position:fixed;inset:0;z-index:150;background:var(--scrim);opacity:0;pointer-events:none;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .26s var(--ease)}
.dp-scrim.show{opacity:1;pointer-events:auto}
body.dp-open .page{overflow:hidden}
.dp-modal{position:fixed;z-index:151;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
  width:min(300px,calc(100vw - 48px));
  background:var(--glass-panel);-webkit-backdrop-filter:saturate(190%) blur(40px);backdrop-filter:saturate(190%) blur(40px);
  border:1px solid var(--glass-border);border-radius:30px;
  box-shadow:0 20px 60px rgba(18,26,22,.28),0 1px 0 rgba(255,255,255,.7) inset;
  padding:12px 12px 12px;opacity:0;pointer-events:none;overflow:hidden;
  transition:opacity .22s var(--ease),transform .46s var(--bounce)}
.dp-modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dp-modal .dp-nav{margin:0 0 6px}
.dp-modal .dp-today-line{margin:0 2px 4px;justify-content:flex-end}
.dp-modal .dp-today-line .txt-btn{padding:4px 8px;font-size:12.5px}
.dp-modal .dp-week{font-size:11px;margin-bottom:2px}
.dp-modal .dp-blob{border-radius:999px}
.dp-scroll{position:relative;height:250px;max-height:46vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.dp-scroll::-webkit-scrollbar{display:none}
.dp-month+.dp-month{margin-top:1px} /* 아이폰 달력처럼 날짜가 끊김 없이 이어짐 */
/* 스크롤에 따라 바뀌는 상단 월 표기 */
.dp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 6px}
.dp-mlabel{display:inline-flex;align-items:center;gap:4px;font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--text);
  padding:4px 8px;border-radius:10px;transition:transform .3s var(--bounce),background .15s}
.dp-mlabel svg{width:15px;height:15px;color:var(--brand);transition:transform .34s var(--bounce)}
.dp-mlabel.open svg{transform:rotate(180deg)}
.dp-mlabel:active{transform:scale(.95);background:var(--sunken)}
/* 다른 달 날짜(회색) */
.dp-month{transition:opacity .28s var(--ease)}
.dp-month.dim{opacity:.32} /* 보고 있는 달만 진하게 */
/* 아이폰 시계 스타일 휠 팝업 */
.dp-wheel{position:fixed;z-index:160;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
  width:min(280px,calc(100vw - 56px));opacity:0;pointer-events:none;
  touch-action:pan-y;overflow:hidden;overscroll-behavior:contain;
  background:var(--glass-panel);-webkit-backdrop-filter:saturate(190%) blur(40px);backdrop-filter:saturate(190%) blur(40px);
  border:1px solid var(--glass-border);border-radius:26px;padding:14px;
  box-shadow:0 20px 60px rgba(18,26,22,.3);transition:opacity .2s var(--ease),transform .44s var(--bounce)}
.dp-wheel.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.wh-head{font-size:14px;font-weight:700;text-align:center;margin-bottom:8px}
.wh-box{position:relative;display:flex;gap:8px;height:150px;overflow:hidden;touch-action:pan-y}
.wh-sel{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:38px;border-radius:12px;
  background:var(--brand-soft);pointer-events:none;z-index:0}
.wh-col{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-snap-stop:always;
  scroll-behavior:smooth;scrollbar-width:none;
  padding:56px 0;position:relative;z-index:1;-webkit-overflow-scrolling:touch;
  touch-action:pan-y;overscroll-behavior:contain}
.wh-col::-webkit-scrollbar{display:none}
.wh-item{height:38px;display:grid;place-items:center;scroll-snap-align:center;font-size:16px;font-weight:700;
  color:var(--text-3);transition:color .2s,transform .2s var(--bounce);white-space:nowrap}
.wh-item.wide{font-size:15.5px}
.wh-item.on{color:var(--brand-ink);font-weight:700;transform:scale(1.08)}
.dp-modal .dp-grid{grid-auto-rows:34px;row-gap:1px}
.dp-modal .dp-cell.today::after{bottom:3px}
.dp-modal .mn-arw{width:34px;height:34px;background:var(--glass-btn)}
.dp-modal .dp-sel select{background:var(--glass-btn);padding:6px 8px;font-size:14px}
.dp-actions{display:flex;align-items:center;gap:6px}
.dp-ok{width:36px;height:36px;border-radius:50%;
  background:var(--brand-soft);border:1.5px solid var(--brand);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  color:var(--brand-ink);display:grid;place-items:center;
  box-shadow:0 4px 14px -4px var(--brand),0 1px 0 rgba(255,255,255,.35) inset;
  transition:transform .38s var(--bounce)}
.dp-ok svg{width:18px;height:18px}
.dp-ok:active{transform:scale(.88)}
.dp-fab-row{margin-top:8px}
.dp-fab-row{display:flex;justify-content:flex-end;margin-top:12px}
/* 연도 · 월 분리 선택 */
.dp-cell.sel{color:var(--brand-ink);font-weight:700}
.dp-cell:not(.sel):active{background:var(--sunken)}
/* 하단 탭처럼 미끄러지는 물방울 */
.dp-blob{position:absolute;top:0;left:0;width:0;height:0;border-radius:14px;background:var(--brand-soft);
  box-shadow:0 4px 14px -4px var(--brand),0 1px 0 rgba(255,255,255,.5) inset;
  transition:transform .7s var(--bounce),width .7s var(--bounce),height .7s var(--bounce);
  pointer-events:none;z-index:0;opacity:0}
.dp-blob.on{opacity:1}
.dp-blob.squish{transform:var(--dpT) scaleX(1.16) scaleY(.88)!important}
.day-head{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 8px}
.day-head .d{font-size:15px;font-weight:700}.day-head .s{font-size:13px;font-weight:700}

/* 스와이프 액션 — 소프트 스타일 */
.swipe{position:relative;overflow:hidden}
.swipe+.swipe{border-top:1px solid var(--line)}
.swipe-content{position:relative;background:var(--surface);transition:transform .26s var(--ease);z-index:1;display:flex;align-items:center;gap:12px;padding:13px 16px}
.swipe.open .swipe-content{transform:translateX(-152px)}
.swipe-content .nm{font-weight:600;font-size:15px}
.swipe-content .tag{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.nm-row{display:flex;align-items:center;gap:5px;min-width:0}
.nm-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-ic{flex-shrink:0;display:inline-flex;color:var(--text-3);opacity:.9}
.rec-ic svg{width:13px;height:13px;display:block}
.flow-sub{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:12.5px;color:var(--text-3);min-width:0}
.flow-sub .fl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow-sub .sch-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0}
.mini{font-size:11px;font-weight:600;color:var(--text-3);background:var(--sunken);padding:2px 7px;border-radius:var(--r-pill)}
.mini.sch{background:var(--gold-soft);color:var(--gold)}
.swipe-content .amt{margin-left:auto;font-weight:700;font-size:15px;white-space:nowrap;padding-left:8px}
.sel-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex-shrink:0;display:grid;place-items:center;transition:transform .4s var(--bounce),background .2s,border-color .2s}
.sel-check.on{background:var(--brand);border-color:var(--brand);transform:scale(1.12)}
.sel-check svg{width:13px;height:13px;color:#fff;opacity:0;transform:scale(.5);transition:opacity .18s,transform .4s var(--bounce)}

.chip{flex-shrink:0;height:36px;padding:0 15px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line-2);font-size:13.5px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}

.empty-cta{display:inline-flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;height:40px;padding:0 18px;border-radius:var(--r-pill);background:var(--brand);color:var(--on-brand);font-size:14px;font-weight:700;transition:transform .15s var(--spring)}
.empty-cta svg{width:16px;height:16px}.empty-cta:active{transform:scale(.95)}.empty .et{font-size:15px;font-weight:700;color:var(--text-2)}.empty .es{font-size:13px;margin-top:5px}
/* pick field — 탭하면 열리는 선택 (통장/카테고리/종류/귀속) */
.pick{width:100%;min-height:54px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface-2);padding:9px 14px;display:flex;align-items:center;gap:11px;text-align:left;transition:border .15s,transform .15s var(--spring)}
.pick:active{transform:scale(.99);border-color:var(--brand)}
.pick .pav{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.pick .pav svg{width:18px;height:18px}
.pick .pbody{flex:1;min-width:0}
.pick .pn{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .psub{font-size:12px;color:var(--text-3);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .pc{color:var(--text-3);flex-shrink:0}.pick .pc svg{width:18px;height:18px}
.pick.placeholder .pn{color:var(--text-3);font-weight:600}

/* picker sheet */
.pk-back{position:absolute;top:14px;left:14px;width:34px;height:34px;border-radius:50%;background:var(--sunken);color:var(--text-2);display:grid;place-items:center;z-index:2;transition:transform .15s var(--spring)}
.pk-back svg{width:18px;height:18px}.pk-back:active{transform:scale(.9)}
.pk-h{font-size:19px;font-weight:700;margin:2px 0 12px;padding-left:56px;min-height:34px;display:flex;align-items:center}
.pk-group{position:relative;margin:0 -6px}
.pk-blob{position:absolute;top:0;left:0;width:0;height:0;border-radius:var(--r-md);
  background:var(--brand-soft);border:1.5px solid var(--brand);
  box-shadow:0 1px 3px rgba(0,0,0,.10);
  transition:transform .42s cubic-bezier(.32,.72,0,1),width .42s cubic-bezier(.32,.72,0,1),height .42s cubic-bezier(.32,.72,0,1);
  pointer-events:none;z-index:0;opacity:0}
.pk-blob.on{opacity:1}
.pk-blob.squish{transform:var(--pbT)!important} /* 출렁임 제거 */
.pk-item{position:relative;z-index:1}
.pk-cap{font-size:12px;font-weight:700;color:var(--text-3);margin:14px 10px 4px;letter-spacing:.02em}
.pk-cap:first-child{margin-top:2px}
.pk-item{width:100%;display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:var(--r-md);text-align:left;transition:background .12s,transform .12s var(--spring)}
.pk-item:active{transform:scale(.99);background:var(--surface-2)}
.pk-item.on{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.pk-item.on .pn{color:var(--brand-ink);font-weight:700}
.pk-item .pav{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.pk-item .pav svg{width:19px;height:19px}
.pk-item .pbody{flex:1;min-width:0}
.pk-item .pn{font-weight:700;font-size:15px}
.pk-item .psub{font-size:12px;color:var(--text-3);font-weight:500;margin-top:2px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pk-item .amt{margin-left:auto;text-align:right;font-weight:700;font-size:13.5px;white-space:nowrap;color:var(--text-2)}
.pk-item .rc{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex-shrink:0;display:grid;place-items:center;margin-left:8px}
.pk-item:not(.hasamt) .rc{margin-left:auto}
.pk-item.on .rc{border-color:var(--brand);background:var(--brand)}
.pk-item .rc svg{width:13px;height:13px;color:#fff;opacity:0}.pk-item.on .rc svg{opacity:1}
.pk-cat-grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:4px}
.cat-blob{position:absolute;top:0;left:0;width:0;height:0;border-radius:var(--r-md);
  background:var(--brand-soft);border:1.5px solid var(--brand);
  box-shadow:0 1px 3px rgba(0,0,0,.10);
  transition:transform .42s cubic-bezier(.32,.72,0,1),width .42s cubic-bezier(.32,.72,0,1),height .42s cubic-bezier(.32,.72,0,1);
  pointer-events:none;z-index:0;opacity:0}
.cat-blob.on{opacity:1}
.cat-blob.squish{transform:var(--gbT)!important}
.pk-cat{position:relative;z-index:1}
.pk-cat{height:74px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:700;color:var(--text-2);transition:transform .12s var(--spring)}
.pk-cat:active{transform:scale(.96)}
.pk-cat .cav{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.pk-cat .cav svg{width:18px;height:18px}
.pk-cat.on{background:transparent;border-color:transparent;color:var(--brand-ink);font-weight:700;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.pk-cat.on .cav{background:var(--brand);color:#fff}

/* 관리 목록 액션 버튼 (수정/삭제 — 명확히 보이게) */
.row-acts{display:flex;gap:7px;flex-shrink:0}
.act-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sunken);color:var(--text-2);transition:transform .15s var(--spring)}
.act-btn svg{width:18px;height:18px}
.act-btn:active{transform:scale(.9)}
.act-btn.danger{background:var(--expense-soft);color:var(--expense)}
.manage-row .ic svg{width:19px;height:19px}

/* 홈 금액 자동 맞춤 */
.fit{white-space:nowrap;display:block}
.hero-split .fit{display:block}

.hd-l{min-width:0}
.month-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 14px}
.thismonth-row{display:flex;justify-content:center;margin:-8px 0 14px}
.mn-arw{width:40px;height:40px;border-radius:13px;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;box-shadow:var(--sh-sm);transition:transform .15s var(--spring)}
.mn-arw svg{width:18px;height:18px}.mn-arw:active{transform:scale(.9)}
.month-nav.solo{justify-content:center}
.month-nav.solo .mn-lbl{flex:0 1 auto;width:min(320px,86%);max-width:none;padding:0 20px}
.mn-lbl{flex:1;max-width:230px;height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:7px;font-size:16px;font-weight:700;letter-spacing:-.02em;box-shadow:var(--sh-sm);transition:transform .15s var(--spring)}
.mn-lbl svg{width:15px;height:15px;color:var(--text-3)}.mn-lbl:active{transform:scale(.97)}

.as-tools{display:flex;align-items:center;gap:10px;margin:16px 0 10px;min-height:34px}
.as-actions{flex:1;display:flex;gap:10px}
.nw-carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-top:2px}
.nw-carousel::-webkit-scrollbar{display:none}
.nw-carousel>.hero{flex:0 0 100%;scroll-snap-align:start}
.nw-dots{display:flex;justify-content:center;gap:6px;margin:11px 0 2px}
.nw-dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2);transition:background .22s,width .22s}
.nw-dots i.on{background:var(--brand);width:18px;border-radius:3px}
.as-tools.hidden{visibility:hidden;pointer-events:none} /* 자리는 유지 → 선택 모드에서 목록이 밀리지 않음 */
.as-tbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 13px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-2);font-size:14px;font-weight:700;color:var(--text-2);transition:transform .15s var(--spring)}
.as-tbtn svg{width:16px;height:16px}.as-tbtn:active{transform:scale(.96)}
.as-tbtn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}

.ledsum{padding:11px 10px 9px;margin-bottom:14px}
.ledsum button{pointer-events:none} /* 제스처는 카드가 수신 (내부 버튼 비활성) */
.ledsum.peek{background:var(--surface-2)} /* 미리보기 표시는 은은하게 (형광 느낌 제거) */
@keyframes rowFlash{0%{background:var(--surface)}18%{background:var(--brand-soft)}100%{background:var(--surface)}}
.flash{animation:rowFlash 1.3s var(--ease)}
@keyframes numIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.num-in{animation:numIn .34s var(--ease)}
.totbox.peek{background:var(--surface-2)}
.card.ledsum,.card.totbox{border:1.5px solid var(--brand)} /* 대표 카드 셸 통일 (플랜 카드와 동일) */
.ledsum .k{font-size:11.5px;color:var(--text);font-weight:600;letter-spacing:.02em}
.ledsum .v{letter-spacing:-.03em;font-weight:700}
.ls1{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0 9px;width:100%;border-bottom:1px solid var(--line)}
.ls1 .v{font-size:27px;letter-spacing:-.035em}
.ls3{display:flex;padding:9px 0 8px;text-align:center}
.ls3>button{flex:1;position:relative;padding:2px 4px;border-radius:10px}
.ls3>button:active{background:var(--sunken)}
.ls3>button+button::before{content:"";position:absolute;left:0;top:12%;height:76%;width:1px;background:var(--line)}
.ls3 .k{display:block}.ls3 .v{font-size:15px;font-weight:700;margin-top:6px;display:block}
.lsr{display:flex;align-items:center;justify-content:space-between;width:100%;padding:9px 8px 1px;border-top:1px solid var(--line)}
.lsr .k{font-weight:600}.lsr .v{font-size:14px;color:var(--text-2)}

.home-alert{position:relative;display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;text-align:left;background:var(--expense-soft);border:none;border-radius:var(--r-md);padding:13px 14px 13px 18px;margin-bottom:14px;box-shadow:var(--sh-sm);overflow:hidden;transition:transform .15s var(--spring)}
.home-alert::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--expense)}
.home-alert:active{transform:scale(.99)}
.alert-stack-wrap{margin-bottom:14px}
.alert-stack{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  touch-action:pan-x;overscroll-behavior-x:contain}
.alert-stack::-webkit-scrollbar{display:none}
.alert-stack>.home-alert{flex:0 0 100%;scroll-snap-align:center;margin-bottom:0}
.alert-dots{display:flex;gap:6px;justify-content:center;margin-top:9px}
.alert-dots .ad{width:6px;height:6px;border-radius:50%;background:var(--line-2);transition:all .22s var(--spring)}
.alert-dots .ad.on{background:var(--expense);width:18px;border-radius:3px}
.home-alert.mat{background:var(--gold-soft)}.home-alert.mat::before{background:var(--gold)}.home-alert.mat .ha-ic{background:var(--gold)}
.home-alert.mat .ha-t,.home-alert.mat .ha-c{color:var(--gold)}
.home-alert.confirm{background:var(--brand-soft)}.home-alert.confirm::before{background:var(--brand)}
.home-alert.confirm .ha-ic{background:var(--brand)}
.home-alert.confirm .ha-t,.home-alert.confirm .ha-c{color:var(--brand-ink)}
.home-alert.tidy{background:var(--sunken)}.home-alert.tidy::before{background:var(--text-3)}
.home-alert.tidy .ha-ic{background:var(--text-3)}
.home-alert.tidy .ha-t{color:var(--text)}
.home-alert.tidy .ha-c{color:var(--text-3)}
.home-alert.quick{background:var(--income-soft)}.home-alert.quick::before{background:var(--income)}
.home-alert.quick .ha-ic{background:var(--income)}
.home-alert.quick .ha-t,.home-alert.quick .ha-c{color:var(--income)}
/* 다음에 나갈 큰돈 — 홈의 주인공 */
.next-card{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--brand);
  border-radius:var(--r-lg);padding:20px 22px 18px;margin-bottom:14px;box-shadow:var(--sh-sm);
  transition:transform .3s var(--bounce)}
.next-card:active{transform:scale(.985)}
.next-card.warn{border-color:var(--expense);border-width:1.5px}
.nc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nc-lb{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.02em}
.nc-dd{font-size:12px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);border-radius:999px;padding:4px 10px}
.next-card.warn .nc-dd{color:var(--expense);background:var(--expense-soft)}
.nc-amt{font-size:34px;font-weight:700;letter-spacing:-.04em;margin-top:10px;line-height:1.05;color:var(--text)}
.nc-amt small{font-size:17px;margin-left:2px;font-weight:700;color:var(--text-2)}
.nc-nm{font-size:13.5px;color:var(--text-2);font-weight:600;margin-top:4px}
.nc-foot{font-size:12.5px;font-weight:600;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--text-2)}
.nc-foot b{font-weight:700}
.nc-foot.bad{color:var(--expense)}
.nc-foot.good b{color:var(--text)}
.nc-empty{font-size:14px;color:var(--text-2);font-weight:600;margin-top:10px}
.nc-fix{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;height:44px;border-radius:14px;
  background:var(--expense);color:#fff;font-size:14px;font-weight:700;box-shadow:0 6px 18px -6px var(--expense);
  transition:transform .3s var(--bounce)}
.nc-fix svg{width:17px;height:17px}
.nc-fix:active{transform:scale(.96)}
.fix-cap{font-size:12px;font-weight:700;color:var(--text-3);letter-spacing:.02em;margin:16px 2px 8px}
/* + 버튼 말풍선 팝업 */
.fab-pop{position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--ad-h) + env(safe-area-inset-bottom) + 70px);z-index:56;
  width:224px;padding:6px;border-radius:18px;
  background:var(--glass-panel);-webkit-backdrop-filter:saturate(190%) blur(30px);backdrop-filter:saturate(190%) blur(30px);
  border:1px solid var(--glass-border);box-shadow:0 16px 40px rgba(18,26,22,.25);
  opacity:0;transform:translateY(8px) scale(.9);transform-origin:bottom right;pointer-events:none;
  transition:opacity .2s var(--ease),transform .42s var(--bounce)}
.fab-pop.show{opacity:1;transform:none;pointer-events:auto}
.fab-pop::after{content:"";position:absolute;right:20px;bottom:-6px;width:12px;height:12px;
  background:var(--glass-panel);border-right:1px solid var(--glass-border);border-bottom:1px solid var(--glass-border);
  transform:rotate(45deg)}
.fp-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:13px;
  transition:background .15s,transform .3s var(--bounce)}
.fp-item:active{transform:scale(.96);background:var(--sunken)}
.fp-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.fp-ic svg{width:17px;height:17px}
.fp-b{display:flex;flex-direction:column;min-width:0}
.fp-t{font-size:14.5px;font-weight:700;color:var(--text)}
.fp-s{font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:1px}
.fab.open{transform:rotate(45deg)}
/* 홈 빠른 입력 버튼 */
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--ad-h) + env(safe-area-inset-bottom) + 16px);z-index:55;
  width:46px;height:46px;border-radius:50%;background:var(--brand);color:#fff;display:none;place-items:center;
  box-shadow:0 8px 22px -8px var(--brand),0 2px 6px rgba(0,0,0,.1);
  transition:transform .4s var(--bounce),opacity .25s}
.fab::before,.fab::after{content:"";position:absolute;background:#fff;border-radius:2px}
.fab::before{width:17px;height:2.2px}
.fab::after{width:2.2px;height:17px}
body.show-fab .fab{display:grid}
body.selmode .fab{display:none}
.fab:active{transform:scale(.9) rotate(90deg)}
/* 통장 안전 신호등 */
.sig{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.sig.ok{background:var(--brand)}
.sig.warn{background:var(--gold)}
.sig.bad{background:var(--expense)}
.sig-t{font-weight:700;margin-top:2px}
.sig-t.ok{color:var(--text-3)}
.sig-t.warn{color:var(--gold)}
.sig-t.bad{color:var(--expense)}
/* 이번 달 나갈 돈 */
.of-card{padding:16px 18px}
.of-total{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;margin-bottom:6px;
  border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--text-3)}
.of-total .num{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.03em}
.of-row{display:flex;align-items:center;gap:10px;padding:9px 0;transition:opacity .15s}
.of-row:active{opacity:.55}
.of-row+.of-row{border-top:1px solid var(--line)}
.of-nm{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.of-dt{font-size:12px;color:var(--text-3);font-weight:600;flex-shrink:0}
.of-am{font-size:14px;font-weight:700;flex-shrink:0}
.of-more{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;margin-top:6px;padding:11px 0 3px;
  font-size:12.5px;color:var(--text-2);font-weight:700;border-top:1px solid var(--line);
  transition:transform .3s var(--bounce),color .2s}
.of-more svg{width:14px;height:14px}
.of-ar{display:inline-flex;transition:transform .34s var(--bounce)}
.of-ar.up{transform:rotate(180deg)}
.of-more:active{transform:scale(.97);color:var(--brand-ink)}
/* 다 잘 되고 있을 때 */
.home-alert.safe{background:var(--brand-soft)}.home-alert.safe::before{background:var(--brand)}
.home-alert.safe .ha-ic{background:var(--brand)}
.home-alert.safe .ha-t{color:var(--brand-ink)}
/* 해냈을 때의 작은 축하 */
.celebrate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;pointer-events:none;
  opacity:0;transition:opacity .3s var(--ease)}
.celebrate.show{opacity:1}
.cel-card{background:var(--glass-panel);-webkit-backdrop-filter:saturate(190%) blur(30px);backdrop-filter:saturate(190%) blur(30px);
  border:1px solid var(--glass-border);border-radius:24px;padding:22px 30px;
  font-size:19px;font-weight:700;color:var(--text);letter-spacing:-.02em;
  box-shadow:0 20px 60px rgba(18,26,22,.28);
  transform:scale(.7);transition:transform .55s var(--bounce)}
.celebrate.show .cel-card{transform:scale(1)}
.confirm-btn{flex-shrink:0;margin-left:8px;background:var(--brand);color:#fff;font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 13px;box-shadow:var(--sh-sm)}
.confirm-btn:active{transform:scale(.93)}
.ha-ic{width:38px;height:38px;border-radius:11px;background:var(--expense);color:#fff;display:grid;place-items:center;flex-shrink:0}
.ha-ic svg{width:19px;height:19px}
.ha-b{flex:1;min-width:0}
.ha-t{font-weight:700;font-size:14px;color:var(--expense)}
.ha-s{font-size:12.5px;color:var(--text-2);font-weight:500;margin-top:2px}
.ha-c{color:var(--expense);flex-shrink:0}.ha-c svg{width:18px;height:18px}

.balance-head.neg .v{color:var(--expense)}

/* 잔액 부족 경고 — 사각 배경 대신 아이콘 색 + 점으로 (물방울과 겹치지 않게) */
.nav-btn.warn{color:var(--expense)}
.nav-btn.warn.on{color:var(--expense)}
.nav-badge{position:absolute;top:6px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  background:var(--expense);color:#fff;font-size:10.5px;font-weight:700;font-style:normal;line-height:17px;text-align:center;
  box-shadow:0 0 0 2px var(--glass),0 2px 6px -1px var(--expense);
  opacity:0;transform:scale(.5);transition:opacity .25s,transform .45s var(--bounce);pointer-events:none}
.nav-badge.on{opacity:1;transform:scale(1);animation:warnPulse 2.4s ease-in-out infinite}
@keyframes warnPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.9}}
/* 경고 탭이 선택되면 물방울도 경고색으로 */
.nav-blob.warn{background:var(--expense-soft);box-shadow:0 4px 14px -4px var(--expense),0 1px 0 rgba(255,255,255,.5) inset}

/* auth screen */
.auth-view{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:0 22px;padding-top:max(48px,calc(env(safe-area-inset-top) + 40px));padding-bottom:40px}
.auth-card{width:100%;max-width:400px;margin:auto 0}
.auth-logo{width:66px;height:66px;border-radius:20px;background:var(--brand-tint);display:grid;place-items:center;font-size:34px;margin:0 auto 14px}
.auth-title{text-align:center;font-size:24px;font-weight:700;letter-spacing:-.03em}
.auth-sub{text-align:center;color:var(--text-2);font-size:13.5px;font-weight:500;margin:6px 0 22px}
.kakao-btn{width:100%;height:52px;border-radius:14px;background:#FEE500;color:#191600;font-size:15.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--spring)}
.kakao-btn:active{transform:scale(.98)}.kakao-btn .kico{display:inline-flex}.kakao-btn .kico svg{width:20px;height:20px}
.auth-div{display:flex;align-items:center;gap:12px;margin:18px 2px;color:var(--text-3);font-size:12px;font-weight:600}
.auth-div::before,.auth-div::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-seg{display:flex;background:var(--sunken);border-radius:12px;padding:4px;margin-bottom:14px}
.auth-seg button{flex:1;height:38px;border-radius:9px;font-size:14px;font-weight:700;color:var(--text-2)}
.auth-seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-sm)}
.auth-field{margin-bottom:12px}.auth-field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.auth-field input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 14px;font-size:16px;color:var(--text);outline:none;transition:border .15s}
.auth-field input:focus{border-color:var(--brand)}
.auth-err{color:var(--expense);font-size:13px;font-weight:600;margin:2px 2px 10px}
.auth-submit{width:100%;margin-top:4px}
.auth-guest{display:block;width:100%;height:44px;margin-top:10px;font-size:14px;font-weight:700;color:var(--text-2)}
.auth-guest:active{color:var(--text)}
.auth-note{font-size:11.5px;color:var(--text-3);line-height:1.65;margin-top:16px;text-align:center}
.auth-note b{color:var(--text-2)}
.kkey{margin-top:12px;padding:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);text-align:left}
.kkey label{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.kkey input{width:100%;height:46px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;font-size:14px;color:var(--text);outline:none}
.kkey input:focus{border-color:var(--brand)}
.kkey-row{display:flex;gap:8px;margin-top:10px}.kkey-row .btn{height:44px}
.kkey-help{font-size:11.5px;color:var(--text-3);line-height:1.6;margin-top:10px}
.kkey-help b{color:var(--text-2)}

/* account card + menu footer actions */
.acct-card{padding:14px 16px;margin-bottom:14px}
.acct-head{display:flex;align-items:center;gap:12px}
.acct-av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--brand-tint);flex-shrink:0}
.acct-i .an{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-i .ak{font-size:12.5px;color:var(--text-3);font-weight:600;margin-top:2px}
.acct-card .mc{color:var(--text-3)}.acct-card .mc svg{width:18px;height:18px}
.menu-foot-actions{display:flex;gap:10px;margin-top:14px}
.mfa{flex:1;height:48px;border-radius:14px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--text-2);transition:transform .15s var(--spring)}
.mfa svg{width:17px;height:17px}.mfa:active{transform:scale(.97)}
.mfa.danger{color:var(--expense);border-color:transparent;background:var(--expense-soft)}
.help-body{font-size:13.5px;line-height:1.7;color:var(--text-2)}
.help-body p{margin-bottom:14px}.help-body b{color:var(--text);font-weight:700}


/* spending analysis */
.spend-row{display:flex;align-items:center;gap:11px;padding:10px 0;cursor:pointer}
.spend-row+.spend-row{border-top:1px solid var(--line)}
.spend-av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.spend-av svg{width:17px;height:17px}
.spend-mid{flex:1;min-width:0}
.spend-nm{font-size:14px;font-weight:700}
.spend-track{height:7px;border-radius:5px;background:var(--sunken);margin-top:6px;overflow:hidden}
.spend-track i{display:block;height:100%;background:var(--expense);border-radius:5px}
.spend-track i.budgeted{background:var(--brand)}
.spend-track i.over{background:var(--expense)}
.spend-amt{text-align:right;flex-shrink:0}
.spend-amt .a{font-size:14px;font-weight:700}.spend-amt .p{font-size:11px;color:var(--text-3);font-weight:600;margin-top:1px}
.spend-amt .a.over,.spend-amt .p.over{color:var(--expense)}
.spend-amt .a .bgt{font-size:11px;font-weight:600;color:var(--text-3)}


@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
let TODAY=todayStr();
function addDays(s,n){const d=new Date(s);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function ym(s){const[Y,M]=s.split('-').map(Number);return{y:Y,m:M}}
function inMonth(s,y,m){const p=ym(s);return p.y===y&&p.m===m}
function lastDay(y,m){return new Date(y,m,0).getDate()}
function monthEndStr(y,m){return `${y}-${String(m).padStart(2,'0')}-${String(lastDay(y,m)).padStart(2,'0')}`}
function monthStartStr(y,m){return `${y}-${String(m).padStart(2,'0')}-01`}
function wname(s){return['일','월','화','수','목','금','토'][new Date(s).getDay()]}
function fmtDate(s){const d=new Date(s);return `${d.getMonth()+1}월 ${d.getDate()}일 ${wname(s)}요일`}
function shortDate(s){const d=new Date(s);return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${wname(s)})`}
function fmtDateFull(s){if(!s)return '날짜 선택';const d=new Date(s);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${wname(s)})`}

 if(!DB.settings.confirmTransfers||!t||t.type!=='transfer')return false;
 if(t.isRec){const r=DB.recurrences.find(x=>x.id===t.recId);return !!(r&&r.autoConfirm===false&&!(r.confirmedDates||[]).includes(t.date))}
 return t.confirmed===false;
}

let SESSION=localStorage.getItem('asset_app_session')||'';

function migrateLegacy(){try{const legacy=localStorage.getItem(SKEY);const guest=localStorage.getItem('asset_app_db_v3__guest');if(legacy&&!guest)localStorage.setItem('asset_app_db_v3__guest',legacy)}catch(e){}}
/* ---- Supabase(클라우드 동기화) 연결: URL·anon 키는 메뉴 › 계정 화면에서 붙여넣습니다 ---- */
const SUPABASE_URL='';const SUPABASE_ANON_KEY='';/* 선택: 코드에 직접 넣어도 되고, 앱 화면에서 붙여넣어도 됩니다 */
let SB=null;
function sbCfg(){try{return{url:(localStorage.getItem('asset_app_sb_url')||'').trim()||SUPABASE_URL,key:(localStorage.getItem('asset_app_sb_key')||'').trim()||SUPABASE_ANON_KEY}}catch(e){return{url:SUPABASE_URL,key:SUPABASE_ANON_KEY}}}
function sbReady(){const c=sbCfg();if(!c.url||!c.key||!window.supabase)return false;if(!SB){try{SB=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}})}catch(e){return false}}return true}
function sbErrMsg(e){const m=(e&&e.message)||'';if(/registered|already/i.test(m))return'이미 가입된 이메일이에요';if(/invalid login|invalid.*credentials/i.test(m))return'이메일 또는 비밀번호가 올바르지 않아요';if(/confirm/i.test(m))return'이메일 인증이 필요해요 · 메일함을 확인해 주세요';if(/password/i.test(m))return'비밀번호는 6자 이상이어야 해요';return m||'클라우드 연결에 실패했어요'}
/* 동기화 상태: 'idle'|'syncing'|'ok'|'error'|'conflict' — 계정 화면에 표시, 실패/충돌은 1회만 토스트 */
let CLOUD_SYNC_STATE='idle';let CLOUD_LAST_OK=null;let CLOUD_LAST_SYNCED_AT=null;
let CLOUD_ERR_TOASTED=false;let CLOUD_CONFLICT_TOASTED=false;
function cloudSyncOk(){CLOUD_SYNC_STATE='ok';CLOUD_LAST_OK=Date.now();CLOUD_ERR_TOASTED=false;CLOUD_CONFLICT_TOASTED=false}
function cloudSyncFailed(){CLOUD_SYNC_STATE='error';if(!CLOUD_ERR_TOASTED){CLOUD_ERR_TOASTED=true;toast('클라우드 동기화에 실패했어요 · 인터넷 연결을 확인해 주세요')}}
function cloudSyncLabel(){
 if(!CLOUD_UID)return '';
 if(CLOUD_SYNC_STATE==='conflict')return '⚠ 다른 기기에 최신 데이터가 있어요';
 if(CLOUD_SYNC_STATE==='error')return '⚠ 동기화 실패 · 인터넷 연결 확인';
 if(CLOUD_SYNC_STATE==='syncing')return '동기화 중…';
 if(CLOUD_LAST_OK)return '클라우드 동기화됨 · '+fmtSynced(CLOUD_LAST_OK);
 return '클라우드 연결됨';
}
async function pullCloud(){
 if(!sbReady()||!CLOUD_UID)return null;
 try{
  const{data,error}=await SB.from('user_data').select('data,updated_at').eq('user_id',CLOUD_UID).maybeSingle();
  if(error){cloudSyncFailed();return null}
  if(!data)return null;
  CLOUD_LAST_SYNCED_AT=data.updated_at;cloudSyncOk();
  return data.data||null;
 }catch(e){cloudSyncFailed();return null}
}
let SB_PUSH_T=null;
function scheduleCloudPush(){if(!sbReady()||!CLOUD_UID)return;clearTimeout(SB_PUSH_T);SB_PUSH_T=setTimeout(()=>pushCloud().catch(()=>{}),1200)}
async function pushCloud(){
 if(!sbReady()||!CLOUD_UID)return;
 CLOUD_SYNC_STATE='syncing';
 try{
  const{data:cur}=await SB.from('user_data').select('updated_at').eq('user_id',CLOUD_UID).maybeSingle();
  if(cur&&cur.updated_at&&CLOUD_LAST_SYNCED_AT&&cur.updated_at>CLOUD_LAST_SYNCED_AT){
   CLOUD_SYNC_STATE='conflict';
   if(!CLOUD_CONFLICT_TOASTED){CLOUD_CONFLICT_TOASTED=true;toast('다른 기기에 더 최신 데이터가 있어요 · 메뉴 › 계정에서 확인하세요')}
   return;
  }
  const nowIso=new Date().toISOString();
  const{error}=await SB.from('user_data').upsert({user_id:CLOUD_UID,data:DB,updated_at:nowIso});
  if(error){cloudSyncFailed();return}
  CLOUD_LAST_SYNCED_AT=nowIso;cloudSyncOk();
 }catch(e){cloudSyncFailed()}
}

 const guestRaw=localStorage.getItem('asset_app_db_v3__guest');let guestDB=null,guestHasData=false;
 try{guestDB=JSON.parse(guestRaw||'{}');guestHasData=(guestDB.assets&&guestDB.assets.length)||(guestDB.txns&&guestDB.txns.length)}catch(e){}
 if(guestHasData){DB=guestDB;migrate()}else if(!DB||!Array.isArray(DB.assets)){DB=emptyDB()}
 save();
}

/* 이 함수는 로컬 DB를 전혀 바꾸지 않는다(로컬→클라우드로 push만 함) — 되돌릴 수 없는 건
 * 다른 기기가 저장해 둔 클라우드 쪽 데이터이고, 그 값은 애초에 로컬로 받아온 적이 없어
 * 스냅샷을 뜰 수도 없다(pushCloud는 updated_at만 비교하고 원격 data 본문은 안 읽음).
 * 그래서 delTx 등과 같은 undoToast 방식 대신, 실행 전에 한 번 더 확인받는 confirmSheet로
 * 막는다 — confirmCloudForcePush()가 그 확인창이고, 실제 덮어쓰기는 여기서 그대로 한다. */
async function resolveCloudForcePush(){
 closeSheet();toast('업로드하는 중…');
 CLOUD_LAST_SYNCED_AT=null;/* 이번 한 번은 충돌 검사를 건너뛰고 내 데이터로 덮어쓴다 */
 await pushCloud();

function recDates(r,from,to){

   while(cur<=endd){const y=cur.getFullYear(),m=cur.getMonth()+1;
     const day=r.day==='last'?lastDay(y,m):Math.min(r.day,lastDay(y,m));
     const ds=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
     if(ds>=r.startDate)push(ds);
     cur.setMonth(cur.getMonth()+1);}

   const mo=rs.getMonth()+1,day=rs.getDate(); /* 2/29 시작 등은 윤년 아닌 해에 clamp (setFullYear 롤오버로 3/1로 밀리는 것 방지) */

     const ds=`${y}-${String(mo).padStart(2,'0')}-${String(d2).padStart(2,'0')}`;

function nwChartPath(pts,W,H){
 if(pts.length<2)return {line:'',area:''};
 const vals=pts.map(p=>p.nw);
 const min=Math.min(...vals),max=Math.max(...vals);
 const span=(max-min)||1;
 const stepX=W/(pts.length-1);
 const coords=pts.map((p,i)=>[i*stepX,H-((p.nw-min)/span)*H]);
 const line=coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
 const area=line+` L${coords[coords.length-1][0].toFixed(1)},${H} L0,${H} Z`;
 return {line,area};
}
function ownerNet(o){let s=0;
 DB.assets.filter(a=>a.owner===o&&a.includeInTotal).forEach(a=>{s+=a.type==='debt'?-assetEval(a):assetEval(a)});
 return s;}

   if(txScheduled(t)&&!inc)return;
   if(t.adjust&&!t.inSurplus)return; /* 잔액 조정: 항목별 포함 설정(기본 제외) */
   if(t.type==='income')income+=t.amount;else if(t.type==='expense')expense+=t.amount;else if(t.type==='saving')saving+=t.amount;else if(t.type==='transfer')transfer+=t.amount;
 });
 return {income,expense,saving,transfer,suji:income-expense-saving};
}

 a.suji=a.income-a.expense-a.saving; sc.suji=sc.income-sc.expense-sc.saving;
 return {a,sc};

function expenseBreakdownCard(cats,_ignore){
 if(!cats.length)return '';
 const spent=cats.reduce((s,c)=>s+c.v,0); /* 분모=카테고리 합계 (예정 포함 전체와 일치) */
 if(!spent)return '';
 const PAL=['var(--brand)','var(--gold)','var(--stock)','var(--income)','var(--expense)','#7CC7B8','#C9A227','var(--save)'];
 const col=i=>PAL[i%PAL.length];
 // 퍼센트 합이 정확히 100이 되도록 보정 (최대 잔여법)
 const raw=cats.map(c=>c.v/spent*100);
 const floor=raw.map(v=>Math.floor(v));
 let rem=100-floor.reduce((s,v)=>s+v,0);
 const order=raw.map((v,i)=>({i,frac:v-Math.floor(v)})).sort((a,b)=>b.frac-a.frac);
 for(let k=0;k<rem&&k<order.length;k++)floor[order[k].i]++;
 const rows=cats.map((c,i)=>
   `<div class="eb-row"><span class="eb-dot" style="background:${col(i)}"></span>
     <span class="eb-cat">${c.cat}</span><span class="eb-pc num">${floor[i]}%</span><span class="eb-v num">${comma(c.v)}원</span></div>`).join('');
 const seg=cats.map((c,i)=>`<i style="width:${c.v/spent*100}%;background:${col(i)}"></i>`).join('');
 return `<div class="section-title">이번 달 지출 분석</div>
   <div class="card eb-card"><div class="eb-total"><span>총 지출</span><b class="num">${comma(spent)}원</b></div>
     <div class="eb-bar">${seg}</div><div class="eb-list">${rows}</div></div>`;
}

const RATE_TTL=10*60*1000;

function heldCurrencies(){return [...new Set(DB.assets.filter(a=>a.type==='fx'&&a.currency).map(a=>a.currency))]}

function inQuietWindow(d){ /* 토 06:00 ~ 월 08:00 휴장 */
 d=d||new Date();const day=d.getDay(),h=d.getHours();
 return (day===6&&h>=6)||day===0||(day===1&&h<8);
}

/* 환율 + 금 (한 번의 호출로 둘 다) */
async function fetchFxGold(){
 const curs=heldCurrencies(),gold=needGold();
 if(!curs.length&&!gold)return null;
 /* 브라우저에서 외부 시세 API를 직접 부르면 CORS로 막히므로 중계 함수를 경유합니다. */
 const qs=`cur=${curs.join(',')||'USD'}${gold?'&gold=1':''}`;
 const r=await fetch(`/.netlify/functions/rates?${qs}`);
 if(!r.ok)throw new Error('fx');
 const j=await r.json();
 const out={fx:{},goldPerG:0};
 Object.entries(j.fx||{}).forEach(([c,v])=>{if(v>0)out.fx[c]=v});
 if(gold&&j.goldPerG>0)out.goldPerG=j.goldPerG;
 if(!Object.keys(out.fx).length&&!out.goldPerG)throw new Error('fx empty');
 return out;
}
/* 주식 (국내 6자리 + 해외 티커, 서버가 알아서 처리 → 원화로 반환) */
async function fetchStocks(){
 const codes=heldStockCodes();
 if(!codes.length)return null;
 const r=await fetch(`/.netlify/functions/stock?codes=${codes.join(',')}`);
 if(!r.ok)throw new Error('stock');
 return await r.json();
}

let syncing=false;
async function syncRates(silent){
 if(syncing||!hasRateAssets())return;
 syncing=true;
 const btn=$('syncBtn');btn&&btn.classList.add('spin');

 const [fg,st]=await Promise.allSettled([fetchFxGold(),fetchStocks()]);
 const R=DB.rates;
 let ok=0,fail=0;

 if(fg.status==='fulfilled'){
  if(fg.value){
   Object.entries(fg.value.fx).forEach(([c,v])=>{R.fx[c]=c==='JPY'?Math.round(v*100)/100:Math.round(v*10)/10});
   if(fg.value.goldPerG)R.goldPerG=Math.round(fg.value.goldPerG);
   ok++;
  }
  R.fxFail=false;
 }else{R.fxFail=true;fail++}

 if(st.status==='fulfilled'){
  if(st.value){Object.entries(st.value).forEach(([code,p])=>{if(code!=='_debug'&&p>0)R.stocks[code]=p});ok++}
  R.stockFail=false;
 }else{R.stockFail=true;fail++}

 if(ok){R.syncedAt=Date.now();R.failStreak=0}else R.failStreak=(R.failStreak||0)+1;
 save();renderCurrent();
 syncing=false;btn&&btn.classList.remove('spin');
 if(!silent)toast(ok?(fail?'일부 시세만 반영했어요':'시세를 반영했어요'):'시세를 가져오지 못했어요');
}
function autoSyncRates(){

}
function fmtSynced(ts){
 const min=Math.floor((Date.now()-ts)/60000);
 if(min<1)return '방금 갱신';
 if(min<60)return min+'분 전 갱신';
 const d=new Date(ts);
 return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 갱신`;
}
function rateStatusText(){

 const base=fmtSynced(R.syncedAt);
 const stale=R.fxFail||R.stockFail||(R.failStreak||0)>0;
 if(stale)return base+' · <span style="color:var(--text-2)">최신 아님</span>'; /* 마지막 성공값 유지 + 차분한 안내 */

}

function wireNwCarousel(){

   updateNwDots(r);
   clearTimeout(t);
   t=setTimeout(()=>{
     const n=+c.dataset.n,loop=c.dataset.loop==='1';
     if(loop&&(p<=0||p>=n+1)){ /* 클론 → 진짜 카드로 조용히 점프 (같은 그림이라 안 보임) */

/* 삭제될 자산(들)을 참조하는 '활성' 반복거래를 찾는다 — id 하나 또는 Set<id> 둘 다 받는다.
   반복거래는 과거 기록이 아니라 계속 새 항목을 만들어내는 생성기라, 자산 삭제 후에도
   방치하면 존재하지 않는 계좌로 영원히 '발생'한다(잔액엔 영향 없지만 내역에 유령처럼 남음). */
function activeRecsForAssets(ids){
 const hit=ids&&ids.has?id=>ids.has(id):id=>id===ids;
 return DB.recurrences.filter(r=>r.active&&(hit(r.fromAssetId)||hit(r.toAssetId)));
}

/* 삭제됐던 동명·동종 자산의 과거 내역(스냅샷 이름으로 남은 것)을 자산에 재연결 */
function relinkDeletedAsset(d){
 const nm=d.name;
 (DB.txns||[]).forEach(t=>{
   if(t.fromAssetName===nm&&!DB.assets.some(a=>a.id===t.fromAssetId)){t.fromAssetId=d.id;delete t.fromAssetName;}
   if(t.toAssetName===nm&&!DB.assets.some(a=>a.id===t.toAssetId)){t.toAssetId=d.id;delete t.toAssetName;}
 });
 (DB.recurrences||[]).forEach(r=>{
   if(r.fromAssetName===nm&&!DB.assets.some(a=>a.id===r.fromAssetId)){r.fromAssetId=d.id;delete r.fromAssetName;}
   if(r.toAssetName===nm&&!DB.assets.some(a=>a.id===r.toAssetId)){r.toAssetId=d.id;delete r.toAssetName;}
 });
}
/* 재등록 연동 시 이전 잔액과의 차액을 오늘 날짜 조정 내역으로 기록 (자산에 태그) */
function addBalanceAdjust(asset,gap){
 if(!gap)return;
 const inc=gap>0; /* +면 입금(수입), -면 출금(지출) */
 DB.txns.push({id:uid(),date:TODAY,
   type:inc?'income':'expense',category:ADJUST_CAT,memo:'재등록 잔액 조정',
   amount:Math.abs(gap),
   fromAssetId:inc?null:asset.id, toAssetId:inc?asset.id:null,
   adjust:true, adjustAsset:asset.id});
}
/* 자산 금액을 수정하면, 연결된 조정 내역을 다시 계산해 맞춤 (없으면 새로, 0이면 삭제) */
function updateBalanceAdjust(asset,entered){
 let adj=(DB.txns||[]).find(t=>t.adjust&&t.adjustAsset===asset.id);
 if(adj)DB.txns=DB.txns.filter(t=>t!==adj); /* 잠시 제외하고 순수 잔액 계산 */
 const base=balanceAt(asset.id,TODAY);       /* 조정 제외한 현재 잔액 */
 const gap=Math.round(entered-base);
 if(gap!==0){
   const inc=gap>0;
   if(adj){adj.amount=Math.abs(gap);adj.type=inc?'income':'expense';
     adj.fromAssetId=inc?null:asset.id;adj.toAssetId=inc?asset.id:null;adj.date=adj.date||TODAY;DB.txns.push(adj);}
   else addBalanceAdjust(asset,gap);
 } /* gap==0이면 조정 내역 제거된 상태로 둠 */
}
/* 삭제된 동명 자산의 내역(스냅샷 이름)이 남아있는지 */
function deletedAssetHistoryExists(nm){
 const live=id=>DB.assets.some(a=>a.id===id);
 const inTx=(DB.txns||[]).some(t=>(t.fromAssetName===nm&&!live(t.fromAssetId))||(t.toAssetName===nm&&!live(t.toAssetId)));
 const inRec=(DB.recurrences||[]).some(r=>(r.fromAssetName===nm&&!live(r.fromAssetId))||(r.toAssetName===nm&&!live(r.toAssetId)));
 return inTx||inRec;
}
/* 삭제했던 동명 자산의 과거 내역과 연동할지 선택 */
function askRelinkDeleted(d,entered,balType,balKey){
 window._amLink=()=>{ /* 연동: 과거 내역 재연결 + 삭제 시점 잔액에서 이어감 + 갭은 조정 내역 */
   DB.assets.push(d);relinkDeletedAsset(d);
   if(balType){
     d[balKey]=0;if(balKey==='baseAmount')delete d.amountKRW;else delete d.baseAmount;
     const H=balanceAt(d.id,TODAY);            /* 재연결된 과거 내역만의 잔액(기준값 0) */
     const remembered=(DB.deletedBal&&DB.deletedBal[d.name]!=null)?DB.deletedBal[d.name]:H;
     d[balKey]=Math.round(remembered-H);       /* 삭제 시점 잔액에서 이어지도록 기준값 설정 */
     const gap=Math.round(entered-remembered); /* 기억한 잔액 대비 사용자가 입력한 차액 */
     if(gap!==0)addBalanceAdjust(d,gap);        /* 갭 있을 때만 오늘 조정 내역 */
   }
   if(d.type==='savings'&&d.maturityDate)clampRecurringToMaturity(d.id,d.maturityDate);
   save();closeSheet();renderCurrent();toast('이전 자산과 연동했어요');
 };
 window._amFresh=()=>{ /* 새로: 재연결 없이 별개 자산으로 */
   DB.assets.push(d);
   if(balType){const contrib=balanceAt(d.id,TODAY)-assetBase(d);d[balKey]=Math.round(entered-contrib);}
   if(d.type==='savings'&&d.maturityDate)clampRecurringToMaturity(d.id,d.maturityDate);
   save();closeSheet();renderCurrent();toast('자산을 등록했어요');
 };
 openSheet(`<h3>이전에 삭제한 자산이 있어요</h3>
   <div class="desc" style="margin-bottom:20px">예전에 '<b>${esc(d.name)}</b>' (${ASSET_TYPES[d.type].label}) 자산을 삭제한 기록이 있어요.<br>그때의 <b>과거 내역을 이 자산에 다시 연결</b>할까요?</div>
   <button class="btn btn-primary" style="width:100%;margin-bottom:9px" onclick="closeSheet();_amLink&&_amLink()">이전 자산과 연동</button>

   <button class="btn btn-soft cancel" style="width:100%" onclick="closeSheet()">취소</button>`);
}

function wireGroupDrag(){
 const listEl=$('dragList');if(!listEl)return;let dragEl=null;
 listEl.querySelectorAll('[data-drag]').forEach(h=>{
  h.addEventListener('pointerdown',e=>{
   e.preventDefault();dragEl=h.closest('.asset-item');dragEl.classList.add('dragging');
   const move=ev=>{
    const y=ev.clientY;const rows=[...listEl.querySelectorAll('.asset-item')];
    for(const r of rows){if(r===dragEl)continue;const rc=r.getBoundingClientRect();
     if(y>rc.top&&y<rc.bottom){listEl.insertBefore(dragEl,y<rc.top+rc.height/2?r:r.nextSibling);break;}}};
   const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
    dragEl&&dragEl.classList.remove('dragging');
    const visible=[...listEl.querySelectorAll('.asset-item')].map(r=>r.dataset.type);
    DB.settings.groupOrder=visible.concat(DB.settings.groupOrder.filter(t=>!visible.includes(t)));
    save();dragEl=null;};
   document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
  });
 });
}

function saveAsset(editing){
 if(twGuard())return;
 syncAssetInputs();const d=asDraft;
 d.name=d.name||ASSET_TYPES[d.type].label;
 if(d.type==='stock'&&d.stockCode&&!DB.rates.stocks[d.stockCode])DB.rates.stocks[d.stockCode]=0;
 const balTypes=['cash','savings','realestate','etc','pension','debt'];
 const balType=balTypes.includes(d.type);
 const balKey=(d.type==='cash'||d.type==='savings')?'baseAmount':'amountKRW';
 const entered=balType?(d._dispAmt!=null?d._dispAmt:(d[balKey]||0)):0; /* 사용자가 입력한 '현재 금액' */
 delete d._dispAmt;
 /* 표시 잔액이 입력값과 같도록 기준값 역산 (오늘까지의 순입출금 기여분 제외) */
 const setBase=(origBase)=>{if(!balType)return;invalidateBalances();
   const contrib=balanceAt(d.id,TODAY)-origBase; /* 오늘까지 순입출금(기준값 제외) */
   d[balKey]=Math.round(entered-contrib);if(balKey==='baseAmount')delete d.amountKRW;else delete d.baseAmount;};
 if(editing){
   const i=DB.assets.findIndex(a=>a.id===d.id);
   const origBase=assetBase(DB.assets[i]); /* 교체 전 원래 기준값 */
   const hasAdj=balType&&(DB.txns||[]).some(t=>t.adjust&&t.adjustAsset===d.id);
   if(hasAdj){ /* 조정 내역이 있는 자산: 기준값 유지, 조정 내역을 다시 계산 */
     d[balKey]=origBase;
     if(balKey==='baseAmount')delete d.amountKRW;else delete d.baseAmount;
     DB.assets[i]=d;
     updateBalanceAdjust(d,entered); /* 입력 금액에 맞춰 조정 내역 수정 */
   }else{
     d[balKey]=origBase; /* 원래 기준값 유지한 채 교체 */
     if(balKey==='baseAmount')delete d.amountKRW;else delete d.baseAmount;
     DB.assets[i]=d;
     setBase(origBase); /* 원래 기준으로 역산 → 표시 잔액=입력값 */
   }
 }else{
   const dup=DB.assets.find(a=>a.id!==d.id&&a.name===d.name&&a.type===d.type); /* 살아있는 동명·동종 */
   if(dup){toast('같은 이름·종류의 자산이 이미 있어요');return;} /* 중복 차단 */
   const hasDeleted=deletedAssetHistoryExists(d.name); /* 삭제된 동명 자산의 내역이 남아있나 */
   d.id=uid();d.order=DB.assets.length;
   if(balType){d[balKey]=entered;if(balKey==='baseAmount')delete d.amountKRW;else delete d.baseAmount;}
   if(hasDeleted){askRelinkDeleted(d,entered,balType,balKey);return;} /* 이전 자산과 연동할지 선택 */
   DB.assets.push(d); /* 새 자산은 내역이 없으므로 기준값=입력값 그대로 */
 }
 if(d.type==='savings'&&d.maturityDate)clampRecurringToMaturity(d.id,d.maturityDate); /* 만기 후 이체 방지 */
 save();closeSheet();renderCurrent();toast(editing?'자산을 수정했어요':'자산을 등록했어요');
}
/* 저축통장 만기일이 생기면, 그 통장으로 '입금'하는 반복의 종료일을 만기 직전 마지막 이체일로 맞춤.
   - 이미 종료일이 만기보다 이르면(더 빨리 끝나면) 그대로 둠(앞당기지 않음). 조용히 적용. */
function clampRecurringToMaturity(assetId,maturity){
 (DB.recurrences||[]).forEach(r=>{
   if(r.toAssetId!==assetId)return;                 /* 이 통장으로 들어오는 반복만 */
   if(r.startDate&&r.startDate>maturity)return;      /* 시작이 만기 이후면 대상 아님 */
   if(r.endDate&&r.endDate<=maturity)return;         /* 이미 만기 전에 끝나면 그대로 */
   const occ=recDates(r,r.startDate,maturity);       /* 만기일 이하의 실제 발생일들 */
   const last=occ.length?occ[occ.length-1]:null;     /* 만기 직전 마지막 이체일 */
   if(last){r.endDate=last;if(r.count)delete r.count;} /* 종료일 지정(횟수 조건은 해제) */
 });
}
function clrInput(id){const el=$(id);if(!el)return;el.value='';el.dispatchEvent(new Event('input',{bubbles:true}));el.focus();fcToggle(el);}
function fcToggle(el){const w=el.closest('.field-clear');if(w)w.classList.toggle('has-val',!!el.value)}
function fcWire(){document.querySelectorAll('.field-clear input').forEach(el=>{fcToggle(el);
  if(!el._fcw){el._fcw=1;const w=el.closest('.field-clear');
    el.addEventListener('input',()=>fcToggle(el));
    el.addEventListener('focus',()=>{if(w)w.classList.add('is-focus')});
    el.addEventListener('blur',()=>{if(w)setTimeout(()=>w.classList.remove('is-focus'),120)}); /* 탭 여유 */
  }});}
