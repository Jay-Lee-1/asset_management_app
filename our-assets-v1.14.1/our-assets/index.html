let _segPrev=null; /* 시트 재렌더 시에도 물방울이 이어서 미끄러지도록 이전 위치 기억 */
function moveSegBlobs(){
 document.querySelectorAll('.seg').forEach(seg=>{
  const blob=seg.querySelector('.seg-blob'),on=seg.querySelector('button.on');
  if(!blob)return;
  if(!on){blob.classList.remove('on');return}
  const target={x:on.offsetLeft,w:on.offsetWidth,h:on.offsetHeight};
  const from=_segPrev;
  /* 이전 위치에서 시작 → 새 위치로 한 번만 부드럽게 이동 */
  blob.style.transition='none';
  blob.style.height=target.h+'px';
  if(from&&from.w){blob.style.width=from.w+'px';blob.style.transform=`translateX(${from.x}px)`}
  else{blob.style.width=target.w+'px';blob.style.transform=`translateX(${target.x}px)`}
  blob.classList.add('on');
  blob.offsetHeight; /* reflow */
  blob.style.transition='';
  requestAnimationFrame(()=>{
   blob.style.width=target.w+'px';
   const t=`translateX(${target.x}px)`;
   blob.style.setProperty('--sbT',t);
   blob.style.transform=t;
  });
  _segPrev=target;
 });
}

 allTxns(st,en).forEach(t=>{
  if(t.fromAssetId!==assetId&&t.toAssetId!==assetId)return;
  days.add(t.date);
 });
 /* 날짜별로 balanceAt()과 동일한 규칙(balancesAtDates() 참고)을 따라야 미확인 이체 제외 규칙
    (예정 반영 여부에 따라 dateStr<=TODAY면 제외, 그 이후면 포함)과 부채 부호 반전이 그대로
    반영된다 — 예전처럼 거래별 증감을 직접 누적하면 이 규칙을 놓치고 미확인 이체가 무조건
    섞여 실제 잔액과 다른 값이 나왔다. 날짜가 여러 개(한 달치)라 balanceAt()을 날짜마다
    부르면 매번 전체 재스캔이 일어나던 것을 balancesAtDates()로 한 번에 계산한다. */
 const sortedDays=Array.from(days).sort();
 const balMap=balancesAtDates(sortedDays);
 let low=null,lowDate=st;
 sortedDays.forEach(d=>{
  const b=balanceAtFromMap(balMap,d,assetId);
  if(low===null||b<low){low=b;lowDate=d}
 });
 return {date:lowDate,amount:low};
}
function planBalInner(y,m,a,today){

 }

 return `<div class="k">${esc(a.name)} · ${m}월 말일 기준 잔액</div>

let _planLive=null,_planT=null,_planPeek=false;
function planBalCard(y,m,a,live){
 if(!a)return `<div class="balance-head mc-pane"><div class="k">${m}월 말일 기준 잔액</div><div class="v num">-</div></div>`;
 const bal=balanceAt(a.id,monthEndStr(y,m));
 if(!live)return `<div class="balance-head mc-pane ${bal<0?'neg':''}">${planBalInner(y,m,a,false)}</div>`;
 _planLive={y,m,a};
 return `<div class="balance-head mc-pane ${bal<0?'neg':''}" id="planBalLive" tabindex="0" role="button" aria-label="이번 달 말일 잔액, 엔터나 스페이스를 누르고 있으면 오늘까지 잔액 보기" onpointerdown="planPeekStart()" onpointermove="planPeekMove()" onpointerup="planPeekEnd()" onpointercancel="planPeekEnd()" onpointerleave="planPeekEnd()" onkeydown="planPeekKey(event)" onkeyup="planPeekEnd()" onblur="planPeekEnd()">${planBalInner(y,m,a,false)}</div>`;
}
function planPeekStart(){clearTimeout(_planT);_planT=setTimeout(()=>{_planPeek=true;setPlanMode(true);if(navigator.vibrate)navigator.vibrate(8)},180)}
function planPeekMove(){if(!_planPeek)clearTimeout(_planT)}
function planPeekEnd(){clearTimeout(_planT);if(_planPeek){_planPeek=false;setPlanMode(false)}}
/* sujiPeekKey(3683행 부근)와 동일한 원칙 — planBalInner 안의 "가장 낮을 때"(.bh-low) 버튼에서
 * 버블된 keydown은 e.target!==e.currentTarget으로 걸러 preventDefault가 그 버튼의 네이티브
 * Enter/Space 클릭까지 막지 않게 한다. */
function planPeekKey(e){
 if(e.target!==e.currentTarget)return;
 if(e.key==='Escape'){planPeekEnd();return}
 if(e.key!=='Enter'&&e.key!==' ')return;
 e.preventDefault();
 if(e.repeat)return;
 planPeekStart();
}
function setPlanMode(today){const c=$('planBalLive');if(!c||!_planLive)return;const L=_planLive;

 const target=el||[...page.querySelectorAll('.plan-day')].find(d=>d.dataset.d===date);

  target.classList.add('flash');setTimeout(()=>target.classList.remove('flash'),1200);
 }

function planRowsHTML(a,y,m){
 if(!a)return '';
 const mStart=monthStartStr(y,m),mEnd=monthEndStr(y,m);
 const flows=[];
 allTxns(mStart,mEnd).forEach(t=>{
  if(t.fromAssetId!==a.id&&t.toAssetId!==a.id)return;
  const delta=(t.toAssetId===a.id?t.amount:0)-(t.fromAssetId===a.id?t.amount:0);
  flows.push({t,delta});
 });
 flows.sort((x,z)=>x.t.date<z.t.date?-1:x.t.date>z.t.date?1:0);
 const dates=[...new Set(flows.map(f=>f.t.date))];
 if(y===TM.y&&m===TM.m&&!dates.includes(TODAY))dates.push(TODAY);
 dates.sort();
 /* 표시 잔액은 거래별 증감을 직접 누적하지 않고 날짜별 balanceAt()과 동일한 규칙으로 구한다 —
    lowestInMonth()와 같은 이유(3883줄 주석 참고): 직접 누적하면 balancesUpTo()가 이미 적용
    중인 미확인 이체 제외 규칙(dateStr<=TODAY면 제외, 그 이후는 예정으로 포함)을 놓쳐,
    이체 확인 기능을 켠 상태에서 미확인 이체가 있으면 이 날짜별 잔액이 월말/오늘까지 잔액
    카드(planBalInner)나 '가장 낮을 때' 카드(lowestInMonth)와 서로 다른 값을 보여줬다.
    날짜가 여러 개(한 달치)라 balanceAt()을 날짜마다 부르면 매번 전체 재스캔이 일어나던
    것을 balancesAtDates()로 한 번에 계산한다(lowestInMonth와 동일한 이유). */
 const balMap=balancesAtDates(dates);
 const dayBal=dates.map(d=>balanceAtFromMap(balMap,d,a.id));
 let firstNegIdx=-1; /* 잔액이 처음 마이너스가 되는 날 인덱스 */
 const dayNeg=dayBal.map((b,i)=>{const neg=b<0;if(neg&&firstNegIdx<0)firstNegIdx=i;return neg;}); /* 날짜별 실제 잔액 마이너스 여부 */
 return dates.length?dates.map((d,i)=>{
  const dayFlows=flows.filter(f=>f.t.date===d);
  const bal=dayBal[i];
  const isToday=d===TODAY;
  const zone=dayNeg[i]?(i===firstNegIdx?'danger danger-start':'danger'):''; /* 실제 마이너스인 날만 빨강 */
  const items=dayFlows.length?dayFlows.map(f=>{const t=f.t;
   const faN=assetNm(t.fromAssetId,t.fromAssetName),taN=assetNm(t.toAssetId,t.toAssetName);
   const flow=t.type==='income'?(taN!=='—'?taN:''):(t.type==='transfer'||t.type==='saving')?`${faN==='—'?'':faN}→${taN==='—'?'':taN}`:(faN!=='—'?faN:'');
   return `<div class="flow-item" tabindex="0" role="button" aria-label="${esc(t.memo||txCatLabel(t))} ${f.delta>=0?'+':'-'}${comma(Math.abs(f.delta))}원" onclick="planTap('${t.isRec?'':t.id}','${t.isRec?t.recId:''}','${t.date}')" onkeydown="rowKeydown(event,()=>planTap('${t.isRec?'':t.id}','${t.isRec?t.recId:''}','${t.date}'))">
    <div class="avatar ${f.delta>=0?'a-in':'a-food'}" style="width:40px;height:40px">${svg(f.delta>=0?'arrowUp':'arrowDn')}</div>
    <div style="flex:1;min-width:0"><div class="nm-row"><span class="nm">${esc(t.memo||txCatLabel(t))}</span>${t.isRec?`<span class="rec-ic" title="반복">${svg('repeat')}</span>`:''}</div>${flow?`<div class="flow-sub"><span class="fl">${esc(flow)}</span></div>`:''}</div>
    <div class="rt"><div class="delta num ${f.delta>=0?'pos':'minus'}">${f.delta>=0?'+':'-'}${comma(Math.abs(f.delta))}원</div></div></div>`;
  }).join(''):`<div class="plan-noflow">오늘은 통장이 평화로워요 🌱</div>`;
  return `<div class="plan-day${isToday?' today':''} ${zone}" data-d="${d}"><div class="card plan-card${bal<0?' neg':''}"><div class="plan-day-head${bal<0?' neg':''}">
    <div class="pd-date">${shortDate(d)}${isToday?' <span class="pd-today">오늘</span>':''}${isFuture(d)?' <span class="mini sch">예정</span>':''}${bal<0?` <span class="pd-bell">${svg('bell')}</span>`:''}</div>
    <div class="pd-bal num ${bal<0?'minus':''}"><span class="pl">잔액</span>${comma(bal)}원</div></div>${items}</div></div>`;
 }).join(''):`<div class="empty"><div class="ei">${svg('ledger')}</div><div class="et">${m}월은 통장이 평화로워요</div><div class="es">예정된 이체도, 나갈 돈도 없어요</div></div>`;
}

function spendByCategory(y,m,owner='전체'){ /* 지출 분석은 항상 예정 포함. owner를 주면 그 귀속(fromAssetId 기준)의 지출만 집계 — 예산(budgetHistory)은 귀속과 무관하게 전역이라 필터하지 않는다 */
 const map={};
 filterTxnsByOwner(allTxns(monthStartStr(y,m),monthEndStr(y,m)),DB.assets,owner).forEach(t=>{
   if(t.type!=='expense')return;if(t.adjust&&!t.inSurplus)return; /* 잔액 조정: 항목별 포함 설정(기본 제외) */
   splitLines(t).forEach(s=>{map[s.category]=(map[s.category]||0)+s.amount}); /* 분할 거래(t.splits)는 각 항목을 자기 카테고리로 따로 집계(app-evolve cycle198 advance) */
 });
 if(DB.budgetHistory)Object.keys(DB.budgetHistory).forEach(c=>{if(!(c in map)&&budgetForMonth(c,y,m))map[c]=0}); /* 이번 달에 쓴 게 없어도 이번 달 기준 예산이 있는 카테고리는 계속 조회/수정/삭제할 수 있게 노출 */
 return Object.entries(map).map(([c,v])=>({c,v})).sort((a,b)=>b.v-a.v);
}
/* 카테고리별 최근 n개월(기본 3, 이번 달 제외) 지출 평균/지난달 지출 대비 이번 달 지출 증감 — spendByCategory를
 * 그대로 재사용해 카테고리 합산 규칙(잔액 조정 제외 등)을 공유한다. 최근 n개월치가 전부 0(비교 기준 없음)이면
 * deltaPct는 null이라 호출부에서 배지를 숨긴다. owner를 주면 avg/cur 모두 같은 귀속 기준으로 비교한다
 * (호출부가 이미 귀속으로 필터된 cur를 보여주면서 avg만 가구 전체 기준이면 서로 다른 모수를 비교하게 됨). */
function spendTrend(c,y,m,n=3,owner='전체'){
 let py=y,pm=m,total=0,prevMonth=0;
 for(let i=0;i<n;i++){
  pm--;if(pm<1){pm=12;py--}
  const v=(spendByCategory(py,pm,owner).find(r=>r.c===c)||{v:0}).v;
  total+=v;
  if(i===0)prevMonth=v;
 }
 const avg=Math.round(total/n);
 const cur=(spendByCategory(y,m,owner).find(r=>r.c===c)||{v:0}).v;
 const deltaPct=avg?Math.round((cur-avg)/avg*100):null;
 return{avg,prevMonth,deltaPct};
}
/* 예산은 '카테고리→금액' 단일값이 아니라 '카테고리→[{from:"YYYY-MM",amount}]' 시점별 이력이다(오름차순 유지) —
 * saveBudget()이 그 자리에서 덮어쓰면 과거 달의 초과/이내 판정까지 조용히 소급 변경되던 버그를 막기 위함.
 * budgetForMonth는 대상 달(y,m) 이전(from<=대상)에 적용된 이력 중 가장 최근 값을 찾고, 없으면 0(미설정)을 반환한다. */
function budgetForMonth(c,y,m){
 const h=DB.budgetHistory&&DB.budgetHistory[c];
 if(!h||!h.length)return 0;
 const key=budgetKey(y,m);
 let v=0;
 for(let i=0;i<h.length;i++){if(h[i].from<=key)v=h[i].amount;else break}
 return v;
}
/* 대상 달(y,m)부터 적용되는 예산을 이력에 기록 — 같은 달에 이미 항목이 있으면 덮어쓰고, 없으면 from 오름차순을 유지하며 삽입 */
function setBudgetFrom(c,y,m,amount){
 DB.budgetHistory=DB.budgetHistory||{};
 const h=DB.budgetHistory[c]=DB.budgetHistory[c]||[];
 const key=budgetKey(y,m);
 const idx=h.findIndex(e=>e.from===key);
 if(idx>=0)h[idx].amount=amount;
 else{h.push({from:key,amount});h.sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0)}
}
/* 카테고리별 예산 이월(catBudgetRollover) 토글이 켜져 있으면 전달의 "실질" 한도(flat+그 전달의
 * 이월, budgetForMonthWithCarry) 중 안 쓰고 남은 만큼(logic.js budgetCarry, 초과분은 0으로 clamp)을
 * 이번 달에 얹는다(app-evolve cycle194 critique/advance, cycle196 critique/advance 버그 수정) —
 * 전달 한도를 flat(budgetForMonth)으로만 보면 "1개월차에 이월이 생겼는데 2개월차에 flat~실질 한도
 * 사이로 썼을 때" 이월이 0으로 끊기는 버그가 있었다(실질 한도 안에서 썼으니 사용자 입장엔 '아낀
 * 돈'인데 flat 기준으로는 '초과'로 보여 다음 이월이 사라짐). 전달 실질 한도를 다시 구하려면 그
 * 전달 이월(budgetCarryFor 재귀 호출)이 필요해 자연스럽게 연속 이월 체인이 된다 — depth로 재귀
 * 깊이를 24개월로 cap해(토글을 몇 년씩 켜둔 카테고리에서 매 조회마다 재귀가 무한정 깊어지는 것을
 * 방지) 그 이상 과거는 이월 없음(0)으로 본다. 예산은 귀속과 무관하게 전역이므로(budgetForMonth와
 * 동일한 관례) spendByCategory도 항상 '전체' 기준으로 조회 — 현재 보고 있는 ST.spendOwner 필터와
 * 무관하게 전달 지출 전체를 봐야 이월 계산이 맞다. */
function budgetCarryFor(c,y,m,depth=0){
 if(!isBudgetRolloverCat(c))return 0;
 if(depth>=24)return 0;
 let py=y,pm=m-1;if(pm<1){pm=12;py--}
 const prevBudget=budgetForMonthWithCarry(c,py,pm,depth+1);
 if(!prevBudget)return 0;
 const prevSpent=spendByCategory(py,pm,'전체').find(x=>x.c===c);
 return budgetCarry(prevBudget,prevSpent?prevSpent.v:0);
}
/* budgetForMonth()에 이월분을 더한 "이번 달에 실제로 쓸 수 있는 한도" — budgetForMonthEffective가
 * 이번 달 자체에 flat 예산이 없으면(0/미설정) 이월이 있어도 0을 그대로 돌려주므로(logic.js 주석
 * 참고), 기존 budgetForMonth()의 "falsy=미설정" 호출부 관례를 그대로 유지한다. depth는
 * budgetCarryFor의 재귀 체인을 위한 내부용 인자로, 바깥 호출부는 그냥 생략하면 된다. */
function budgetForMonthWithCarry(c,y,m,depth=0){
 return budgetForMonthEffective(budgetForMonth(c,y,m),budgetCarryFor(c,y,m,depth));
}
/* 예산이 설정된 카테고리만 골라 해당 달(y,m) 기준 전체 예산 대비 지출을 집계 — 예산이 하나도 없으면 budgetedTotal=0으로 '집계할 게 없음'을 나타낸다.
 * budgetedTotal/overCount는 이월이 적용된 실질 한도(budgetForMonthWithCarry) 기준이고, carryTotal은
 * 그중 이월로 얹힌 금액만 따로 합산해 openSpendAnalysis()의 '전달 이월 N원 포함' 캡션에 쓴다. */
function totalBudgetSummary(rows,y,m){
 let budgetedTotal=0,spentOnBudgeted=0,overCount=0,unsetCount=0,carryTotal=0;
 rows.forEach(r=>{
  const carry=budgetCarryFor(r.c,y,m);
  const b=budgetForMonthEffective(budgetForMonth(r.c,y,m),carry);
  if(b){budgetedTotal+=b;spentOnBudgeted+=r.v;if(r.v>b)overCount++;carryTotal+=carry}
  else unsetCount++;
 });
 return{budgetedTotal,spentOnBudgeted,overCount,unsetCount,carryTotal};
}
/* deltaPct(null=비교 기준 없음)를 화살표+퍼센트 배지로 렌더 — 지출이 늘면(양수) expense색, 줄면(음수) income색(가계부의 기존 관례, assetGainLossBadge와 동일) */
function spendTrendBadge(deltaPct,label){
 if(deltaPct===null)return '';
 const up=deltaPct>0,flat=deltaPct===0;
 const color=flat?'var(--text-3)':`var(--${up?'expense':'income'})`;
 const arrow=flat?'':(up?'▲':'▼');
 return `<span class="trend" style="color:${color}">${label||''}${arrow}${Math.abs(deltaPct)}%</span>`;
}
/* spendByCategory/spendTrend과 대칭되는 수입 쪽 집계 — 예산(budgetHistory)은 지출에만 있는 개념이라
 * 그 유니온 스텝(spendByCategory의 budgetHistory 보강 부분)만 빼고, 나머지(잔액 조정 inSurplus 처리,
 * 분할 거래 항목별 집계, owner 필터)는 동일한 규칙을 그대로 따른다. */
function incomeByCategory(y,m,owner='전체'){
 const map={};
 filterTxnsByOwner(allTxns(monthStartStr(y,m),monthEndStr(y,m)),DB.assets,owner).forEach(t=>{
   if(t.type!=='income')return;if(t.adjust&&!t.inSurplus)return;
   splitLines(t).forEach(s=>{map[s.category]=(map[s.category]||0)+s.amount});
 });
 return Object.entries(map).map(([c,v])=>({c,v})).sort((a,b)=>b.v-a.v);
}
function incomeTrend(c,y,m,n=3,owner='전체'){
 let py=y,pm=m,total=0,prevMonth=0;
 for(let i=0;i<n;i++){
  pm--;if(pm<1){pm=12;py--}
  const v=(incomeByCategory(py,pm,owner).find(r=>r.c===c)||{v:0}).v;
  total+=v;
  if(i===0)prevMonth=v;
 }
 const avg=Math.round(total/n);
 const cur=(incomeByCategory(y,m,owner).find(r=>r.c===c)||{v:0}).v;
 const deltaPct=avg?Math.round((cur-avg)/avg*100):null;
 return{avg,prevMonth,deltaPct};
}
/* spendTrendBadge와 색 의미가 반대다 — 지출은 늘면 나쁨(expense색)이지만 수입은 늘면 좋음(income색):
 * up(양수)이면 income색 위쪽 화살표, 아니면 expense색 아래쪽 화살표. */
function incomeTrendBadge(deltaPct,label){
 if(deltaPct===null)return '';
 const up=deltaPct>0,flat=deltaPct===0;
 const color=flat?'var(--text-3)':`var(--${up?'income':'expense'})`;
 const arrow=flat?'':(up?'▲':'▼');
 return `<span class="trend" style="color:${color}">${label||''}${arrow}${Math.abs(deltaPct)}%</span>`;
}
/* spendByCategory/incomeByCategory와 동일한 owner·inSurplus·분할거래 집계 규칙을 한 해(1/1~12/31)
 * 전체로 확장 — 예산(budgetHistory)은 월 단위 개념이라 spendByCategory의 유니온 스텝만 뺀다. */
function yearSpendByCategory(y,owner='전체'){
 const map={};
 filterTxnsByOwner(allTxns(`${y}-01-01`,`${y}-12-31`),DB.assets,owner).forEach(t=>{
   if(t.type!=='expense')return;if(t.adjust&&!t.inSurplus)return;
   splitLines(t).forEach(s=>{map[s.category]=(map[s.category]||0)+s.amount});
 });
 return Object.entries(map).map(([c,v])=>({c,v})).sort((a,b)=>b.v-a.v);
}
function yearIncomeByCategory(y,owner='전체'){
 const map={};
 filterTxnsByOwner(allTxns(`${y}-01-01`,`${y}-12-31`),DB.assets,owner).forEach(t=>{
   if(t.type!=='income')return;if(t.adjust&&!t.inSurplus)return;
   splitLines(t).forEach(s=>{map[s.category]=(map[s.category]||0)+s.amount});
 });
 return Object.entries(map).map(([c,v])=>({c,v})).sort((a,b)=>b.v-a.v);
}
/* 1~12월 각각의 총수입/총지출 — spendByCategory/incomeByCategory를 달마다 호출해 합산하는
 * 기존 트렌드 함수들과 동일한 월 순회 방식. 카테고리 구분 없이 월 합계만 필요해 각 달의 rows를
 * reduce로 더한다. */
function yearMonthlyNet(y,owner='전체'){
 const out=[];
 for(let m=1;m<=12;m++){
  const income=incomeByCategory(y,m,owner).reduce((s,r)=>s+r.v,0);
  const expense=spendByCategory(y,m,owner).reduce((s,r)=>s+r.v,0);
  out.push({m,income,expense});
 }
 return out;
}
/* 저축률=(수입-지출)/수입*100. 수입이 0 이하면 비교 기준이 없어 null(spendTrend 등의 null-safe
 * 관례와 동일 — 호출부가 배지/카드를 숨긴다). 지출이 수입보다 많으면 음수 저축률도 그대로 둔다. */
function savingsRate(income,expense){
 if(income<=0)return null;
 return Math.round((income-expense)/income*100);
}
/* 연간 결산(openYearReview) 요약 — 총수입/총지출/순저축액/저축률과 전년(y-1) 대비 YoY delta,
 * 지출·수입 카테고리 TOP3(buildExpenseBarHtml로 스택바 렌더)까지 한 번에 묶는다. yoy.income/expense는
 * 전년 수입/지출이 0이면(비교 기준 없음) null, yoy.rate는 올해·전년 저축률 중 하나라도 null이면
 * null — 포인트 차이(%p)로 둬서 저축률(이미 퍼센트)끼리의 비율 변화가 아니라 단순 증감만 보여준다. */
function yearSummary(y,owner='전체'){
 const expRows=yearSpendByCategory(y,owner),incRows=yearIncomeByCategory(y,owner);
 const expense=expRows.reduce((s,r)=>s+r.v,0),income=incRows.reduce((s,r)=>s+r.v,0);
 const net=income-expense,rate=savingsRate(income,expense);
 const pyExpRows=yearSpendByCategory(y-1,owner),pyIncRows=yearIncomeByCategory(y-1,owner);
 const pyExpense=pyExpRows.reduce((s,r)=>s+r.v,0),pyIncome=pyIncRows.reduce((s,r)=>s+r.v,0);
 const pyRate=savingsRate(pyIncome,pyExpense);
 const yoy={
  income:pyIncome?Math.round((income-pyIncome)/pyIncome*100):null,
  expense:pyExpense?Math.round((expense-pyExpense)/pyExpense*100):null,
  rate:(rate===null||pyRate===null)?null:rate-pyRate,
 };
 return{y,income,expense,net,savingsRate:rate,topExpenseCats:expRows.slice(0,3),topIncomeCats:incRows.slice(0,3),monthly:yearMonthlyNet(y,owner),yoy};
}
/* 연간 결산 시트 — 연도 전환(◀/▶), 총수입/총지출/순저축액/저축률 4칸 요약(전년대비 배지),
 * 지출·수입 카테고리 TOP3 스택바(buildExpenseBarHtml 재사용). 해당 연도에 거래가 전혀 없으면
 * (수입·지출 모두 0) 빈 상태만 보여주고 요약·TOP3는 그리지 않는다(openSpendAnalysis의 empty 패턴). */
function yearOwnerSel(i){const list=['전체',...DB.owners];ST.spendOwner=list[i]||'전체';openYearReview(ST.yearReview.y);}
function openYearReview(y){
 y=y||ST.yearReview.y||TM.y;ST.yearReview.y=y;
 if(ST.spendOwner!=='전체'&&!DB.owners.includes(ST.spendOwner))ST.spendOwner='전체'; /* 귀속 사라지면 전체로 (openSpendAnalysis/openIncomeAnalysis와 동일 가드) */
 const switcher=`<div class="card" style="display:flex;align-items:center;justify-content:center;gap:18px;padding:10px;margin-bottom:12px">
   <button type="button" class="act-btn" aria-label="${y-1}년 보기" onclick="openYearReview(${y-1})">${svg('chevL')}</button>
   <span style="font-weight:700;font-size:16px">${y}년</span>
   <button type="button" class="act-btn" aria-label="${y+1}년 보기" onclick="openYearReview(${y+1})">${svg('chevR')}</button>
 </div>`;
 const ownerSeg=DB.owners.length?`<div class="seg" role="group" aria-label="귀속 선택"><div class="seg-blob"></div>${['전체',...DB.owners].map((o,oi)=>`<button class="${ST.spendOwner===o?'on':''}" aria-pressed="${ST.spendOwner===o}" onclick="yearOwnerSel(${oi})">${esc(o)}</button>`).join('')}</div>`:'';
 const s=yearSummary(y,ST.spendOwner);
 if(!s.income&&!s.expense){
  openSheet(`<h3>연간 결산</h3>${switcher}${ownerSeg}
   <div class="empty"><div class="ei">${svg('calendar')}</div><div class="et">아직 ${y}년 기록이 없어요</div><div class="es">거래가 쌓이면 연간 결산을 볼 수 있어요</div></div>
   <div style="height:12px"></div><button class="btn btn-soft" onclick="closeSheet()">닫기</button>`);
  return;
 }
 const incBadge=s.yoy.income!==null?incomeTrendBadge(s.yoy.income,'전년대비 '):'';
 const expBadge=s.yoy.expense!==null?spendTrendBadge(s.yoy.expense,'전년대비 '):'';
 const rateBadge=s.yoy.rate!==null?incomeTrendBadge(s.yoy.rate,'전년대비 '):'';
 /* 월별 흐름: yearSummary가 이미 계산해 돌려주던 s.monthly(yearMonthlyNet)가 이 화면 어디에서도
  * 쓰이지 않고 버려지고 있었다(app-evolve cycle250 develop) — 총계·TOP3 카테고리만 보여줘서는
  * "몇 월에 유독 많이 썼는지"를 알 방법이 없었다. spend-row/spend-track(openSpendAnalysis와 동일
  * 마크업)을 재사용해 월별 수입/지출 바를 그린다 — 최댓값(maxMo) 대비 비율로 폭을 정해 12개 달이
  * 서로 비교 가능하게 하고, 숫자 자체는 항상 텍스트로 노출돼 있어(장식 바와 달리) 별도 접근성
  * 보강이 필요 없다. */
 const maxMo=Math.max(1,...s.monthly.flatMap(mo=>[mo.income,mo.expense]));
 const moRows=s.monthly.map(mo=>`<div class="spend-row" style="cursor:default">
   <div class="spend-mid"><div class="spend-nm">${mo.m}월</div>

    <div class="spend-track" style="margin-top:4px"><i style="width:${mo.expense/maxMo*100}%"></i></div>
   </div>
   <div class="spend-amt"><div class="a num plus">${comma(mo.income)}원</div><div class="a num minus" style="margin-top:2px">${comma(mo.expense)}원</div></div></div>`).join('');
 openSheet(`<h3>연간 결산</h3><div class="desc">${y}년 한 해를 돌아봐요</div>
  ${switcher}${ownerSeg}
  <div class="card" style="padding:16px 14px;margin-bottom:12px">
   <div class="hrt-grid">
    <div class="hrt-c"><span class="k">총수입</span><span class="v plus num">${comma(s.income)}원</span>${incBadge}</div>
    <div class="hrt-c"><span class="k">총지출</span><span class="v minus num">${comma(s.expense)}원</span>${expBadge}</div>
    <div class="hrt-c"><span class="k">순저축액</span><span class="v save num">${comma(s.net)}원</span></div>
    <div class="hrt-c"><span class="k">저축률</span><span class="v num">${s.savingsRate===null?'—':s.savingsRate+'%'}</span>${rateBadge}</div>
   </div>
  </div>
  <div class="card" style="padding:2px 14px;margin-bottom:12px"><div class="section-title" style="margin-top:0">월별 흐름</div>${moRows}</div>
  ${s.expense?`<div class="card" style="margin-bottom:12px"><div class="section-title" style="margin-top:0">지출 TOP3</div><div aria-hidden="true">${buildExpenseBarHtml(s.topExpenseCats.map(r=>({cat:r.c,v:r.v})))}</div></div>`:''}
  ${s.income?`<div class="card" style="margin-bottom:12px"><div class="section-title" style="margin-top:0">수입 TOP3</div><div aria-hidden="true">${buildExpenseBarHtml(s.topIncomeCats.map(r=>({cat:r.c,v:r.v})))}</div></div>`:''}
  <div style="height:12px"></div><button class="btn btn-soft" onclick="closeSheet()">닫기</button>`);
}
function openSpendAnalysis(){
 if(ST.spendOwner!=='전체'&&!DB.owners.includes(ST.spendOwner))ST.spendOwner='전체'; /* 귀속 사라지면 전체로 (renderAssets/renderPlan과 동일 패턴) */
 const y=ST.ledger.y,m=ST.ledger.m;const rows=spendByCategory(y,m,ST.spendOwner);const total=rows.reduce((s,r)=>s+r.v,0);

 let py=y,pm=m,totalAvg=0;for(let i=0;i<3;i++){pm--;if(pm<1){pm=12;py--}totalAvg+=spendByCategory(py,pm,ST.spendOwner).reduce((s,r)=>s+r.v,0)}
 totalAvg=Math.round(totalAvg/3);
 const totalDeltaPct=totalAvg?Math.round((total-totalAvg)/totalAvg*100):null;
 /* totalBudgetSummary()가 집계하는 overCount(개별 카테고리별 예산 초과 수)를 이 요약 카드가
  * 지금까지 전혀 보여주지 않고 있었다(app-evolve cycle194 develop) — tbp.over는 전체 합계
  * 기준이라, 한 카테고리가 크게 초과해도 다른 카테고리가 그만큼 덜 써서 합계가 예산 이내면
  * 전체 바는 초록(미초과)으로만 보이고, 어떤 카테고리가 초과했는지는 아래 카테고리별 행을
  * 하나하나 스크롤해 빨간 표시(overCls)를 찾아야만 알 수 있었다. unsetCount(예산 미설정
  * 카테고리 수)는 이미 같은 자리에 캡션으로 노출하면서 짝이 되는 overCount만 빠져 있던
  * 비대칭을 해소한다. carryTotal(이월로 얹힌 금액 합)은 cycle194 advance가 추가한 예산

function doMaturity(id){if(twGuard())return;const a=DB.assets.find(x=>x.id===id);const target=DB.assets.find(x=>x.id===a.maturityTargetId);

 if(target.id===a.id){toast('자기 자신으로는 이체할 수 없어요. 이체할 통장을 다시 선택해주세요');return}
 let date=a.maturityDate<=TODAY?a.maturityDate:TODAY;
 /* 레거시 백업/오입력으로 만기일이 RANGE_FROM 이전이면 거래가 allTxns(RANGE_FROM,RANGE_TO) 조회

function delCat(k,i){const c=DB.categories[k][i];

 const msg=`'${esc(c)}' 카테고리를 삭제할까요? 기존 내역의 카테고리명은 그대로 남아요.`+(recs.length?` 연결된 반복거래 ${recs.length}개도 함께 비활성화돼요.`:'');

function doDeleteCat(k,i){const c=DB.categories[k][i];
 if(k==='income'&&c===ADJUST_CAT){toast('자동으로 생성되는 카테고리라 삭제할 수 없어요');return}
 if(DB.categories[k].length<=1){toast('카테고리는 최소 1개가 필요해요');return} /* 마지막 카테고리 삭제 방지 (delOwner와 동일 패턴): 비면 openTxSheet/saveTx가 undefined 카테고리로 거래를 만들 수 있음 */
 DB.catIcon=DB.catIcon||{};DB.catVar=DB.catVar||{};DB.budgetHistory=DB.budgetHistory||{};DB.catBudgetRollover=DB.catBudgetRollover||{};
 const recs=activeRecsForCat(k,c);
 const icon=DB.catIcon[catKey(k,c)];const wasVar=isVarCat(k,c);
 const hadBudget=k==='expense'&&DB.budgetHistory&&c in DB.budgetHistory;const budgetVal=hadBudget?DB.budgetHistory[c]:undefined;
 const wasRollover=k==='expense'&&isBudgetRolloverCat(c); /* catVar와 동일하게 삭제·되돌리기에서 함께 이동시켜야 유령으로 남거나 끊기지 않음(app-evolve cycle194 advance) */
 recs.forEach(r=>{r.active=false});
 DB.categories[k].splice(i,1);
 delete DB.catIcon[catKey(k,c)];              /* 삭제 시 아이콘/변동/예산/이월설정도 함께 정리 (동명 카테고리 재생성 시 이전 설정이 남지 않도록) */
 delete DB.catVar[catKey(k,c)];
 if(hadBudget)delete DB.budgetHistory[c];
 if(k==='expense')delete DB.catBudgetRollover[catKey('expense',c)];
 DB.deletedIds=DB.deletedIds||{};DB.deletedIds[catTombKey(k,c)]=Date.now(); /* delOwner와 동일한 톰스톤 — 없으면 mergeRemoteDataIntoLocal이 이 삭제를 모르고 아직 안 지운 기기의 사본을 되살림(app-evolve cycle179) */
 touchSave(...recs);renderCurrent();openCatManage(k);
 undoToast(`'${c}' 카테고리를 삭제했어요`+(recs.length?` · 반복거래 ${recs.length}개 비활성화`:''),()=>{
  DB.categories[k].splice(i,0,c);

  if(wasVar)DB.catVar[catKey(k,c)]=true;
  if(hadBudget){DB.budgetHistory=DB.budgetHistory||{};DB.budgetHistory[c]=budgetVal}
  if(wasRollover)DB.catBudgetRollover[catKey('expense',c)]=true;

 const avCls=k==='income'?'a-in':k==='saving'?'a-save':'a-food';
 openSheet(`<h3>카테고리 수정</h3><div class="desc">아이콘과 이름을 바꿀 수 있어요. 이 카테고리로 저장된 기존 내역도 함께 반영돼요.</div>

function doRenameCat(k,i){const v=((catRenameDraft.name!=null?catRenameDraft.name:($('renameCat')&&$('renameCat').value))||'').trim().normalize('NFC');if(!v){toast('이름을 입력해 주세요');return}
 const old=DB.categories[k][i];
 if(k==='income'&&old===ADJUST_CAT){toast('자동으로 생성되는 카테고리라 이름을 바꿀 수 없어요');return}
 if(v!==old){const dup=DB.categories[k].find(c=>c!==old&&normName(c)===normName(v));if(dup){toast(dup===v?'이미 있는 카테고리예요':`비슷한 카테고리가 있어요: ${dup}`);return}}
 DB.catIcon=DB.catIcon||{};DB.catVar=DB.catVar||{};DB.budgetHistory=DB.budgetHistory||{};DB.catBudgetRollover=DB.catBudgetRollover||{};
 const ic=catRenameDraft.icon||'';
 const wasVar=isVarCat(k,old);
 const wasRollover=k==='expense'&&isBudgetRolloverCat(old); /* 이름 변경 시 예산 이월 설정도 catVar와 동일하게 이동(app-evolve cycle194 advance) */

 if(wasVar)DB.catVar[catKey(k,v)]=true;
 if(k==='expense'){delete DB.catBudgetRollover[catKey('expense',old)];if(wasRollover)DB.catBudgetRollover[catKey('expense',v)]=true}
 if(v!==old){

   if(t.type!==k)return;

  DB.deletedIds=DB.deletedIds||{};DB.deletedIds[catTombKey(k,old)]=Date.now();delete DB.deletedIds[catTombKey(k,v)]; /* old 이름도 doDeleteCat처럼 톰스톤해야 함 — 안 그러면 mergeNameListWithTombstones가 old를 '살아있다'고 보고 아직 이 이름변경을 모르는 다른 기기의 사본이 old를 되살림(app-evolve cycle180). v가 과거에 삭제됐던 이름이면 그 톰스톤은 지워 되살림을 허용 */
  if(ST.hist&&ST.hist.catExact===old&&(ST.hist.catExactType||'expense')===k)ST.hist.catExact=v; /* 전체내역 탭의 분석화면 카테고리 드릴다운 필터(ST.hist.catExact, openCatHistory/openIncomeCatHistory가 세팅하고 ST.hist.catExactType으로 유형을 구분·필터 자체는 filteredHist의 (H.catExactType||'expense') 규칙과 동일)가 doRenameOwner의 ST.hist.owner와 똑같은 사연으로 낡은 이름에 남아있었다 — DB.txns는 위에서 이미 새 이름으로 옮겼으므로, 그 상태로 전체내역 탭에 돌아가면 칩은 새 이름이 아니라 옛 이름을 보여주면서 필터(t.category===old 그대로)는 어떤 거래와도 안 맞아 내역이 영원히 빈 화면으로 보인다(app-evolve cycle182). catExactType이 없던(과거 expense 전용) 데이터도 ||'expense' 기본값으로 그대로 맞으므로 수입 카테고리 이름변경이 지출 전용 필터를 잘못 건드리지 않는다 */
 }
 save();renderCurrent();openCatManage(k);toast('카테고리를 수정했어요')}

function setRate(kind,key,val){const n=Number(String(val).replace(/[^0-9.]/g,''))||0;
 /* 입력을 지우거나 숫자가 아닌 값을 넣으면 n이 0으로 떨어지는데, 이걸 그대로 저장하면
    rateUnknown()이 '아직 못 받아온 상태'와 '실제 0원'을 구분 못 해 미확인 배지 없이
    평가액이 조용히 0원이 된다(index.html:2125-2134 주석 참고). fx/stock/crypto는 키 자체를
    지워 다른 시세 미수신 상태와 동일하게 만들고, gold는 원래도 !goldPerG로 0을
    미확인 취급하므로 0을 그대로 둬도 안전하다. */
 /* ratesUpdatedAt은 mergeRates()(logic.js, app-evolve cycle192)가 DB.rates 전체를 last-write-wins로
  * 병합할 때 쓰는 유일한 기준이다 — 여기서 안 찍으면 수동 입력한 시세가 syncRates()의 syncedAt보다
  * 항상 "더 오래된" 취급을 받아, 다음 자동/수동 동기화가 다른 기기의 rates로 병합될 때마다
  * 이 수동 입력이 조용히 되돌려진다. */
 DB.rates.ratesUpdatedAt=Date.now();
 if(n<=0){if(kind==='gold')DB.rates.goldPerG=0;else if(kind==='fx'||kind==='fx100')delete DB.rates.fx[key];else if(kind==='stock')delete DB.rates.stocks[key];else if(kind==='crypto')delete DB.rates.crypto[key];save();return}
 if(kind==='gold')DB.rates.goldPerG=n;else if(kind==='fx')DB.rates.fx[key]=n;else if(kind==='fx100')DB.rates.fx[key]=n/100;else if(kind==='stock')DB.rates.stocks[key]=n;else if(kind==='crypto')DB.rates.crypto[key]=n;save()}

function sendInquiry(){
 const t=$('inqText');const v=(t&&t.value||'').trim();
 if(!v){toast('메모 내용을 입력해 주세요');return}
 DB.inquiries=DB.inquiries||[];
 DB.inquiries.push(touch({id:uid(),date:TODAY,text:v})); /* id/updatedAt 없이는 mergeRemoteDataIntoLocal()의 mergeCollection()에 등록할 수 없음(goals/catIcon과 동일한 '최상위 DB 필드 병합 누락' 버그 클래스) */
 save();closeSheet();toast('저장했어요');
}
function openInquiryList(){

 openSheet(`<h3>저장한 메모</h3><div class="desc">문의하기에서 적어둔 메모예요. 백업에 포함돼요</div>
  ${items.length?items.map(q=>`<div class="manage-row" style="align-items:flex-start"><div style="flex:1;min-width:0"><div class="mn" style="white-space:pre-wrap;word-break:break-word">${esc(q.text)}</div><div class="msub">${q.date||''}</div></div><div class="row-acts"><button class="act-btn" aria-label="메모 수정" onclick="editInquiry('${q.id}')">${svg('edit')}</button><button class="act-btn danger" aria-label="메모 삭제" onclick="delInquiry('${q.id}')">${svg('trash')}</button></div></div>`).join('')

  <div style="height:12px"></div><button class="btn btn-soft" onclick="openInquiry()">+ 새 메모 작성</button>
  <button class="btn btn-primary" style="margin-top:9px" onclick="closeSheet()">닫기</button>`);

/* 지금까지 저장한 메모는 추가(sendInquiry)·삭제(delInquiry)만 가능하고 고칠 방법이 없었다 —
 * renameOwnerSheet/renameCatSheet가 이미 쓰는 "수정" act-btn + 입력 시트 패턴을 그대로 따라
 * 내용만 바꿔 저장할 수 있게 한다(app-evolve cycle245 develop). date(작성일)는 손대지 않고
 * touchSave()로 updatedAt만 새로 찍어 mergeCollection()이 이 수정을 다른 기기와의 병합에서
 * 최신으로 인식하게 한다(sendInquiry가 touch() 없이 저장해 write-only였던 것과 같은 이유로,
 * 수정도 touch 없이 저장하면 다른 기기의 옛 사본이 이 수정을 조용히 덮어쓸 수 있음). */
function editInquiry(id){
 const q=(DB.inquiries||[]).find(x=>x.id===id);if(!q)return;

 setTimeout(()=>{const t=$('inqEditText');t&&t.focus()},300);
}
function saveInquiryEdit(id){
 const q=(DB.inquiries||[]).find(x=>x.id===id);if(!q)return;
 const t=$('inqEditText');const v=(t&&t.value||'').trim();
 if(!v){toast('메모 내용을 입력해 주세요');return}
 q.text=v;touchSave(q);closeSheet();openInquiryList();toast('메모를 수정했어요');
}
function delInquiry(id){
 const q=(DB.inquiries||[]).find(x=>x.id===id);if(!q)return;
 const preview=q.text.length>40?q.text.slice(0,40)+'…':q.text;
 confirmSheet('메모를 삭제할까요?',`'${esc(preview)}' 메모를 지워요.`,'삭제',()=>{
  DB.inquiries=(DB.inquiries||[]).filter(x=>x.id!==id);
  DB.deletedIds=DB.deletedIds||{};DB.deletedIds[id]=Date.now(); /* delGoal 등과 동일한 톰스톤 — 없으면 mergeRemoteDataIntoLocal이 이 삭제를 모르고 다른 기기의 사본을 되살림 */
  save();openInquiryList();
  undoToast('메모를 삭제했어요',()=>{DB.inquiries.push(q);delete DB.deletedIds[id];touchSave(q);openInquiryList();toast('되돌렸어요')});
 });
}

/* 거래 내역 CSV — 순수 함수(DOM/DB 전역 참조 없음), 자산명은 assets 배열로 조회 */
function txnsToCSV(txns,assets){
 const typeLabel={expense:'지출',income:'수입',transfer:'이체',saving:'저축'};
 const nm=(id,snap)=>{const a=(assets||[]).find(x=>x.id===id);return a?a.name:(snap||'')};
 /* 카테고리/자산명/메모는 사용자가 자유롭게 입력하므로 =,+,-,@ 로 시작하면
    엑셀/스프레드시트가 수식으로 해석할 수 있음(CSV 인젝션) — 앞에 '를 붙여 무력화.
    원문이 이미 '로 시작하는 경우도 똑같이 한 번 더 '를 붙여야 한다 — 안 그러면 "'=foo"처럼
    '뒤에 위험 문자가 바로 오는 원본과, 이 guard가 막 보호한 "'=foo"(원본 "=foo")를 내보낸
    뒤에는 구분할 수 없어, unguardCsv가 재가져오기 때 원본에 있던 '까지 지워버린다(아래 주석). */
 const guard=v=>{const s=String(v==null?'':v);return /^['=+\-@\t\r]/.test(s)?"'"+s:s};
 const esc=v=>{const s=String(v==null?'':v);return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const header=['날짜','구분','카테고리','금액','보내는 자산','받는 자산','메모'].map(esc).join(',');
 /* 분할 거래(t.splits)는 항목별로 한 행씩 내보낸다(날짜/구분/자산은 그대로 반복, 카테고리·금액·메모만
    각 항목 기준) — CSV는 한 행=한 카테고리 구조라 분할을 그대로 담을 별도 컬럼이 없고, 가져오기(v1)도
    분할을 지원하지 않는 걸 알려진 제한으로 둔다(app-evolve cycle198 critique 계획, 재가져오기 시
    한 거래가 여러 개의 일반 거래로 쪼개져 들어오는 건 이 제한의 자연스러운 결과). */
 const rows=(txns||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).flatMap(t=>splitLines(t).map(s=>[
  t.date,typeLabel[t.type]||t.type||'',guard(s.category||''),s.amount,
  guard(nm(t.fromAssetId,t.fromAssetName)),guard(nm(t.toAssetId,t.toAssetName)),guard(s.memo||t.memo||'')
 ].map(esc).join(',')));
 return '\ufeff'+[header,...rows].join('\r\n');
}

function assetsToCSV(items){

 const guard=v=>{const s=String(v==null?'':v);return /^['=+\-@\t\r]/.test(s)?"'"+s:s};
 const esc=v=>{const s=String(v==null?'':v);return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const header=['자산명','유형','귀속','통화/수량','평가금액','매입원가','손익','전체 합계 포함'].map(esc).join(',');
 const qtyLabel=a=>{
  if(a.type==='fx')return `${a.currency||''} ${a.fxAmount||0}`.trim();

  if(a.type==='stock')return `${a.stockCode||''} ${a.stockQty||0}주`.trim();

 const rows=(items||[]).map(a=>[
  guard(a.name||''),typeLabel[a.type]||a.type||'',guard(a.owner||''),guard(qtyLabel(a)),
  a.evalValue!=null?a.evalValue:'',a.costBasis>0?a.costBasis:'',a.gainLoss!=null?a.gainLoss:'',

/* 순자산 추이 CSV — 순수 함수. DB.nwHistory 항목({date,ta,td,nw,byOwner?}, updateNwHistory 참고)을
   그대로 받아 날짜/총자산/총부채/순자산 4컬럼으로 펼친다. byOwner(귀속별 세부값)는 귀속 집합이
   계정마다 달라 고정 컬럼으로 담을 수 없어 내보내지 않는다 — 귀속별 추이는 화면(목표/귀속별 보기)에서
   확인하는 걸 알려진 범위로 둔다. */
function nwHistoryToCSV(hist){
 const esc=v=>{const s=String(v==null?'':v);return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const header=['날짜','총자산','총부채','순자산'].map(esc).join(',');
 const rows=(hist||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)
  .map(h=>[h.date,h.ta,h.td,h.nw!=null?h.nw:(h.ta-h.td)].map(esc).join(','));

/* ===== 거래 내역 CSV 가져오기 — 순수 함수(DOM/DB 전역 참조 없음) ===== */
/* txnsToCSV의 guard(v)가 =,+,-,@,\t,\r(또는 원본이 이미 '로 시작하는 경우) 앞에 붙인 보호용 '를
 * 되돌린다 — guard가 "원본이 '로 시작하면 무조건 보호용 '를 하나 더 붙인다"로 바뀌었으므로
 * (위 txnsToCSV 주석), 여기서도 "다음 글자가 위험 문자인지"는 더 안 보고 맨 앞이 '면 무조건
 * 하나만 벗겨내야 guard와 짝이 맞는다. 예전엔 /^'[=+\-@\t\r]/ 로 다음 글자까지 확인했는데,
 * 메모/카테고리/자산명이 원래 "'=할인"처럼 '로 시작하고 그 다음이 위험 문자였던 경우
 * guard()가 보호하지 않아(원본에 이미 보호용 '가 붙어있다고 오인하기 쉬움) 내보낸 CSV도
 * "'=할인" 그대로였고, 재가져오기 때 이 정규식이 맞아 떨어져 원본의 '까지 지워 "=할인"으로
 * 조용히 바뀌었다(라운드트립 데이터 손상). */
function unguardCsv(v){return typeof v==='string'&&v[0]==="'"?v.slice(1):v}
/* CSV 한 행(cells)을 txn 후보로 변환한다. 컬럼 순서는 txnsToCSV의 헤더(날짜,구분,카테고리,금액,
   보내는 자산,받는 자산,메모)와 같다. 자산명은 assets 배열에서 정확히 일치하는 이름을 찾고,
   못 찾으면(오타/삭제됨/다른 앱에서 가져온 이름) id 없이 *AssetName 스냅샷만 남긴다 —
   assetNm(id,snap)이 이미 지원하는 패턴이라 화면에는 그대로 표시되지만 자산 잔액에는

function csvRowToImportTxn(cells,assets){

 const typeLabel=(cells[1]||'').trim();
 const category=unguardCsv((cells[2]||'').trim());
 const amountRaw=(cells[3]||'').trim().replace(/,/g,'');
 const fromName=unguardCsv((cells[4]||'').trim());
 const toName=unguardCsv((cells[5]||'').trim());
 const memo=unguardCsv((cells[6]||'').trim());
 if(!csvDateValid(date))return{ok:false,error:'date'};
 if(dateBelowRangeFloor(date)||dateAboveRangeCeil(date))return{ok:false,error:'range'};
 /* doExport가 이제 CSV를 만들 때 date<=TODAY로 미리 걸러내지만(app-evolve cycle216 advance),
  * 이 필터가 없던 버전이 만든 과거 CSV나 다른 경로로 만들어진 CSV에는 여전히 '예정' 날짜
  * 행이 섞여 있을 수 있다 — 그런 행은 스케줄과 연결되지 않은 고정 1회성 거래로 영구히 박혀
  * 반복거래가 실제로 일어나면 중복집계되므로, range(RANGE_TO 밖)와 구분되는 별도 사유로
  * 걸러 가져오기 미리보기에서 따로 안내한다(buildImportPreview의 futureCount). */
 if(date>TODAY)return{ok:false,error:'future'};
 const type=TYPEBYLABEL[typeLabel];
 if(!type)return{ok:false,error:'type'};
 const amount=Number(amountRaw);
 if(!Number.isFinite(amount)||amount<=0||!Number.isInteger(amount))return{ok:false,error:'amount'};
 if((type==='transfer'||type==='saving')&&(!fromName||!toName||fromName===toName))return{ok:false,error:'asset'};
 if(type==='expense'&&!fromName)return{ok:false,error:'asset'};
 if(type==='income'&&!toName)return{ok:false,error:'asset'};
 if(type!=='transfer'&&!category)return{ok:false,error:'category'};
 /* addCat/addOwner/saveAsset 중복명 판정과 같은 normName() 근접일치 — 대소문자·연속 공백·
    유니코드 정규화(NFC/NFD) 차이만 있는 자산명을 서로 다른 자산으로 보고 unmatched 처리하면
    안 된다(saveAsset의 동명 자산 가드도 같은 type끼리는 애초에 이 차이를 구분 없이 막는다). */
 const findAsset=nm=>{if(!nm)return null;const cands=(assets||[]).filter(a=>normName(a.name)===normName(nm)&&!isMarketValued(a));return cands.length===1?cands[0]:null};
 const fromAsset=type!=='income'?findAsset(fromName):null;
 const toAsset=type!=='expense'?findAsset(toName):null;
 /* 위 fromName===toName 가드는 글자 그대로 같을 때만 잡는다 — 연속 공백/대소문자/NFC·NFD
    차이로 문자열은 다르지만 findAsset()의 normName() 매칭으로 같은 자산을 가리키면(예: "주  계좌"
    vs "주 계좌") 통과해 fromAssetId===toAssetId인 자기 자신 이체가 그대로 저장된다 — saveTx/saveRec가
    수동 입력에서 막는 "보내는 자산과 받는 자산이 같아요"(line 4019/4210)와 똑같은 상태인데 CSV
    가져오기만 못 막던 공백. */
 if((type==='transfer'||type==='saving')&&fromAsset&&toAsset&&fromAsset.id===toAsset.id)return{ok:false,error:'asset'};
 const unmatched=[];
 const txn={type,date,category:type==='transfer'?'이체':category,amount,memo};
 if(type==='income')txn.fromAssetId=null;
 else{txn.fromAssetId=fromAsset?fromAsset.id:null;if(!fromAsset&&fromName){txn.fromAssetName=fromName;unmatched.push(fromName)}}
 if(type==='expense')txn.toAssetId=null;
 else{txn.toAssetId=toAsset?toAsset.id:null;if(!toAsset&&toName){txn.toAssetName=toName;unmatched.push(toName)}}
 return{ok:true,unmatched,txn};
}
/* CSV 텍스트 전체를 파싱해 가져오기 미리보기를 만든다. existingTxns는 doExport와 같은 방식으로
   반복거래 회차까지 펼쳐서(DB.txns.concat(expandRec(...))) 넘겨받아야 재가져오기 시 반복거래

function buildImportPreview(text,assets,categories,existingTxns){
 const dataRows=parseCSV(text).slice(1);
 const existingCounts=new Map();
 /* txnsToCSV는 분할 거래(t.splits)를 항목별로 한 행씩 내보내므로(위 txnsToCSV 주석), 재가져올
    때도 각 분할 항목이 그 항목의 category/amount로 된 독립된 행과 매칭돼야 한다. 기존 거래를
    top-level t.category/t.amount 하나로만 키를 만들면(분할이면 fallback 합계/대표 카테고리라
    실제로 내보낸 어떤 행과도 안 맞음) 재가져오기 때 분할 거래의 모든 행이 dup:false로 잘못
    표시돼 내 백업 CSV를 다시 불러오면 분할 거래가 일반 거래로 쪼개져 중복 생성된다
    (app-evolve cycle200의 sanitizeBackup 분할 미검증 공백과 같은 버그 클래스, 반대 방향). */
 (existingTxns||[]).forEach(t=>{splitLines(t).forEach(s=>{
  const k=csvDedupeKey(Object.assign({},t,{category:s.category,amount:s.amount,memo:s.memo||t.memo}));
  existingCounts.set(k,(existingCounts.get(k)||0)+1);
 })});
 const usedCounts=new Map();
 const items=[];
 let invalidCount=0,rangeCount=0,futureCount=0;
 /* cycle243 advance: invalidCount 하나로 뭉개지던 date/type/amount/category/asset 5가지 사유를
    따로 세고(assetUnmatchedCount가 이미 쓰는 'asset 매칭 실패'와는 다른 축 — 여긴 이름 자체가
    비어 요구사항을 못 채운 '하드 invalid' 케이스), 각 사유별로 행 번호+원본 셀 일부를
    SAMPLE_CAP개까지만 담아 응답 크기를 억제한다. */
 const invalidByReason={date:0,type:0,amount:0,category:0,asset:0};
 const SAMPLE_CAP=5;
 const samples={invalid:[],range:[],future:[]};
 const addSample=(bucket,entry)=>{if(samples[bucket].length<SAMPLE_CAP)samples[bucket].push(entry)};
 const newCats={expense:new Set(),income:new Set(),saving:new Set()};
 dataRows.forEach((cells,idx)=>{
  const row=idx+2; /* 헤더가 CSV 1행이므로 데이터 행은 2행부터 */
  const r=csvRowToImportTxn(cells,assets);
  if(!r.ok){
   if(r.error==='range'){rangeCount++;addSample('range',{row,cells:cells.slice(0,6)})}
   else if(r.error==='future'){futureCount++;addSample('future',{row,cells:cells.slice(0,6)})}
   else{invalidCount++;if(r.error in invalidByReason)invalidByReason[r.error]++;addSample('invalid',{row,reason:r.error,cells:cells.slice(0,6)})}
   return;
  }
  /* addCat/renameCatSheet와 같은 normName() 근접중복 판정을 CSV 카테고리에도 적용 — 그대로 두면
     "식비 "(공백)·"식비"(연속공백)·대소문자 변형이 원본과 다른 별도 카테고리로 생성돼
     지출분석/예산 집계가 같은 카테고리인데 둘로 쪼개진다. 일치하는 기존/이번 가져오기 신규
     카테고리가 있으면 그 표기로 맞춰 하나로 합친다. */
  if(r.txn.type!=='transfer'&&categories&&Array.isArray(categories[r.txn.type])&&r.txn.category){
   const canon=categories[r.txn.type].find(c=>normName(c)===normName(r.txn.category))
    ||[...newCats[r.txn.type]].find(c=>normName(c)===normName(r.txn.category));
   if(canon)r.txn.category=canon;
   else newCats[r.txn.type].add(r.txn.category);
  }
  const key=csvDedupeKey(r.txn);
  const used=usedCounts.get(key)||0;
  const dup=used<(existingCounts.get(key)||0);
  usedCounts.set(key,used+1);
  items.push({txn:r.txn,dup,unmatched:r.unmatched});
 });
 const newCount=items.filter(x=>!x.dup).length;
 /* assetUnmatchedCount와 같은 필터(!dup && unmatched.length)로 모은, 실제로 가져와질 행들의
    안 맞은 자산명만 중복제거+가나다 정렬 — dup 행의 unmatched는 애초에 안 가져오므로 제외. */
 const unmatchedAssetNames=[...new Set(items.filter(x=>!x.dup&&x.unmatched.length).flatMap(x=>x.unmatched))].sort((a,b)=>a.localeCompare(b,'ko'));
 return{
  items,
  totalRows:dataRows.length,
  invalidCount,
  invalidByReason,
  rangeCount,
  futureCount,
  dupCount:items.length-newCount,
  newCount,
  assetUnmatchedCount:items.filter(x=>!x.dup&&x.unmatched.length).length,
  unmatchedAssetNames,
  samples,
  newCats:{expense:[...newCats.expense],income:[...newCats.income],saving:[...newCats.saving]}

}

/* kind별 CSV 파일명 접두사/공유 제목/복사 안내 — csv(거래내역)는 기존 그대로, assetsCsv/nwCsv는

const CSV_KIND_META={
 csv:{prefix:'history',shareTitle:'거래 내역 CSV',copyTitle:'거래 내역 데이터 복사'},
 assetsCsv:{prefix:'assets',shareTitle:'자산 목록 CSV',copyTitle:'자산 목록 데이터 복사'},

async function doExport(mode,kind){

    평가를 doExport(이미 DB 전역을 쓰는 호출부)가 끝낸 뒤, 포맷팅만 하는 순수 함수(assetsToCSV/
    nwHistoryToCSV)에 결과만 넘긴다(assetsToCSV/nwHistoryToCSV 주석 참고). */
 const text=kind==='assetsCsv'?assetsToCSV(DB.assets.map(a=>Object.assign({},a,{evalValue:assetEval(a),gainLoss:(assetGainLoss(a)||{}).amount})))
  :kind==='nwCsv'?nwHistoryToCSV(DB.nwHistory)
  :kind==='csv'?txnsToCSV(DB.txns.concat(expandRec(RANGE_FROM,RANGE_TO)).filter(t=>!(t.adjust&&!t.inSurplus)&&t.date<=TODAY),DB.assets)
  :JSON.stringify(DB,null,2);
 const mime=isCsv?'text/csv':'application/json';
 /* CSV는 복원용 백업이 아니므로 백업 알림 상태(lastExport/backupSnooze)를 건드리지 않는다 */
 const done=msg=>{if(!isCsv){DB.settings.lastExport=Date.now();DB.settings.backupSnooze=0;save();renderCurrent();}toast(msg)};
 const copyFallback=reason=>openCopyBackup(text,reason,isCsv?{title:csvMeta.copyTitle,note:'스프레드시트 앱에서 열 때는 이 내용을 .csv 파일로 저장해 불러오면 돼요.',isCsv:true}:null);

 /* 1) 공유 시트 — 되면 이게 가장 확실 */
 if(mode==='share'){
  try{
   const file=new File([text],name,{type:mime});
   await navigator.share({files:[file],title:isCsv?csvMeta.shareTitle:'우리의 자산 백업'});
   done(isCsv?'CSV 파일을 저장했어요':'백업 파일을 저장했어요');
   return;
  }catch(e){
   if(e&&e.name==='AbortError')return; /* 사용자가 취소 */
   copyFallback('공유가 막혀 있어요.'); /* 인앱 브라우저 등 */
   return;
  }
 }

 /* 2) 파일 열기/다운로드 */
 const blob=new Blob([text],{type:mime});
 const url=URL.createObjectURL(blob);
 try{
  if(IS_IOS){
   /* iOS는 download 속성을 무시하고 파일을 미리보기로 엽니다.
      새 창이 차단되면(인앱 브라우저 등) 곧바로 복사 방식으로 안내합니다. */
   const w=window.open(url,'_blank');
   if(!w||w.closed||typeof w.closed==='undefined'){
    URL.revokeObjectURL(url);
    copyFallback('파일 열기가 차단됐어요.');
    return;
   }
   done('파일이 열렸어요 · 공유 버튼으로 저장하세요');
  }else{
   const a=document.createElement('a');
   a.href=url;a.download=name;
   document.body.appendChild(a);a.click();a.remove();
   done(`${name} 으로 내보냈어요`);
  }
  setTimeout(()=>URL.revokeObjectURL(url),20000);
 }catch(e){
  URL.revokeObjectURL(url);
  copyFallback('파일로 저장할 수 없어요.');
 }
}

/* 백업 복원(파일)·클라우드 풀(pullCloud) 양쪽이 공유하는 숫자 필드 검증. 검증 없이 DB에
 * 그대로 대입하면 NaN/문자열 금액이 balancesUpTo/expenseByCat 등 잔액 계산
 * 전체로 조용히 전파되고, save()를 거쳐 scheduleCloudPush()로 다른 기기까지 오염이 퍼질 수 있다.
 * min을 주면(수량성 필드) 그 아래로는 클램프하고, 안 주면(잔액성 필드는 마이너스도 유효한 상태라)
 * 유한수 여부만 본다. */
function sanitizeAmount(v,min){
 const n=Number(v);
 if(!Number.isFinite(n))return 0;
 return (min!=null&&n<min)?min:n;
}
const SANITIZE_QTY_FIELDS=['fxAmount','goldDon','stockQty','cryptoQty','costBasis']; /* 보유수량 — 음수 불가 */
const SANITIZE_FREE_FIELDS=['baseAmount','amountKRW']; /* 자산 잔액 — 마이너스도 유효(마이너스통장 등) */
/* obj를 변형하지 않고 새 객체를 반환한다(restoreBackup의 실패 시 되돌리기 로직과 독립적으로
 * 쓸 수 있게). id(txns는 date도) 없는 레코드는 나머지 로직이 전제하는 최소 형태를 못 갖춘
 * 것으로 보고 통째로 제거한다. */
function sanitizeBackup(obj){
 let fixedCount=0,droppedCount=0,rangeCount=0;
 /* uid()에 모듈 스코프 카운터를 섞어 같은 탭/프로세스 안의 신규 생성은 결정론적으로 유일해졌지만,
  * 백업 파일/다른 기기·다른 시점에서 만들어진 문서가 합쳐지는 이 경로(restoreBackup/pullCloud가
  * 모두 거침)에서는 여전히 서로 다른 uid() 호출 결과가 우연히 같을 수 있다(복구 전 구버전
  * uid()로 만들어진 레코드가 섞인 백업 포함). id를 절대불변 키로 믹스하는 mergeCollection()
  * (logic.js의 new Map(arr.map(r=>[r.id,r]))가 중복 id를 조용히 마지막 것만 남기고 덮어씀)과
  * deleteTxnsUndo(index.html의 filter(t=>!ids.has(t.id))가 충돌 쌍 중 하나만 지우려다 둘 다
  * 지움) 둘 다 "id는 유일하다"를 전제하므로, 각 컬렉션에서 첫 등장만 남기고 이후 중복 id는 새
  * uid()를 부여해 유일성을 복구한다. */
 const dedupeIds=arr=>{
  const seen=new Set();
  return arr.map(d=>{
   if(seen.has(d.id)){const d2=Object.assign({},d,{id:uid()});fixedCount++;seen.add(d2.id);return d2}
   seen.add(d.id);return d;
  });
 };
 const srcTxns=Array.isArray(obj&&obj.txns)?obj.txns:[];
 let txns=[];
 srcTxns.forEach(t=>{
  /* t.date는 recurrences의 startDate/endDate, assets의 maturityDate, goals의 targetDate,
   * nwHistory의 date와 동일한 "YYYY-MM-DD" 날짜 필드인데, 유독 이 필드만 형식/달력 유효성을
   * csvDateValid()로 검증하지 않고 truthy 여부만 봤다 — "2026-02-30"처럼 모양은 맞지만 달력에
   * 없는 날짜가 그대로 통과되면, allTxns()/monthStats()류의 범위 필터(t.date>=from&&t.date<=to,
   * 문자열 비교)는 "30"이 그 달의 마지막 날(28/29)보다 사전순으로 더 크다는 이유만으로 그
   * 거래를 **그 달의 범위에서 아예 빼버리면서도**, RANGE_FROM처럼 더 넓은 범위(잔액 계산 전체
   * 구간)에는 여전히 걸려 포함된다 — 같은 거래가 가계부/월간 수지(제외)와 자산 잔액(포함) 사이에
   * 조용히 어긋나는 수치 drift를 만든다. wname()/fmtDate()/shortDate()가 그 날짜로 new Date()를
   * 만들면 자바스크립트 롤오버로 "3월 2일"처럼 전혀 다른 날로도 표시될 수 있어(goals.targetDate와
   * 동일한 문제, 위 6734줄 주석 참고), 날짜가 롤오버되지 않는 문자열 범위 필터와도 어긋난다.
   * startDate 없는 recurrences와 동일하게(이 함수가 공유하는 "필수 날짜가 무효하면 레코드 자체를
   * 버린다" 원칙), id 없는 경우와 똑같이 레코드를 통째로 제거한다(app-evolve cycle234 develop —
   * 다른 모든 날짜 필드가 이미 거친 csvDateValid 검증에서 유일하게 빠져 있던 거래 날짜). */
  if(!t||!t.id||!csvDateValid(t.date)){droppedCount++;return}
  const d=Object.assign({},t);
  /* t.amount는 항상 크기(magnitude)이고 방향은 type/fromAssetId/toAssetId가 정한다(자산의
   * baseAmount/amountKRW와 달리 "마이너스도 유효한 잔액성 필드"가 아니다) — min 0으로 클램프하지
   * 않으면 손상된 백업/원격 데이터의 음수 amount가 balancesUpTo()의 -sign*t.amount 계산에서
   * 부호가 뒤집혀 반대 방향 입출금으로 조용히 오염된다. */
  if('amount' in d){const n=sanitizeAmount(d.amount,0);if(n!==d.amount){d.amount=n;fixedCount++}}
  /* t.splits(분할 거래, app-evolve cycle198)는 saveTx()가 저장 시점에만 category/amount 전부 입력·
   * 합계 일치를 강제하고, 백업 복원/클라우드 머지가 공유하는 이 유일한 검증 체크포인트에서는
   * 전혀 재검증되지 않았다 — 손상된 백업이나 다른 기기에서 동기화된 데이터에 category 없는
   * split, amount가 NaN/음수/문자열인 split, 합계가 d.amount와 안 맞는 split이 들어오면
   * splitLines()가 그대로 소비해 spendByCategory/budgetForMonthWithCarry/homeAlerts의 예산
   * 집계에 NaN이 조용히 전파된다(원장/잔액 화면은 d.amount를 직접 써서 정상으로 보여 화면 간
   * 수치 drift가 생김). 손상된 항목을 걸러낸 뒤 유효 항목이 2개 미만이거나(txSplitRemove가
   * 2개 밑으로는 못 내려가게 하는 UI 불변식과 동일) 합계가 d.amount와 다르면 splits 전체를
   * 지워 top-level category/amount로 fallback시킨다(saveTx와 동일한 "분할 아님" 처리). */
  if('splits' in d){
   if(!Array.isArray(d.splits)){delete d.splits;fixedCount++}
   else{
    const cleaned=d.splits.filter(s=>s&&typeof s.category==='string'&&s.category).map(s=>Object.assign({},s,{amount:sanitizeAmount(s.amount,0)})).filter(s=>s.amount>0);
    const sum=cleaned.reduce((s,x)=>s+x.amount,0);
    if(cleaned.length<2||sum!==d.amount){delete d.splits;fixedCount++}
    else if(cleaned.length!==d.splits.length||cleaned.some((s,i)=>s.amount!==d.splits[i].amount)){d.splits=cleaned;fixedCount++}
   }
  }
  /* CSV 가져오기(buildImportPreview)는 RANGE_FROM~RANGE_TO 밖 행을 rangeCount로 세어 사용자에게
   * 보여주는데, 백업/클라우드 복원 경로만 이 카운트가 없었다 — 복원된 txn은 DB엔 그대로
   * 남지만 범위 밖 날짜라 allTxns(RANGE_FROM,RANGE_TO) 기반 잔액·집계에서는
   * 조용히 빠지므로, droppedCount(레코드 자체가 사라짐)와는 별도로 세어 알려야 한다. */
  if(dateBelowRangeFloor(d.date)||dateAboveRangeCeil(d.date))rangeCount++;
  txns.push(d);
 });
 /* owner(자산의 귀속)는 goal.owner와 달리 'all' 센티넬을 허용하지 않는 필수 필드다 — asDraft가
  * openAssetSheet()에서 항상 DB.owners[0]을 기본값으로 채우고(asOpenOwner 피커도 DB.owners 중
  * 하나만 고르게 함), ownerAssets/ownerDebt/allocationCard/investGainLossCard/nwHistoryCard 등
  * 모든 귀속별 집계·필터가 a.owner===o(정확히 일치) 비교만 쓴다. 백업/클라우드 풀 경로로
  * 들어오는 자산의 owner가 이 백업 자신의 owners 목록(obj.owners, 없으면 이 기기의 DB.owners)에
  * 없는 낡은/손상된 이름이면(예: 다른 기기에서 귀속을 삭제·오타로 저장한 뒤 동기화 전에 백업한
  * 경우, 또는 손으로 편집한 백업 파일) 그 자산은 '전체' 보기에선 계속 보이면서도 모든 귀속별
  * 탭·카드에서는 조용히 사라진 것처럼 보인다 — 목표(goal.owner)는 이미 cycle124부터 이 함수가
  * validOwners로 검증해 'all'로 clamp하는데, 똑같이 사용자가 저장 시점에 전혀 거를 수 없는 이
  * 경로(sanitizeBackup)에서 자산만 그 검증이 빠져 있었다(app-evolve cycle236 develop). 'all'로는
  * clamp할 수 없으므로(자산에는 유효한 값이 아님) 이 백업이 아는 첫 번째 실제 귀속으로 떨어뜨린다
  * — delOwner()가 "쓰는 자산이 있으면 귀속을 못 지운다"로 지키는 "모든 자산은 실존하는 귀속을
  * 가진다" 불변식과 같은 방향이다. */
 const validOwners=Array.isArray(obj&&obj.owners)?obj.owners:(DB.owners||[]);
 const srcAssets=Array.isArray(obj&&obj.assets)?obj.assets:[];
 let assets=[];
 srcAssets.forEach(a=>{
  if(!a||!a.id||!a.type){droppedCount++;return}
  const d=Object.assign({},a);
  SANITIZE_FREE_FIELDS.forEach(f=>{if(f in d){const n=sanitizeAmount(d[f]);if(n!==d[f]){d[f]=n;fixedCount++}}});
  SANITIZE_QTY_FIELDS.forEach(f=>{if(f in d){const n=sanitizeAmount(d[f],0);if(n!==d[f]){d[f]=n;fixedCount++}}});
  /* maturityDate는 저축 자산에 없는 게 정상 상태라(만기 미설정) 레코드를 버리지 않고,
   * startDate/endDate와 동일하게 csvDateValid()로 형식/달력 유효성만 검증해 깨졌으면 null로
   * 정규화한다 — 그대로 두면 doMaturity/openMaturity의 날짜 비교가 깨진 문자열을 그대로 쓴다. */
  if(d.maturityDate&&!csvDateValid(d.maturityDate)){d.maturityDate=null;fixedCount++}
  /* validOwners가 비어있으면(이 백업에도 obj.owners가 없고 이 기기의 DB.owners도 아직 없는 극히
   * 드문 경우 — 정상 실사용에서는 migrate()가 항상 기본 귀속을 채워 DB.owners가 빈 적이 없음)
   * 무엇이 "유효한 귀속"인지 판단할 근거 자체가 없으므로, 근거 없이 임의 문자열을 지어내지 않고
   * 받은 값을 그대로 둔다 — budgetHistory/catIcon 등 다른 블록이 '판단 근거가 없으면 손대지
   * 않는다'로 지키는 것과 같은 원칙. */
  if(validOwners.length&&(!d.owner||!validOwners.includes(d.owner))){d.owner=validOwners[0];fixedCount++}
  assets.push(d);
 });
 /* 반복거래는 한 레코드가 recDates()로 매달 새 거래를 계속 만들어내므로, amount가 손상되면
  * txns 한 건이 아니라 이후 모든 회차가 조용히 오염된다(expandRec() 1923줄). edits[date].amount
  * 오버라이드도 같은 경로로 쓰이므로 동일하게 검증한다. startDate가 없거나 형식/달력상
  * 유효하지 않으면(예: "not-a-date", "2026-13-01") recDates()의 new Date(r.startDate) 가
  * Invalid Date가 되어 종료 조건(cur>endd 등)이 항상 false가 되고 setMonth/setDate로도
  * 벗어나지 못해 무한루프로 앱이 완전히 멈춘다 — csvDateValid()로 CSV 가져오기와 동일하게
  * 엄격히 검증해 id/date 없는 txns를 제거하는 것과 같은 이유로 통째로 제거한다. */
 const srcRecs=Array.isArray(obj&&obj.recurrences)?obj.recurrences:[];
 let recurrences=[];
 srcRecs.forEach(r=>{
  if(!r||!r.id||!csvDateValid(r.startDate)){droppedCount++;return}
  const d=Object.assign({},r);

 * (스크림탭/스와이프다운 닫기/뒤로가기)가 그 스냅샷과 달라진 초안을 경고 없이 버리지
 * 않게 한다(app-evolve cycle207 advance) — 명시적 저장/취소 버튼은 이미 초안을 정리하고
 * closeSheet()를 직접 부르므로 건드리지 않는다. */
let _draftSnap=null;
function snapDraft(kind){const d=kind==='tx'?txDraft:kind==='as'?asDraft:kind==='goal'?goalDraft:kind==='rec'?recDraft:null;_draftSnap=d?{kind,json:JSON.stringify(d)}:null}
function isDraftDirty(){
 if(!_draftSnap)return false;
 const k=_draftSnap.kind;
 if(k==='tx'){if(!txDraft)return false;syncTxInputs();return JSON.stringify(txDraft)!==_draftSnap.json}
 if(k==='as'){if(!asDraft)return false;syncAssetInputs();return JSON.stringify(asDraft)!==_draftSnap.json}
 if(k==='goal'){if(!goalDraft)return false;syncGoalInputs();return JSON.stringify(goalDraft)!==_draftSnap.json}
 if(k==='rec'){if(!recDraft)return false;syncRecInputs();return JSON.stringify(recDraft)!==_draftSnap.json}
 return false;
}
let _sheetGuardSnapshot=null;
function closeSheetGuarded(viaPopstate){
 if(!isDraftDirty()){closeSheet();return}
 if(viaPopstate)ovHistPush(); /* 뒤로가기가 이미 소비한 history entry를 복구 — 확인 전까지는 오버레이가 열려 있어야 다음 뒤로가기도 정상 동작함('버리기'를 고르면 closeSheet()가 다시 소비한다) */
 const sc=$('sheetScroll');_sheetGuardSnapshot=sc?sc.innerHTML:'';
 openSheet(`<h3>변경사항을 버릴까요?</h3><div class="desc" style="margin-bottom:22px">입력하던 내용이 저장되지 않아요.</div>
  <div class="two-btn"><button class="btn btn-soft cancel" onclick="_sheetGuardCancel()">계속 편집</button>
   <button class="btn btn-danger" onclick="closeSheet()">버리기</button></div>`);
}
function _sheetGuardCancel(){
 const html=_sheetGuardSnapshot;_sheetGuardSnapshot=null;
 const sh=$('sheet');if(!sh||html==null){closeSheet();return}
 sh.innerHTML=`<div class="sheet-scroll" id="sheetScroll">${html}</div>`;
 const sc=$('sheetScroll');applyHeight(sh,sc);attachDetent(sh,sc);wireSheetGestures(sh,sc);
 requestAnimationFrame(()=>requestAnimationFrame(()=>{moveSegBlobs();try{fcWire()}catch(e){}}));
}

function fmtAmt(inp,allowNeg){const neg=allowNeg&&/^-/.test(inp.value);let v=inp.value.replace(/[^0-9]/g,'');inp.value=v?(neg?'-':'')+Number(v).toLocaleString('ko-KR'):(neg?'-':'')}
function fmtQty(inp){let v=inp.value.replace(/[^0-9.]/g,'');const dot=v.indexOf('.');if(dot!==-1)v=v.slice(0,dot+1)+v.slice(dot+1).replace(/\./g,'');inp.value=v}

let openSwipeRow=null;
function wireLongPress(root,onLong){
 if(!root)return;
 const cb=onLong||((id)=>{if(!ST.hist.selMode){ST.hist.selMode=true;ST.hist.sel.add(id);updateHist();updateSelBottom()}});
 root.querySelectorAll('[data-lp]').forEach(el=>{
  const target=el.querySelector('.swipe-content')||el;
  let timer;
  const start=()=>{target.classList.add('lp-press');
    timer=setTimeout(()=>{
      window._lpJustFired=true;
      target.classList.remove('lp-press');target.classList.add('lp-pop');
      setTimeout(()=>target.classList.remove('lp-pop'),420);

  const cancel=()=>{clearTimeout(timer);target.classList.remove('lp-press')};
  el.addEventListener('touchstart',start,{passive:true});el.addEventListener('touchend',cancel);el.addEventListener('touchmove',cancel);

 });

let _dpYM=null;
let _dpTarget='ledger',_dpSel=null,_dpOnPick=null;

function dpPick(ds){ /* 날짜만 선택 — 창은 '확인'을 눌러야 닫힘 */
 _dpSel=ds;
 const grid=$('dpScroll');if(!grid)return;
 grid.querySelectorAll('.dp-cell').forEach(c=>{c.classList.remove('sel');c.setAttribute('aria-pressed','false')});
 const cell=[...grid.querySelectorAll('.dp-cell')].find(c=>c.getAttribute('onclick')===`dpPick('${ds}')`);
 if(cell){cell.classList.add('sel');cell.setAttribute('aria-pressed','true')}
 moveDpBlob(true);

function dpMonthBlock(y,m){
 const first=new Date(y,m-1,1),startDow=first.getDay(),daysIn=lastDay(y,m);
 const pd=lastDay(m===1?y-1:y,m===1?12:m-1);
 let cells='';
 for(let i=0;i<startDow;i++)cells+=`<div class="dp-cell empty"></div>`;
 for(let dn=1;dn<=daysIn;dn++){
  const ds=`${y}-${String(m).padStart(2,'0')}-${String(dn).padStart(2,'0')}`;
  const sel=ds===_dpSel,isToday=ds===TODAY;
  const cls=['dp-cell'];if(sel)cls.push('sel');if(isToday)cls.push('today');
  cells+=`<button class="${cls.join(' ')}" onclick="dpPick('${ds}')" aria-label="${y}년 ${m}월 ${dn}일"${isToday?' aria-current="date"':''} aria-pressed="${sel}">${dn}</button>`;
 }
 /* 마지막 줄은 다음 달 블록이 이어받으므로 채우지 않음 (빈칸 없이 연속) */
 return `<div class="dp-month" data-ym="${y}-${m}" data-y="${y}" data-m="${m}"><div class="dp-grid">${cells}</div></div>`;
}

 syncOverlayInert();
 requestAnimationFrame(()=>{

   moveDpBlob(false);
   if(sc)dpOnScroll(sc); /* 처음부터 보고 있는 달만 진하게 */

function dpExtend(sc,dir){ /* 끝에 닿으면 달을 더 이어붙임 */
 const months=[...sc.querySelectorAll('.dp-month')];if(!months.length)return;
 const ref=dir>0?months[months.length-1]:months[0];
 const y=+ref.dataset.y,m=+ref.dataset.m;
 let html='';
 for(let i=1;i<=6;i++){const d=new Date(y,m-1+dir*i,1);html+=dpMonthBlock(d.getFullYear(),d.getMonth()+1)}
 if(dir>0){ref.insertAdjacentHTML('afterend',html)}
 else{const before=sc.scrollHeight;months[0].insertAdjacentHTML('beforebegin',html);
   sc.scrollTop+=sc.scrollHeight-before; /* 위로 붙일 땐 스크롤 보정 */
   moveDpBlob(false);}
}
function dpOnScroll(sc){ /* 화면에 가장 많이 보이는 달을 상단에 표시 */
 if(sc._raf)return;
 sc._raf=requestAnimationFrame(()=>{sc._raf=null;
  if(sc.scrollTop<80)dpExtend(sc,-1);
  else if(sc.scrollTop+sc.clientHeight>sc.scrollHeight-80)dpExtend(sc,1);
  const viewTop=sc.scrollTop,viewBot=viewTop+sc.clientHeight;
  let cur=null,best=0;
  sc.querySelectorAll('.dp-month').forEach(mo=>{
   const top=mo.offsetTop,bot=top+mo.offsetHeight;
   const vis=Math.min(bot,viewBot)-Math.max(top,viewTop); /* 겹치는 높이 = 보이는 양 */
   if(vis>best){best=vis;cur=mo}
  });
  if(!cur)cur=sc.querySelector('.dp-month');
  if(!cur)return;
  /* 경계에서 표기가 떨리지 않도록 여유(현재 달이 15% 이내로 뒤지면 유지) */
  if(sc._curYM){
   const keep=sc.querySelector(`.dp-month[data-ym="${sc._curYM}"]`);
   if(keep&&keep!==cur){
    const kt=keep.offsetTop,kb=kt+keep.offsetHeight;
    const kvis=Math.min(kb,viewBot)-Math.max(kt,viewTop);
    if(kvis>best*0.85)cur=keep;
   }
  }
  sc._curYM=cur.dataset.ym;
  const y=+cur.dataset.y,m=+cur.dataset.m;
  const t=$('dpMText');if(t&&t.textContent!==`${y}년 ${m}월`)t.textContent=`${y}년 ${m}월`;
  _dpYM={y,m};
  sc.querySelectorAll('.dp-month').forEach(mo=>mo.classList.toggle('dim',mo!==cur)); /* 보고 있는 달만 진하게 */
 });
}

function dpCloseJump(){closeDpWheelLayer()}
function whScrollTo(col,val){if(!col)return;
 whCenterOn(col,[...col.children].find(c=>+c.dataset.v===+val));
}
function whValue(col){if(!col)return null;
 const mid=col.scrollTop+col.clientHeight/2;let best=null,bd=1e9;
 [...col.children].forEach(c=>{const cm=c.offsetTop+c.offsetHeight/2;const d=Math.abs(cm-mid);
  c.classList.toggle('on',false);c.setAttribute('aria-selected','false');
  if(d<bd){bd=d;best=c}});
 if(best){best.classList.add('on');best.setAttribute('aria-selected','true');col.setAttribute('aria-activedescendant',best.id)}
 if(!best)return null;
 const v=best.dataset.v;
 return /^-?\d+$/.test(v)?+v:v; /* 숫자면 숫자, 아니면 문자열('all','2026-5') */
}
/* 휠 피커(wh-col) 키보드 이동 — ArrowUp/Down/Home/End만 가로채고 나머지(Tab 등)는 그대로 둔다.
 * 네이티브 scroll 이벤트가 기존 whSnap→whValue 파이프라인을 그대로 타므로 haptic/snap 로직은
 * 손대지 않는다. */
function whKeydown(e,col){
 if(!['ArrowUp','ArrowDown','Home','End'].includes(e.key))return;
 e.preventDefault();
 const items=[...col.children];
 const cur=items.findIndex(c=>c.classList.contains('on'));
 whCenterOn(col,items[whTargetIdx(cur,items.length,e.key)]);
 whValue(col);
}
function whSnap(col){if(col._raf)return;col._raf=requestAnimationFrame(()=>{col._raf=null;
 const v=whValue(col);
 if(v!=null&&col._last!==v){col._last=v;if(navigator.vibrate)navigator.vibrate(4)} /* 칸마다 짧은 햅틱 */
 clearTimeout(col._settle);
 col._settle=setTimeout(()=>{ /* 손을 떼면 가장 가까운 칸에 정확히 안착 */
   const it=[...col.children].find(c=>c.classList.contains('on'));
   if(it){const target=it.offsetTop-col.clientHeight/2+it.offsetHeight/2;
     if(Math.abs(col.scrollTop-target)>1)col.scrollTo({top:target,behavior:'smooth'});}
 },110);
})}
function dpJumpApply(){

 dpCloseJump();
 if(!y||!m)return;

function moveDpBlob(animate){
 const grid=$('dpScroll'),blob=$('dpBlob');if(!grid||!blob)return;
 const cell=grid.querySelector('.dp-cell.sel');
 if(!cell){blob.classList.remove('on');return}
 /* offsetParent(.dp-scroll) 기준 — 팝업 확대 애니메이션의 영향을 받지 않음 */
 let x=cell.offsetLeft,y=cell.offsetTop,node=cell.offsetParent;
 while(node&&node!==grid){x+=node.offsetLeft;y+=node.offsetTop;node=node.offsetParent}
 if(!animate)blob.style.transition='none';
 blob.style.width=cell.offsetWidth+'px';
 blob.style.height=cell.offsetHeight+'px';
 const t=`translate(${x}px,${y}px)`;
 blob.style.setProperty('--dpT',t);
 blob.style.transform=t;
 blob.classList.add('on');
 if(!animate){blob.offsetHeight;blob.style.transition=''}
 else{blob.classList.add('squish');clearTimeout(blob._t);blob._t=setTimeout(()=>blob.classList.remove('squish'),260)}
}

function pageHead(tab,extra){

 if(tab==='ledger'||tab==='history'){
  acts=modeSeg(tab)+`<button class="sch-chip today-chip" onclick="goToday()">${svg('clock')}오늘로</button>`;

function planNegatives(){ /* 통장별 · 예정 끝까지 · '하루 합산(일 마감)' 잔액 기준 */
 const horizon=DISP_TO,out=[];
 /* lowestInMonth()/planRowsHTML()과 동일한 이유로 날짜별 balanceAt()과 동일한 규칙을 따라야
    한다 — 예전처럼 거래별 증감(byDay)을 직접 누적하면 balancesUpTo()가 적용 중인 미확인
    이체 제외 규칙(dateStr<=TODAY면 제외)을 놓쳐, 오늘 날짜의 미확인 이체 한 건만 기록해도
    아직 나가지 않은 돈인데 오늘 잔액이 마이너스로 뜬다는 거짓 경고가 나왔다. 플랜 대상
    통장마다, 그리고 통장마다 여러 날짜를 조회하므로(대시보드 전체에 걸친 날짜 수만큼)
    balanceAt()을 날짜마다 부르면 매번 전체 재스캔이 일어난다 — 모든 통장의 모든 날짜를
    모아 balancesAtDates() 한 번으로 계산한다(lowestInMonth/planRowsHTML과 동일한 이유). */
 const plAssets=DB.assets.filter(isPlanAcct);
 const perAssetDates=new Map(),allDates=new Set();
 plAssets.forEach(a=>{
   const dates=new Set([TODAY]);
   allTxns(TODAY,horizon).forEach(t=>{if(t.fromAssetId===a.id||t.toAssetId===a.id)dates.add(t.date)});
   const sorted=Array.from(dates).sort();
   perAssetDates.set(a.id,sorted);
   sorted.forEach(d=>allDates.add(d));
 });
 const balMap=balancesAtDates(Array.from(allDates));
 plAssets.forEach(a=>{
   /* firstNeg(처음 마이너스로 내려가는 날)와 minBal(전체 기간 중 가장 낮은 잔액)은 서로 다른
      날짜일 수 있다 — 한 번 마이너스로 떨어졌다가 중간에 입금으로 회복한 뒤 나중에 더 크게
      떨어지는 경우(예: 6/2에 -100원까지 내려갔다가 6/3에 입금으로 +900원 회복, 6/10에 다시
      -4100원까지 떨어짐). 아래에서 date에 firstNeg를 그대로 썼었는데, 호출부(acctSafety/
      openNegList/homeAlerts 'neg')가 모두 이 date와 min을 "{date}부터 · 잔액이 {min}원까지
      내려가요"로 한 문장에 묶어 보여주고 goPlanTo(assetId,date)로 바로 그 날짜로 이동시킨다 —
      위 예시라면 실제로는 6/2에 -100원인데도 "6/2부터 -4100원까지 내려가요"라고 보여주고
      눌러서 이동한 화면에도 -4100원이 아니라 -100원이 보여, 표시된 금액과 날짜가 서로 다른
      시점을 가리키는 불일치가 났다. min이 실제로 나타나는 날짜(minDate)를 date로 써서 둘이
      항상 같은 시점을 가리키게 한다(app-evolve cycle242 develop) — firstNeg는 "마이너스가
      시작되는지" 여부(알림을 띄울지)를 판정하는 트리거로만 쓰고, 보여주는 날짜는 그 트리거와
      무관하게 항상 min이 실제로 찍히는 날로 고정한다. */
   let firstNeg=null,minBal=Infinity,minDate=null;
   perAssetDates.get(a.id).forEach(date=>{
     const b=balanceAtFromMap(balMap,date,a.id);
     if(b<minBal){minBal=b;minDate=date;}
     if(b<0&&!firstNeg)firstNeg=date;
   });
   if(firstNeg)out.push({assetId:a.id,name:a.name,owner:a.owner,date:minDate,min:minBal});
 });

}

function lastActualAmount(r,date){ /* 직전 회차에 실제로 넣은 금액. 데이터 없으면 null(실제 0원과 구분).
  openQuickAmount()를 열 때마다 매번 Object.keys(r.edits).sort()로 전체를 스캔하면 edits가
  많이 쌓인 반복거래일수록 느려지므로, "가장 최근 edits 날짜"를 _lastEditCache에 기억해 뒀다가
  물어보는 date가 그보다 미래(가장 흔한 append-only 패턴)면 O(1)로 바로 답한다. edits는 항상
  save()->invalidateBalances()를 거쳐서만 바뀌므로 캐시가 그 사이에 낡을 일은 없다. 과거 회차를
  나중에 편집해 date가 캐시된 날짜 이하인 드문 경우만 기존처럼 전체 스캔으로 폴백한다. */
 const edits=r.edits;

 let latest=_lastEditCache.get(r);
 if(!latest){
  const keys=Object.keys(edits);
  if(!keys.length)return r.amount!=null?r.amount:null;

 return r.amount!=null?r.amount:null;
}

function debtsBehind(){

 return DB.assets.filter(a=>a.includeInTotal&&a.type==='debt'&&txns.some(t=>t.fromAssetId===a.id||t.toAssetId===a.id)).map(a=>{
   const pts=assetBalanceSeries(txns,a.id,assetBase(a),-1,dates);
   return{a,p:debtPayoffProjection(pts,TODAY)};

/* 같은 항목(key)은 상태가 유지되는 한 다시 알리지 않는다 — checkNotifyAlerts가 동기화 주기(수 분)마다
 * 반복 호출돼도 이미 보낸 이체/만기/예산 알림을 중복 발송하지 않기 위한 dedupe. */
function pickNotifyAlerts(alerts,notifiedIds){
 const toNotify=[],newIds={...notifiedIds};
 alerts.forEach(al=>{
  const info=notifyAlertInfo(al);
  if(!info||newIds[info.key])return;
  toNotify.push(info);newIds[info.key]=Date.now();
 });
 return{toNotify,notifiedIds:newIds};
}
/* notifiedIds는 키(이체 id·만기일·연월)가 계속 쌓이므로, 30일 지난 항목은 정리해 무한정 커지지 않게 한다 */
function pruneNotifiedIds(notifiedIds,now){
 const out={};
 Object.keys(notifiedIds||{}).forEach(k=>{if(now-notifiedIds[k]<30*24*60*60*1000)out[k]=notifiedIds[k]});
 return out;
}
/* DB.settings.osNotify가 켜져 있고 화면이 백그라운드(document.hidden)일 때만 실제로 알림을 보낸다 —

 * 완전 종료(특히 iOS Safari PWA)까지는 보장하지 못하고, 앱이 백그라운드/최소화된 동안만 동작하는

/* DB.settings.osNotify가 true로 남아있어도, 사용자가 나중에 OS/브라우저 설정에서 알림 권한을 꺼버리면

 * 조용히 멈추기만 하고 메뉴의 스위치는 계속 '켜짐'으로 보인다 — 부팅 시/포그라운드 복귀 시/주기 확인
 * 때마다 실제 권한과 다시 맞춰, 사용자가 꺼진 줄 모르고 계속 알림을 기다리지 않게 한다. */
function syncNotifyPermission(){
 if(!(DB&&DB.settings.osNotify))return;
 if(typeof Notification==='undefined'||Notification.permission==='granted')return;
 DB.settings.osNotify=false;save();renderCurrent();
 toast('브라우저 알림 권한이 꺼져서 OS 알림도 꺼졌어요');
}
function checkNotifyAlerts(){

 if(!(DB&&DB.settings.osNotify))return;
 if(typeof document!=='undefined'&&!document.hidden)return;
 if(!(typeof Notification!=='undefined'&&Notification.permission==='granted'))return;

  toNotify.forEach(n=>reg.showNotification(n.title,{body:n.body,tag:n.key,icon:'./icon-192.png',badge:'./icon-192.png'}));
 }).catch(()=>{});

/* announceLive: 토스트는 pointer-events:none인 시각적 요소라 스크린리더가 감지하지 못한다.
 * 화면엔 안 보이는 aria-live 리전에 같은 텍스트를 넣어 대신 읽어주게 한다. 같은 문구가
 * 연속으로 뜨면 텍스트가 안 바뀌어 재공지가 안 되므로 매번 비웠다가 다음 틱에 채운다. */
function announceLive(msg,assertive){const el=$(assertive?'ariaLiveAssertive':'ariaLivePolite');if(!el)return;
 el.textContent='';setTimeout(()=>{el.textContent=msg},30)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.innerHTML=svg('check')+`<span>${esc(msg)}</span>`;
 $('toastWrap').appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));announceLive(msg);
 setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},1900)}
/* toastFail: 저장/불러오기가 실제로 실패했을 때만 쓰는 경고 토스트. 성공 토스트보다 오래
 * 떠 있어야 사용자가 놓치지 않는다(save()가 화면 전환 직후 호출되는 경우가 많아서). */
function toastFail(msg){const t=document.createElement('div');t.className='toast fail';t.innerHTML=svg('alert')+`<span>${esc(msg)}</span>`;
 $('toastWrap').appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));announceLive(msg,true);
 setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},4500)}
function undoToast(msg,undoFn){const t=document.createElement('div');t.className='toast undo';
 t.innerHTML=svg('check')+`<span>${esc(msg)}</span>`;announceLive(msg);
 const btn=document.createElement('button');btn.className='toast-undo';btn.textContent='되돌리기';let done=false;
 const tm=setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),300)},6000);
 btn.onclick=()=>{if(done)return;done=true;clearTimeout(tm);t.classList.remove('show');setTimeout(()=>t.remove(),300);undoFn()};
 t.appendChild(btn);$('toastWrap').appendChild(t);requestAnimationFrame(()=>t.classList.add('show'))}

  * DB.txns에 없어 여기서 걸러지지 않음) — DB.recurrences는 전혀 안 바뀌므로 _recCache 보존

/* 오래된 데이터 정리(archiveMonthPicked) 실행부. deleteTxnsUndo()와 달리 cutoffDate 이전 거래를

 * 계산해 각 자산의 새 baseAmount/amountKRW로 앉힌다 — balancesUpTo()/assetBase()가 '기준값 +
 * RANGE_FROM부터의 전체 합'으로 잔액을 재생하는 구조라, 보정 없이 그냥 지우면 지운 거래들이
 * 쌓아온 금액이 통째로 사라진다(cycle221 critique가 발견한 함정). 반복거래는 DB.recurrences

 * baselines[a.id]가 현재 assetBase(a)와 같은(=실제로 안 바뀌는) 자산은 건드리지 않는다 — 특히
 * fx/stock/gold/crypto처럼 baseAmount/amountKRW를 안 쓰는 시세평가 자산에 쓸모없는 0 필드가
 * 새로 생기는 걸 막는다. */
function archiveTxnsBefore(cutoffDate){
 if(twGuard())return;

 const removed=DB.txns.filter(t=>t.date<=cutoffDate);
 const prevBase={};
 DB.assets.forEach(a=>{if(baselines[a.id]==null||baselines[a.id]===assetBase(a))return;
  prevBase[a.id]={baseAmount:a.baseAmount,amountKRW:a.amountKRW};

  * 흡수해놓고 반복 자체는 그대로 두면 같은 과거 회차가 다음 잔액 계산에서 또 더해져 이중
  * 계산된다(app-evolve cycle230 critique — cycle222가 연결한 archiveBaselines 경로에 반복거래
  * 테스트가 전혀 없어 놓친 공백). recArchiveStartDate()(logic.js)로 cutoffDate 이후 첫 회차로

  * 않는 과거 skip/edits/confirmedDates도 함께 정리한다. */

 (DB.recurrences||[]).forEach(r=>{
  if(r.active===false)return; /* expandRec도 비활성 반복은 애초에 전개하지 않으므로(베이스라인에 안 섞임) 손댈 필요 없음 */
  const newStart=recArchiveStartDate(r,cutoffDate);
  if(newStart===r.startDate)return;
  prevRec[r.id]={startDate:r.startDate,skip:r.skip,edits:r.edits,confirmedDates:r.confirmedDates};
  r.startDate=newStart;

 });

 save();renderCurrent();
 undoToast(`${removed.length}개의 오래된 내역을 정리했어요`,()=>{
  DB.assets.forEach(a=>{const p=prevBase[a.id];if(!p)return;a.baseAmount=p.baseAmount;a.amountKRW=p.amountKRW;touch(a)});

  DB.txns.push(...removed);removed.forEach(t=>delete DB.deletedIds[t.id]);
  save();renderCurrent();toast('되돌렸어요')});
}

/* 3패널 캐러셀 — 이전/현재/다음 달이 함께 미끄러짐 (달력·요약박스 공용) */
function monthSwipeCommitDir(dx,stepPx,cancelled){ /* 순수 함수: 스와이프 커밋 방향 판정. cancelled(touchcancel)이면 항상 취소 */
 if(cancelled)return null;
 if(Math.abs(dx)<=stepPx*0.15)return null;
 return dx>0?-1:1;
}
function wireMonthCarousel(viewport,which,onLabel){
 if(!viewport)return;
 if(viewport._c){if(viewport._align){viewport._align();requestAnimationFrame(viewport._align)}return}
 viewport._c=true;
 const T=()=>viewport.firstElementChild;if(!T())return;
 const step=()=>{const t=viewport.firstElementChild;const p=t&&t.children[0];
   if(!p)return viewport.clientWidth;
   const gap=parseFloat(getComputedStyle(p).marginRight)||0;
   return p.getBoundingClientRect().width+gap; /* 실측: 패널 폭 + 간격 */
 };
 const align=()=>{const t=viewport.firstElementChild;if(!t)return;
   t.style.transition='none';t.style.transform=`translateX(${-step()}px)`};
 viewport._align=align;
 align();                       /* 즉시 정렬 */
 requestAnimationFrame(align);  /* 레이아웃 확정 후 재정렬 */
 if(window.ResizeObserver){const ro=new ResizeObserver(()=>{if(!drag)align()});ro.observe(viewport)}
 let sx=0,sy=0,dx=0,drag=false,decided=false,horiz=false,shown=0,locked=false;
 const label=n=>{if(!onLabel)return;const c=curYM(which);const d=new Date(c.y,c.m-1+n,1);onLabel(d.getFullYear(),d.getMonth()+1)};
 viewport.addEventListener('touchstart',e=>{if(locked)return;
   sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;shown=0;
   drag=true;decided=false;horiz=false;T().style.transition='none'},{passive:true});
 viewport.addEventListener('touchmove',e=>{if(!drag)return;
   const cx=e.touches[0].clientX-sx,cy=e.touches[0].clientY-sy;
   if(!decided&&(Math.abs(cx)>8||Math.abs(cy)>8)){decided=true;horiz=Math.abs(cx)>Math.abs(cy)}
   if(!decided)return;
   if(!horiz){drag=false;align();label(0);return} /* 세로면 페이지 스크롤 양보 */
   if(e.cancelable)e.preventDefault();
   dx=cx;
   T().style.transform=`translateX(${-step()+dx}px)`;
   const n=Math.abs(dx)>step()*0.15?(dx>0?-1:1):0;
   if(n!==shown){shown=n;label(n)}
 },{passive:false});
 viewport.addEventListener('touchend',()=>{if(!drag)return;drag=false;
   if(!horiz)return;
   const dir=monthSwipeCommitDir(dx,step(),false);
   if(dir===null){const t=T();t.style.transition='transform .3s cubic-bezier(.32,.72,0,1)';
     t.style.transform=`translateX(${-step()}px)`;
     label(0);return}
   locked=true;label(dir);
   const t=T();t.style.transition='transform .32s cubic-bezier(.32,.72,0,1)'; /* iOS 감성 이징 */
   t.style.transform=`translateX(${-step()+(dir<0?step():-step())}px)`;
   if(navigator.vibrate)navigator.vibrate(8);
   let fired=false;
   const done=()=>{if(fired)return;fired=true;
     t.removeEventListener('transitionend',done);
     locked=false;
     monthStep(which,dir); /* 새 달 렌더 → 새 트랙은 즉시 제자리에 정렬됨(깜빡임 없음) */
   };
   t.addEventListener('transitionend',done);
   setTimeout(done,420); /* 안전망 (transitionend 누락 대비) */
 });
 viewport.addEventListener('touchcancel',()=>{if(!drag)return;drag=false;decided=false;horiz=false;
   /* 엣지 백제스처, 알림 배너, 전화 수신 등으로 touchend 없이 중단되는 경우 → 항상 취소하고 중앙으로 스냅백 */
   monthSwipeCommitDir(dx,step(),true);
   const t=T();t.style.transition='transform .3s cubic-bezier(.32,.72,0,1)';
   t.style.transform=`translateX(${-step()}px)`;
   label(0);
 });
}

function wireHdrFade(page){
 if(!page||page._hdrWired)return;page._hdrWired=true;
 const upd=()=>{const y=page.scrollTop;
   const o=Math.max(0,1-y/64); /* 64px 스크롤하면 완전히 사라짐 */
   page.style.setProperty('--hdr-o',o.toFixed(3));
   const h=page.querySelector('.hdr');if(h)h.style.pointerEvents=o<.15?'none':'';
 };
 page.addEventListener('scroll',()=>{if(!page._raf){page._raf=requestAnimationFrame(()=>{page._raf=null;upd()})}},{passive:true});
 upd();
}

}

async function boot(){
 migrateLegacy();
 if(SESSION&&!AUTH.exists(SESSION))AUTH.signOut();
 if(AUTH.current()||GUEST){
  /* 로컬 세션/게스트는 localStorage에 이미 완비된 DB가 있으므로 SDK_READY/getSession/pullCloud를
   * 전혀 기다리지 않고 곧장 그린다 — 느린 네트워크·콜드 서버리스 함수에서 최악 약 22초간
   * #bootSplash 스피너만 보이던 빈 화면을 없앤다(app-evolve cycle218 critique). 클라우드 체인은
   * bootCloudBg()로 분리해 화면 뒤 백그라운드에서 돌리고, pullCloudIfStale()과 동일한 비파괴
   * mergeRemoteDataIntoLocal() 병합으로 나중에 합류시킨다(이미 떠 있는 화면을 통째로 덮어쓰지
   * 않도록 — afterCloudAuth()의 무충돌 전량교체 분기는 로그인 '직후'(DB가 아직 없을 때) 전용이라
   * 여기선 쓰지 않는다). */
  startApp();if(APPLOCK.enabled())lockApp();
  bootCloudBg().catch(()=>{});
  return;
 }
 await SDK_READY; /* 최악의 경우에도 6초 내에 풀려남(위 loadScriptWithTimeout) — 로그인 화면은 보여줄
  * 로컬 데이터가 없어 기다려도 체감 지연이 없고, 카카오 로그인 버튼/비밀번호 재설정 리스너가 SDK
  * 로딩을 전제하므로 그대로 기다린다(sbReady/kakaoReady가 window.supabase/window.Kakao 존재를
  * 방어적으로 체크하므로, SDK 로딩이 실패/타임아웃됐어도 여기 아래 로직은 그대로 안전하다). */
 /* 로그인 전에도 PASSWORD_RECOVERY 리스너를 미리 바인딩해둬야, 다른 기기에서 재설정 메일 링크를
  * 열었을 때(이 기기엔 로컬 세션이 없을 수 있음) 새 비밀번호 설정 시트가 뜬다 */

}
/* boot()이 startApp()으로 로컬 데이터를 먼저 그린 뒤 호출하는 백그라운드 클라우드 동기화.
 * afterCloudAuth()와 달리 이 시점엔 DB가 이미 실제 로컬 데이터를 담고 있으므로, remote가 없거나
 * (네트워크 실패 포함) 가져오기 자체가 실패해도 afterCloudAuth()의 guestHasData()/emptyDB() 폴백처럼
 * DB를 건드리지 않는다 — 그 폴백은 로그인 '직후' DB가 아직 없는 경우만을 위한 것이라, 여기서 그대로
 * 타면 네트워크가 잠깐 끊겼을 뿐인데 게스트로 체험해본 적 있는 계정의 화면이 조용히 게스트 데이터로
 * 바뀌는 데이터 손실을 일으킨다. remote를 실제로 받았을 때만 pullCloudIfStale()과 똑같이
 * mergeRemoteDataIntoLocal()로 비파괴 병합하고, 시트가 열려 있으면(편집 중인 드래프트가 있을 수
 * 있음) pullCloudIfStale()과 동일한 원칙으로 이번엔 건드리지 않는다 — 다음 포그라운드 전환에서
 * pullCloudIfStale()이 그냥 다시 시도한다. */
async function bootCloudBg(){
 await SDK_READY;
 if(sbCfg().url)sbReady();
 if(!AUTH.current())return; /* GUEST는 클라우드가 없음 */
 const rec=AUTH.rec(AUTH.current());
 if(!(rec&&rec.cloud&&sbReady()))return;
 try{
  const{data}=await withTimeout(SB.auth.getSession());
  if(!(data&&data.session&&data.session.user))return;
  CLOUD_UID=data.session.user.id;
  measureCloudClockSkew(); /* best-effort, 결과는 홈 알림에 반영(await 안 함) */
  if($('sheet')&&$('sheet').classList.contains('show'))return;
  const remote=await pullCloud();
  if(!remote)return;
  mergeRemoteDataIntoLocal(sanitizeBackup(remote).data);
  save();
  if(appIsOpen())renderCurrent();
 }catch(e){}
}

function unlockApp(){
 APP_LOCKED=false;
 $('lockView').style.display='none';$('lockView').innerHTML='';
 $('app').style.display='';
 maybeRollDay(); /* 잠겨 있던 동안 넘어간 날짜/동기화를 지금 반영 */
}
function renderLockView(){
 const lock=AUTH._lockStatus(APPLOCK_FAIL_KEY);
 const bio=BIOUNLOCK.enabled();
 $('lockView').innerHTML=`<div class="auth-card">
   <div class="auth-logo">🔒</div>
   <div class="auth-title">잠겨 있어요</div>
   <div class="auth-sub">설정한 PIN을 입력해 주세요</div>
   ${bio?`<button type="button" class="btn btn-soft auth-bio" id="bioUnlockBtn" onclick="tryBioUnlock()">${svg('lock',18)}Face ID·지문으로 잠금 해제</button>`:''}
   <div class="auth-field"><label for="lockPinIn">PIN</label><div class="pw-wrap"><input id="lockPinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="PIN 입력" ${lock.locked?'disabled':''} onkeydown="if(event.key==='Enter')doUnlock()"><button type="button" class="pw-x" aria-label="PIN 표시" onclick="togglePwVis('lockPinIn')">${svg('eye',18)}</button></div></div>
   <div id="lockErr" class="auth-err" style="display:${lock.locked?'block':'none'}">${lock.locked?`너무 많이 틀렸어요 · ${lock.waitSec}초 후 다시 시도해 주세요`:''}</div>
   <button class="btn btn-primary auth-submit" id="lockSubmitBtn" ${lock.locked?'disabled':''} onclick="doUnlock()">확인</button>
   <button type="button" class="auth-forgot" onclick="openForgotPinSheet()">PIN을 잊으셨나요?</button>
 </div>`;
 if(lock.locked){clearTimeout(window._lockRetryT);window._lockRetryT=setTimeout(renderLockView,lock.waitSec*1000+200)}
 else setTimeout(()=>{const e=$('lockPinIn');e&&e.focus()},120);
 if(bio&&!_bioAutoTried){_bioAutoTried=true;tryBioUnlock()}
}
/* 생체 인증 실패/취소는 brute-force 카운터(AUTH._lockStatus)에 영향 없이 조용히 기존 PIN 입력으로
 * 폴백한다 — 이미 화면에 PIN 입력칸이 함께 떠 있으므로 에러 토스트조차 띄우지 않는다. */
async function tryBioUnlock(){
 const btn=$('bioUnlockBtn');if(btn&&btn.disabled)return;
 if(btn)btn.disabled=true;
 const r=await BIOUNLOCK.unlock();
 if(btn)btn.disabled=false;
 if(r.ok)unlockApp();
}
async function doUnlock(){
 const btn=$('lockSubmitBtn');if(btn&&btn.disabled)return;
 const pin=($('lockPinIn')&&$('lockPinIn').value)||'';
 if(btn)btn.disabled=true;
 const r=await APPLOCK.verify(pin);
 if(btn)btn.disabled=false;
 if(r.err){
  const e=$('lockErr');if(e){e.textContent=r.err;e.style.display='block'}
  const inp=$('lockPinIn');if(inp){inp.value='';inp.focus()}
  if(/^너무 많이/.test(r.err))renderLockView(); /* 잠김 상태로 재렌더(입력칸 disable+카운트다운) */
  return;
 }
 unlockApp();
}

async function doSetPin(){
 const btn=$('pinSetBtn');if(btn&&btn.disabled)return;
 const p1=($('pinNewIn')&&$('pinNewIn').value)||'',p2=($('pinNewIn2')&&$('pinNewIn2').value)||'';
 const errEl=$('pinSetErr');if(errEl)errEl.style.display='none';
 const showErr=m=>{if(errEl){errEl.textContent=m;errEl.style.display='block'}};
 if(!/^\d{4,6}$/.test(p1)){showErr('4~6자리 숫자로 입력해 주세요');const el=$('pinNewIn');if(el)el.focus();return}
 if(p1!==p2){showErr('PIN이 일치하지 않아요');const el=$('pinNewIn2');if(el){el.value='';el.focus()}return}
 if(btn)btn.disabled=true;
 await APPLOCK.setPin(p1);
 if(btn)btn.disabled=false;
 closeSheet();renderCurrent();toast('앱 잠금을 설정했어요');
}

const APPLOCK_GRACE_OPTS=[[0,'즉시 재잠금','백그라운드로 전환되면 바로 PIN을 요구해요'],[30,'30초 후','30초 안에 돌아오면 PIN 없이 계속 써요'],[60,'1분 후',''],[300,'5분 후','']];
function graceLabel(){const o=APPLOCK_GRACE_OPTS.find(x=>x[0]===APPLOCK.getGrace());return o?o[1]:'즉시 재잠금'}

 openSheet(`<h3>재잠금 시점</h3><div class="opt-list">${APPLOCK_GRACE_OPTS.map(([v,l,s])=>`<button class="${APPLOCK.getGrace()===v?'on':''}" onclick="setAppLockGrace(${v})"><span class="rd"></span><div><div>${l}</div>${s?`<div class="ol-sub">${s}</div>`:''}</div></button>`).join('')}</div>`);
}

/* PIN을 잊은 경우의 탈출구 — 복구 코드 개념이 없는 기기-로컬 전용 잠금이라, 이게 없으면
 * verify() 성공 없이는 영원히 #lockView에 막혀서 앱 잠금을 풀기 위해 사이트 데이터 전체를
 * 지워야 했다(이 기기에만 있는 자산 내역 전체가 함께 사라짐). PIN은 암호화 키가 아니라 단순
 * 기기-로컬 화면 잠금이라, 데이터는 건드리지 않고 APPLOCK만 초기화해도 안전하다
 * (app-evolve cycle151 develop).
 * 다만 질문 없이 확인 버튼 한 번으로 바로 풀리면 App-Lock이 막으려던 것(분실/도난 기기·동거인의
 * 무단 접근) 자체가 무력화된다. email 계정은 비밀번호가 있으므로 기존 로그인 검증(AUTH.signIn)을
 * 그대로 재사용해 복구 전에 본인 확인을 요구하고(데이터는 여전히 건드리지 않음 — 위 cycle151 보장
 * 유지), 비밀번호가 없는 guest/kakao 계정은 검증할 수단이 없어 최소한 즉시·무경고 우회만은
 * 막는 강제 대기 + 명시 경고로 대체한다(app-evolve cycle155 advance). */
function openForgotPinSheet(){
 if(accountKind()==='email'){
  openSheet(`<h3>PIN을 잊으셨나요?</h3>
   <div class="desc">PIN은 이 기기에만 저장돼 있어 복구 코드로 찾을 수 없어요. 계정 비밀번호를 확인하면 앱 잠금만 꺼지고, 저장된 자산 데이터는 그대로 남아요. 다시 잠그고 싶으면 메뉴 › 설정에서 새 PIN을 설정해 주세요.</div>

   <div id="fpinErr" class="auth-err" style="display:none"></div>
   <div class="two-btn" style="margin-top:14px"><button class="btn btn-soft cancel" onclick="closeSheet()">취소</button><button class="btn btn-primary" id="fpinBtn" onclick="doForgotPin()">잠금 초기화</button></div>`);
  setTimeout(()=>{const el=$('fpinPwIn');el&&el.focus()},120);
  return;
 }
 openSheet(`<h3>PIN을 잊으셨나요?</h3>
  <div class="desc">⚠️ 비밀번호가 없는 계정(게스트/카카오)이라 본인 확인을 할 수 없어요. <b>본인 기기일 때만</b> 계속하세요 — 다른 사람의 기기라면 지금 취소해 주세요. 초기화해도 앱 잠금만 꺼지고 저장된 자산 데이터는 그대로 남아요.</div>
  <div id="fpinWaitMsg" class="auth-err" style="display:block;color:var(--text-2)">${FPIN_WAIT_SEC}초 후 초기화할 수 있어요…</div>
  <div class="two-btn" style="margin-top:14px"><button class="btn btn-soft cancel" onclick="closeSheet()">취소</button><button class="btn btn-primary" id="fpinBtn" disabled onclick="doForgotPin()">잠금 초기화</button></div>`);
 tickForgotPinWait(FPIN_WAIT_SEC-1);
}
const FPIN_WAIT_SEC=5;
/* 비밀번호 없는 계정용 강제 대기 카운트다운. 매초 재귀 setTimeout으로 틱하며, 시트가 닫히거나
 * 다른 화면으로 교체돼 두 엘리먼트($('fpinWaitMsg')/$('fpinBtn'))가 더 이상 없으면 조용히
 * 멈춘다 — renderLockView의 지수 백오프 재시도 타이머와 같은 패턴. */
function tickForgotPinWait(left){
 const m=$('fpinWaitMsg'),b=$('fpinBtn');
 if(!m||!b)return;
 if(left<=0){m.textContent='이제 초기화할 수 있어요';b.disabled=false;return}
 m.textContent=`${left}초 후 초기화할 수 있어요…`;
 setTimeout(()=>tickForgotPinWait(left-1),1000);
}
async function doForgotPin(){
 if(accountKind()==='email'){
  const btn=$('fpinBtn');if(btn&&btn.disabled)return;
  const pw=($('fpinPwIn')&&$('fpinPwIn').value)||'';
  const errEl=$('fpinErr');if(errEl)errEl.style.display='none';
  if(btn)btn.disabled=true;
  const r=await AUTH.signIn(SESSION,pw);
  if(btn)btn.disabled=false;
  if(!r.ok){
   if(errEl){errEl.textContent=r.err||'비밀번호가 일치하지 않아요';errEl.style.display='block'}
   return;
  }
 }
 APPLOCK.disable();closeSheet();unlockApp();toast('앱 잠금을 초기화했어요');
}
function toggleAppLock(){
 if(APPLOCK.enabled())openDisableAppLockSheet();
 else openSetPinSheet();
}
/* 생체인증 토글은 PIN 토글(toggleAppLock)과 달리 끌 때 확인 절차가 없다 — 꺼도 PIN이라는
 * 실제 보안 계층은 그대로 남아 있어 보안이 약해지지 않는 순수 편의 설정이기 때문 */
async function toggleBioUnlock(){
 if(BIOUNLOCK.enabled()){BIOUNLOCK.disable();renderCurrent();toast('Face ID·지문 잠금 해제를 껐어요');return}
 const r=await BIOUNLOCK.register();
 if(r.err){toast(r.err);return}
 renderCurrent();toast('Face ID·지문으로 잠금을 해제할 수 있어요');
}

function doDeleteAccount(){
 const email=SESSION,kind=accountKind();
 const isCloudAcct=kind==='email'&&!!(AUTH.rec(email)&&AUTH.rec(email).cloud);
 const cloudNote=isCloudAcct?' 클라우드 로그인(이메일·비밀번호) 자체는 앱 권한으로는 지울 수 없어 남아있어요 — 완전히 없애려면 Supabase 대시보드에서 직접 사용자를 삭제해 주세요.':'';
 confirmSheet('계정 탈퇴',`${esc(accountName())} 계정의 모든 자산·내역·반복·설정이 영구히 삭제되고, 이 계정 자체도 지워져 같은 이메일로 다시 가입할 수 있게 돼요. 탈퇴 직후 잠깐 동안만 되돌릴 수 있어요.${cloudNote} 정말 탈퇴할까요?`,'탈퇴',()=>{
  const snapshot=DB;
  const acctSnapshot=AUTH.rec(email);const failsSnapshot=AUTH._fails()[emailKey(email)]||null;
  DB=emptyDB();migrate();save({deferCloudPush:true});closeSheet();ST.tab='home';go('home');
  const deleteT=setTimeout(async()=>{
   AUTH.deleteLocalAccountRecord(email);
   if(isCloudAcct){const r=await deleteCloudAccountData();if(r&&r.err)toast(r.err)}
   try{if(kind==='kakao'&&window.Kakao&&window.Kakao.Auth&&typeof window.Kakao.Auth.getAccessToken==='function'&&window.Kakao.Auth.getAccessToken())window.Kakao.Auth.logout(()=>{})}catch(e){}
   AUTH.signOut();GUEST=false;localStorage.setItem('asset_app_guest','0');showAuth();
  },6000);
  undoToast('계정을 탈퇴했어요',()=>{
   clearTimeout(deleteT);DB=snapshot;
   if(acctSnapshot){const a=AUTH._accts();a[emailKey(email)]=acctSnapshot;AUTH._write(a)}
   if(failsSnapshot){const f=AUTH._fails();f[emailKey(email)]=failsSnapshot;AUTH._writeFails(f)}
   save();renderCurrent();toast('되돌렸어요')
  })})}
