/* 달력 하루 칸 합계: monthStats2와 동일하게 잔액 조정(기본 제외) 규칙을 적용해야
   월 수지 카드(수입/지출/저축)와 날짜별 칸에 찍히는 숫자가 어긋나지 않는다 */
function dayTypeTotals(tx){
 let inn=0,ex=0,sv=0;
 tx.forEach(t=>{if(t.adjust&&!t.inSurplus)return;
  if(t.type==='income')inn+=t.amount;else if(t.type==='expense')ex+=t.amount;else if(t.type==='saving')sv+=t.amount});
 return {inn,ex,sv};
}
function calCellsFor(y,m,sel){
 const first=new Date(y,m-1,1),startDow=first.getDay(),daysIn=lastDay(y,m);
 const prevDays=lastDay(m===1?y-1:y,m===1?12:m-1);
 let cells='';
 for(let i=0;i<42;i++){let dnum,mm=m,other=false;
  if(i<startDow){dnum=prevDays-startDow+1+i;mm=m-1;other=true}
  else if(i>=startDow+daysIn){dnum=i-startDow-daysIn+1;mm=m+1;other=true}
  else dnum=i-startDow+1;
  let yy=y;if(mm<1){mm=12;yy--}if(mm>12){mm=1;yy++}
  const ds=`${yy}-${String(mm).padStart(2,'0')}-${String(dnum).padStart(2,'0')}`;
  const tx=other?[]:dayTxns(ds); /* 가계부는 예정 항상 포함 */
  const {inn,ex,sv}=dayTypeTotals(tx);
  const hasSch=tx.some(t=>txScheduled(t));
  const hasTr=tx.some(t=>t.type==='transfer');
  const cls=['cal-cell'];if(other)cls.push('other');if(ds===sel)cls.push('sel');if(ds===TODAY)cls.push('today');
  const lineCnt=(inn?1:0)+(ex?1:0)+(sv?1:0);if(lineCnt>=3)cls.push('three'); /* 3줄이면 폰트 축소 */
  cells+=`<div class="${cls.join(' ')}" ${other?'':`onclick="selDay('${ds}')"`}>
   ${hasSch?'<span class="dotp"></span>':''}${hasTr?'<span class="dott"></span>':''}<div class="d">${dnum}</div>
   <div class="cal-amts">${inn?`<div class="in num">+${abbr(inn)}</div>`:''}${ex?`<div class="ex num">-${abbr(ex)}</div>`:''}${sv?`<div class="sv num">${abbr(sv)}</div>`:''}</div></div>`;
 }
 return cells;
}

function renderLedger(){
 const {y,m,sel}=ST.ledger;const S=monthStats(y,m);
 const first=new Date(y,m-1,1),startDow=first.getDay(),daysIn=lastDay(y,m),prevDays=lastDay(m===1?y-1:y,m===1?12:m-1);
 let cells='';
 for(let i=0;i<42;i++){let dnum,mm=m,other=false;

/* ── 반복 종료조건(선택): [종료일][횟수] 두 박스 한 줄, 양방향 자동 계산 ──────
   pfx='tx'(내역 입력 반복) 또는 'rec'(반복 설정 편집) */
function endCondFields(d,pfx){
 const start=d.startDate||d.date;
 const base={freq:d.freq,day:d.day,startDate:start,weekend:d.weekend};
 const cnt=(d.count!=null&&d.count!=='')?d.count:(d.endDate?recCountUntil(base,d.endDate):'');
 const has=!!(d.endDate||cnt);
 const hint=(d.endDate&&cnt)?`${fmtDateFull(d.endDate)}까지 총 ${cnt}번 반복돼요`:'종료일이나 횟수 중 하나만 넣으면 나머지가 자동 계산돼요';
 return `<div class="field"><label>종료조건 (선택)</label>

   <button class="end-box ${d.endDate?'':'placeholder'}" id="${pfx}EndDateBox" onclick="${pfx}OpenEnd()">${d.endDate?d.endDate.replace(/-/g,'.'):'종료일'}</button>
   <input class="end-box num" id="${pfx}CountBox" inputmode="numeric" value="${cnt||''}" placeholder="횟수" oninput="${pfx}Count(this.value)">
  </div>
  <div class="end-foot"><span class="psub" id="${pfx}EndHint">${hint}</span>${has?`<button class="txt-btn" onclick="${pfx}ClearEnd()">지우기</button>`:''}</div>
 </div>`;
}
/* 횟수 입력 → 종료일 실시간 반영 (재렌더 없이 DOM만 갱신, 포커스 유지) */
function _applyCount(pfx,draft,v,rerender){
 const n=Math.min(999,Math.max(0,Number(String(v).replace(/[^0-9]/g,''))||0));
 draft.count=n||null;
 const ed=n>=1?recNthDate({freq:draft.freq,day:draft.day,startDate:draft.startDate||draft.date,weekend:draft.weekend},n):null;
 draft.endDate=ed;
 const box=$(pfx+'EndDateBox');if(box){box.textContent=ed?ed.replace(/-/g,'.'):'종료일';box.classList.toggle('placeholder',!ed)}

 if(!d.id&&d.repeat){ /* 반복 ON → 반복 항목으로 저장 (일회성 내역 대신) */

  if(freq==='monthly'){const m=clampDay(d);if(m)toast(m)}

  const base={freq,day,startDate:d.date,weekend:d.weekend};
  let endDate=d.endDate||null,count=d.count||null;
  if(endDate&&!count)count=recCountUntil(base,endDate);
  else if(count&&!endDate)endDate=recNthDate(base,count);
  DB.recurrences.push({id:uid(),active:true,type:d.type,category:cat,memo:d.memo||cat,amount:d.amount,
   fromAssetId:d.fromAssetId,toAssetId:d.toAssetId,freq,day,startDate:d.date,endDate,count,

  save();closeSheet();renderCurrent();toast('반복 내역으로 저장했어요');return;
 }
 ['repeat','freq','day','endDate','endMode','count'].forEach(k=>delete d[k]); /* 일회성 내역엔 반복 필드 제거 */
 if(d.type==='transfer'&&d.confirmed===undefined)d.confirmed=!(DB.settings.confirmTransfers&&isFuture(d.date));
 if(d.id){const i=DB.txns.findIndex(x=>x.id===d.id);DB.txns[i]=d}else{d.id=uid();DB.txns.push(d)}
 save();closeSheet();renderCurrent();toast(isFuture(d.date)?'예정 내역으로 저장했어요':'내역을 저장했어요');
}

function recApply(recId,date,mode,scope){
 if(twGuard())return;
 const r=DB.recurrences.find(x=>x.id===recId);
 if(mode==='delete'){
  if(scope==='one'){
   const prevSkip=r.skip.slice();r.skip.push(date);save();closeSheet();renderCurrent();
   undoToast('삭제했어요',()=>{r.skip=prevSkip;save();renderCurrent();toast('되돌렸어요')});return;
  }
  if(scope==='future'){
   const prevEnd=r.endDate;r.endDate=addDays(date,-1);save();closeSheet();renderCurrent();
   undoToast('삭제했어요',()=>{r.endDate=prevEnd;save();renderCurrent();toast('되돌렸어요')});return;
  }

 }
 const ed=(r.edits||{})[date]||{};
 _formScroll=0;
 txDraft={id:null,type:r.type,date,category:r.category,memo:ed.memo!=null?ed.memo:r.memo,amount:ed.amount!=null?ed.amount:r.amount,fromAssetId:r.fromAssetId,toAssetId:r.toAssetId};

 const ctx=window._recCtx;if(!ctx)return;const r=DB.recurrences.find(x=>x.id===ctx.recId);
 const amt=num($('txAmt'));if(!amt){toast('금액을 입력해 주세요');return}
 let undoFn;
 if(ctx.scope==='one'){
  const edits=(r.edits=r.edits||{});const prevEdit=edits[ctx.date];edits[ctx.date]={amount:amt};
  undoFn=()=>{if(prevEdit===undefined)delete edits[ctx.date];else edits[ctx.date]=prevEdit;save();renderCurrent();toast('되돌렸어요')};
 }
 else if(ctx.scope==='future'){
  const prevEnd=r.endDate,prevCount=r.count;r.endDate=addDays(ctx.date,-1);
  r.count=recCountUntil({freq:r.freq,day:r.day,startDate:r.startDate,weekend:r.weekend},r.endDate); /* 잘린 원래 반복도 endDate와 count를 항상 함께 맞춰둔다(다른 저장 경로들과 동일한 불변식) */
  const newBase={freq:r.freq,day:r.day,startDate:ctx.date,weekend:r.weekend};
  const newRec=Object.assign({},JSON.parse(JSON.stringify(r)),{id:uid(),startDate:ctx.date,endDate:prevEnd,count:prevEnd?recCountUntil(newBase,prevEnd):null,amount:amt,skip:[],edits:{}});
  DB.recurrences.push(newRec);
  undoFn=()=>{r.endDate=prevEnd;r.count=prevCount;DB.recurrences=DB.recurrences.filter(x=>x.id!==newRec.id);save();renderCurrent();toast('되돌렸어요')};
 }
 else{
  const prevAmt=r.amount;r.amount=amt;
  undoFn=()=>{r.amount=prevAmt;save();renderCurrent();toast('되돌렸어요')};
 }
 window._recCtx=null;save();closeSheet();renderCurrent();
 undoToast('반복 내역을 수정했어요',undoFn);
}

 d.memo=(d.memo||'').trim()||d.category; /* 메모 없으면 카테고리로 */

function matchTxnQuery(t,q,assets){
 if(!q)return true;
 const fa=(assets||[]).find(a=>a.id===t.fromAssetId),ta=(assets||[]).find(a=>a.id===t.toAssetId);
 const hay=(t.memo||'')+' '+t.category+' '+(fa?fa.name:(t.fromAssetName||'—'))+' '+(ta?ta.name:(t.toAssetName||'—'));

}

 let run=balanceAt(assetId,addDays(st,-1));
 const byDay={};
 allTxns(st,en).forEach(t=>{
  if(t.fromAssetId!==assetId&&t.toAssetId!==assetId)return;
  const d=(t.toAssetId===assetId?t.amount:0)-(t.fromAssetId===assetId?t.amount:0);
  byDay[t.date]=(byDay[t.date]||0)+d;
 });
 let low=run,lowDate=st;

 return {date:lowDate,amount:low};
}

function renderPlan(){
 const cashAssets=DB.assets.filter(a=>isPlanAcct(a)&&(ST.plan.owner==='전체'||a.owner===ST.plan.owner));
 if(!ST.plan.assetId||!cashAssets.find(a=>a.id===ST.plan.assetId))ST.plan.assetId=cashAssets[0]?cashAssets[0].id:null;
 const a=DB.assets.find(x=>x.id===ST.plan.assetId);
 const {y,m}=ST.plan;
 const mStart=monthStartStr(y,m),mEnd=monthEndStr(y,m);
 let rows='';
 if(a){
  const startBal=balanceAt(a.id,addDays(mStart,-1));
  const flows=[];
  allTxns(mStart,mEnd).forEach(t=>{
   if(t.fromAssetId!==a.id&&t.toAssetId!==a.id)return;
   const delta=(t.toAssetId===a.id?t.amount:0)-(t.fromAssetId===a.id?t.amount:0);
   flows.push({t,delta});
  });
  flows.sort((x,z)=>x.t.date<z.t.date?-1:x.t.date>z.t.date?1:0);
  const dates=[...new Set(flows.map(f=>f.t.date))];
  if(y===TM.y&&m===TM.m&&!dates.includes(TODAY))dates.push(TODAY);
  dates.sort();
  let r=startBal;
  let firstNegIdx=-1; /* 잔액이 처음 마이너스가 되는 날 인덱스 */
  const dayNeg=[]; /* 날짜별 실제 잔액 마이너스 여부 */
  {let rr=startBal;dates.forEach((d,i)=>{rr+=flows.filter(f=>f.t.date===d).reduce((s,f)=>s+f.delta,0);dayNeg[i]=rr<0;if(rr<0&&firstNegIdx<0)firstNegIdx=i;});}
  rows=dates.length?dates.map((d,i)=>{
   const dayFlows=flows.filter(f=>f.t.date===d);
   r+=dayFlows.reduce((s,f)=>s+f.delta,0);
   const bal=r;
   const isToday=d===TODAY;
   const zone=dayNeg[i]?(i===firstNegIdx?'danger danger-start':'danger'):''; /* 실제 마이너스인 날만 빨강 */
   const items=dayFlows.length?dayFlows.map(f=>{const t=f.t;
    const faN=assetNm(t.fromAssetId,t.fromAssetName),taN=assetNm(t.toAssetId,t.toAssetName);
    const flow=t.type==='income'?(taN!=='—'?taN:''):(t.type==='transfer'||t.type==='saving')?`${faN==='—'?'':faN}→${taN==='—'?'':taN}`:(faN!=='—'?faN:'');
    return `<div class="flow-item" onclick="planTap('${t.isRec?'':t.id}','${t.isRec?t.recId:''}','${t.date}')">
     <div class="avatar ${f.delta>=0?'a-in':'a-food'}" style="width:40px;height:40px">${svg(f.delta>=0?'arrowUp':'arrowDn')}</div>
     <div style="flex:1;min-width:0"><div class="nm-row"><span class="nm">${esc(t.memo||t.category)}</span>${t.isRec?`<span class="rec-ic" title="반복">${svg('repeat')}</span>`:''}</div>${flow?`<div class="flow-sub"><span class="fl">${esc(flow)}</span></div>`:''}</div>
     <div class="rt"><div class="delta num ${f.delta>=0?'pos':'minus'}">${f.delta>=0?'+':'-'}${comma(Math.abs(f.delta))}원</div></div></div>`;
   }).join(''):`<div class="plan-noflow">오늘은 통장이 평화로워요 🌱</div>`;
   return `<div class="plan-day${isToday?' today':''} ${zone}" data-d="${d}"><div class="card plan-card${bal<0?' neg':''}"><div class="plan-day-head${bal<0?' neg':''}">
     <div class="pd-date">${shortDate(d)}${isToday?' <span class="pd-today">오늘</span>':''}${isFuture(d)?' <span class="mini sch">예정</span>':''}${bal<0?` <span class="pd-bell">${svg('bell')}</span>`:''}</div>
     <div class="pd-bal num ${bal<0?'minus':''}"><span class="pl">잔액</span>${comma(bal)}원</div></div>${items}</div></div>`;
  }).join(''):`<div class="empty"><div class="ei">${svg('ledger')}</div><div class="et">${m}월은 통장이 평화로워요</div><div class="es">예정된 이체도, 나갈 돈도 없어요</div></div>`;
 }
 const endBal=a?balanceAt(a.id,mEnd):0;
 $('page-plan').innerHTML=`
 ${pageHead('plan')}
 ${monthNav('plan',`${y}년 ${m}월`)}
 <div class="filter-2">
   <button onclick="openPlanAsset()"><span class="fk">통장</span><span class="fv">${a?a.name:'없음'} ${svg('chevD')}</span></button>
 </div>
 <div class="mc-viewport" id="planVP"><div class="mc-track">
   ${planBalCard(m===1?y-1:y, m===1?12:m-1, a)}
   ${planBalCard(y,m,a,true)}
   ${planBalCard(m===12?y+1:y, m===12?1:m+1, a)}
 </div></div>
 <div class="plan-list">${rows}</div><div style="height:8px"></div>`;
 wireMonthCarousel($('planVP'),'plan',(yy,mm)=>setNavLabel('plan',yy,mm));
 requestAnimationFrame(fitAll);
}

function spendByCategory(y,m){ /* 지출 분석은 항상 예정 포함 */
 const map={};
 allTxns(monthStartStr(y,m),monthEndStr(y,m)).forEach(t=>{
   if(t.type!=='expense')return;if(t.adjust&&!t.inSurplus)return; /* 잔액 조정: 항목별 포함 설정(기본 제외) */
   map[t.category]=(map[t.category]||0)+t.amount;
 });
 return Object.entries(map).map(([c,v])=>({c,v})).sort((a,b)=>b.v-a.v);
}
/* budget=0(미설정)이면 진행률은 의미가 없으므로 항상 0으로 clamp — 호출부는 이 경우 전체 대비 비중을 대신 쓴다 */
function budgetProgress(spent,budget){
 if(!budget)return{pct:0,barPct:0,over:false};
 const ratio=spent/budget;
 return{pct:Math.round(ratio*100),barPct:Math.min(100,ratio*100),over:spent>budget};
}
/* 예산이 설정된 카테고리만 골라 이번 달 전체 예산 대비 지출을 집계 — 예산이 하나도 없으면 budgetedTotal=0으로 '집계할 게 없음'을 나타낸다 */
function totalBudgetSummary(rows,budgets){
 budgets=budgets||{};
 let budgetedTotal=0,spentOnBudgeted=0,overCount=0,unsetCount=0;
 rows.forEach(r=>{
  const b=budgets[r.c]||0;
  if(b){budgetedTotal+=b;spentOnBudgeted+=r.v;if(r.v>b)overCount++}
  else unsetCount++;
 });

  ${tb.budgetedTotal?`<div class="card" style="text-align:center;padding:16px;margin-bottom:12px">

/* 카테고리 관리 — 지출/수입/저축 */
const CAT_LABEL={expense:'지출',income:'수입',saving:'저축'};
/* ── 카테고리 아이콘(라인 픽토그램) ────────────────────────────────────────────
   카테고리는 문자열 이름으로 저장하고, 선택한 아이콘 키는 '타입:이름' 병렬 맵에 둔다.
   지정이 없으면 기존 기본 아이콘(CATICON) → fallback 순으로 렌더. (데이터 비파괴) */
const catKey=(type,name)=>type+':'+name;
function catIconOf(type,name){return (DB.catIcon&&DB.catIcon[catKey(type,name)])||''}
function isVarCat(type,name){return !!(DB.catVar&&DB.catVar[catKey(type,name)])} /* 변동 카테고리 여부 */
function setCatVar(type,name,on){if(on)DB.catVar[catKey(type,name)]=true;else delete DB.catVar[catKey(type,name)]}
function recIsVarying(r){return (r.type==='expense'||r.type==='income')&&isVarCat(r.type,r.category)}
function toggleCatVarUI(k,i,btn){const c=DB.categories[k][i];const on=!isVarCat(k,c);setCatVar(k,c,on);save();
 if(btn){btn.classList.toggle('on',on);btn.textContent=on?'변동':'고정'}else openCatManage(k)}
function catGlyph(type,name,size,fallbackIcon){
 const key=catIconOf(type,name)||CATICON[name]||fallbackIcon||'tag';
 return svg(key,size);
}
/* 타입별로 어울리는 기호만 노출 (통일성). 기본 아이콘도 포함되어 선택 가능 */
const CAT_ICON_SET={
 expense:['food','restaurant','coffee','cart','house','car','bus','fuel','phone','bolt','droplet','shirt','scissors','health','ticket','film','game','plane','pet','baby','gcap','book','heart','cake','gift','receipt','repeat','users','wallet','tag'],
 income:['briefcase','arrowUp','chart','coins','bank','house','gift','heart','wallet','plus','tag'],
 saving:['piggy','bank','lock','calendar','target','shield','house','seedling','coins','bell','gift','tag']
};
let _iconCb=null,_iconCancel=null;
function openIconPicker(type,current,cb,onCancel){_iconCb=cb;_iconCancel=onCancel||null;
 let keys=CAT_ICON_SET[type]||CAT_ICON_SET.expense;
 if(current&&!keys.includes(current))keys=[current,...keys];
 const cells=keys.map(k=>`<button class="icon-cell${k===current?' on':''}" onclick="pickCatIcon('${k}')">${svg(k,22)}</button>`).join('');
 openSheet(`<h3>아이콘 선택</h3><div class="desc">${CAT_LABEL[type]||''} 카테고리에 어울리는 기호를 골라요</div>
  <div class="icon-grid">${cells}</div>
  <div class="two-btn" style="margin-top:14px"><button class="btn btn-soft" onclick="iconPickerCancel()">취소</button></div>`);
}
function pickCatIcon(k){const cb=_iconCb;_iconCb=null;_iconCancel=null;if(cb)cb(k)}
function iconPickerCancel(){const c=_iconCancel;_iconCb=null;_iconCancel=null;if(c)c()}
let catAddDraft={name:'',icon:''};
let catRenameDraft={name:'',icon:''};
function pickCatAddIcon(k){openIconPicker(k,catAddDraft.icon||'',ic=>{catAddDraft.icon=ic;openCatManage(k,true)},()=>openCatManage(k,true))}
function pickCatRenameIcon(k,i){openIconPicker(k,catRenameDraft.icon||'',ic=>{catRenameDraft.icon=ic;renameCatSheet(k,i,true)},()=>renameCatSheet(k,i,true))}
function openCatManage(kind,keep){
 const k=['expense','income','saving'].includes(kind)?kind:'expense';
 if(!keep)catAddDraft={name:'',icon:''};
 const avCls=k==='income'?'a-in':k==='saving'?'a-save':'a-food';
 const trigIcon=catAddDraft.icon||(k==='income'?'arrowUp':k==='saving'?'piggy':'tag');
 openSheet(`<h3>카테고리 관리</h3><div class="desc">${k==='saving'?'아이콘과 이름으로 추가해요.':'‘변동’은 매달 금액이 달라지는 항목이에요.'}</div>
  <div class="seg"><div class="seg-blob"></div>${['expense','income','saving'].map(x=>`<button class="${k===x?'on':''}" onclick="openCatManage('${x}')">${CAT_LABEL[x]}</button>`).join('')}</div>
  <div>${DB.categories[k].map((c,i)=>{
    const isSysAdjust=k==='income'&&c===ADJUST_CAT; /* 거래에서 자동 생성되는 시스템 카테고리 — 이름변경/삭제 못 하게 액션 대신 안내만 보여준다 */
    const varPill=k==='saving'?'':`<button class="varpill ${isVarCat(k,c)?'on':''}" onclick="toggleCatVarUI('${k}',${i},this)">${isVarCat(k,c)?'변동':'고정'}</button>`;
    const acts=isSysAdjust?`<span class="mini">자동 생성</span>`:`<div class="row-acts"><button class="act-btn" onclick="renameCatSheet('${k}',${i})">${svg('edit')}</button><button class="act-btn danger" onclick="delCat('${k}',${i})">${svg('trash')}</button></div>`;
    return `<div class="manage-row"><div class="avatar ${avCls}" style="width:36px;height:36px;border-radius:11px">${catGlyph(k,c,18,'tag')}</div><div class="mn">${esc(c)}</div>${isSysAdjust?'':varPill}${acts}</div>`;
   }).join('')}</div>
  <div class="add-inline"><button class="emo-pick ${avCls}" onclick="pickCatAddIcon('${k}')" aria-label="아이콘 선택">${svg(trigIcon,20)}</button><input id="newCat" placeholder="새 ${CAT_LABEL[k]} 카테고리" value="${catAddDraft.name.replace(/"/g,'&quot;')}" oninput="catAddDraft.name=this.value"><button onclick="addCat('${k}')">${svg('plus')}</button></div>
  <div style="height:14px"></div><button class="btn btn-primary" onclick="closeSheet()">완료</button>`);
}
function addCat(k){const v=(($('newCat')&&$('newCat').value)||catAddDraft.name||'').trim();if(!v)return;
 if(DB.categories[k].includes(v)){toast('이미 있는 카테고리예요');return}
 DB.categories[k].push(v);
 if(catAddDraft.icon)DB.catIcon[catKey(k,v)]=catAddDraft.icon;

function delCat(k,i){const c=DB.categories[k][i];
 confirmSheet('카테고리 삭제',`'${esc(c)}' 카테고리를 삭제할까요? 기존 내역의 카테고리명은 그대로 남아요.`,'삭제',()=>{doDeleteCat(k,i);save();openCatManage(k)});}
function doDeleteCat(k,i){const c=DB.categories[k][i];
 if(k==='income'&&c===ADJUST_CAT){toast('자동으로 생성되는 카테고리라 삭제할 수 없어요');return}
 DB.categories[k].splice(i,1);
 delete DB.catIcon[catKey(k,c)];              /* 삭제 시 아이콘/변동/예산도 함께 정리 (동명 카테고리 재생성 시 이전 설정이 남지 않도록) */
 delete DB.catVar[catKey(k,c)];
 if(k==='expense'&&DB.budgets&&c in DB.budgets)delete DB.budgets[c];
}
function renameCatSheet(k,i,keep){const cur=DB.categories[k][i];
 if(!keep)catRenameDraft={name:cur,icon:catIconOf(k,cur)||CATICON[cur]||'tag'};

 openSheet(`<h3>카테고리 수정</h3><div class="desc">아이콘과 이름을 바꿀 수 있어요. 이 카테고리로 저장된 기존 내역도 함께 반영돼요.</div>
  <div class="cat-edit-row"><button class="emo-pick lg ${avCls}" onclick="pickCatRenameIcon('${k}',${i})" aria-label="아이콘 선택">${svg(catRenameDraft.icon||'tag',24)}</button><input id="renameCat" value="${catRenameDraft.name.replace(/"/g,'&quot;')}" oninput="catRenameDraft.name=this.value" placeholder="카테고리 이름"></div>
  <div class="two-btn"><button class="btn btn-soft cancel" onclick="openCatManage('${k}')">취소</button><button class="btn btn-primary" onclick="doRenameCat('${k}',${i})">저장</button></div>`);
 setTimeout(()=>{const el=$('renameCat');el&&el.focus()},300)}
function doRenameCat(k,i){const v=((catRenameDraft.name!=null?catRenameDraft.name:($('renameCat')&&$('renameCat').value))||'').trim();if(!v){toast('이름을 입력해 주세요');return}
 const old=DB.categories[k][i];
 if(k==='income'&&old===ADJUST_CAT){toast('자동으로 생성되는 카테고리라 이름을 바꿀 수 없어요');return}
 if(v!==old&&DB.categories[k].includes(v)){toast('이미 있는 카테고리예요');return}
 const ic=catRenameDraft.icon||'';
 const wasVar=isVarCat(k,old);
 delete DB.catIcon[catKey(k,old)];            /* 이름 변경 시 아이콘 키도 이동 */
 if(ic)DB.catIcon[catKey(k,v)]=ic;
 delete DB.catVar[catKey(k,old)];             /* 이름 변경 시 '변동' 카테고리 플래그도 이동 */
 if(wasVar)DB.catVar[catKey(k,v)]=true;
 if(v!==old){
  DB.categories[k][i]=v;
  DB.txns.forEach(t=>{if(t.type===k&&t.category===old)t.category=v});
  DB.recurrences.forEach(r=>{if(r.type===k&&r.category===old){r.category=v;if(r.memo===old)r.memo=v}});
  if(k==='expense'&&DB.budgets&&old in DB.budgets){DB.budgets[v]=DB.budgets[old];delete DB.budgets[old]} /* 이름 변경 시 예산 한도도 함께 이동 */
 }
 save();renderCurrent();openCatManage(k);toast('카테고리를 수정했어요')}

/* 거래 내역 CSV — 순수 함수(DOM/DB 전역 참조 없음), 자산명은 assets 배열로 조회 */
function txnsToCSV(txns,assets){
 const typeLabel={expense:'지출',income:'수입',transfer:'이체',saving:'저축'};
 const nm=(id,snap)=>{const a=(assets||[]).find(x=>x.id===id);return a?a.name:(snap||'')};
 const esc=v=>{const s=String(v==null?'':v);return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const header=['날짜','구분','카테고리','금액','보내는 자산','받는 자산','메모'].map(esc).join(',');
 const rows=(txns||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).map(t=>[
  t.date,typeLabel[t.type]||t.type||'',t.category||'',t.amount,
  nm(t.fromAssetId,t.fromAssetName),nm(t.toAssetId,t.toAssetName),t.memo||''
 ].map(esc).join(','));
 return '\ufeff'+[header,...rows].join('\r\n');
}

    <div class="pc">${svg('chev')}</div></button>`);

async function doExport(mode,kind){
 const isCsv=kind==='csv';
 const d=new Date();const pad=n=>String(n).padStart(2,'0');
 const stamp=`${String(d.getFullYear()).slice(2)}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
 const name=isCsv?`history_${stamp}.csv`:`backup_${stamp}.json`;
 const text=isCsv?txnsToCSV(DB.txns,DB.assets):JSON.stringify(DB,null,2);
 const mime=isCsv?'text/csv':'application/json';
 /* CSV는 복원용 백업이 아니므로 백업 알림 상태(lastExport/backupSnooze)를 건드리지 않는다 */
 const done=msg=>{if(!isCsv){DB.settings.lastExport=Date.now();DB.settings.backupSnooze=0;save();renderCurrent();}toast(msg)};
 const copyFallback=reason=>openCopyBackup(text,reason,isCsv?{title:'거래 내역 데이터 복사',note:'스프레드시트 앱에서 열 때는 이 내용을 .csv 파일로 저장해 불러오면 돼요.'}:null);

 /* 1) 공유 시트 — 되면 이게 가장 확실 */
 if(mode==='share'){
  try{
   const file=new File([text],name,{type:mime});
   await navigator.share({files:[file],title:isCsv?'거래 내역 CSV':'우리의 자산 백업'});
   done(isCsv?'CSV 파일을 저장했어요':'백업 파일을 저장했어요');
   return;
  }catch(e){
   if(e&&e.name==='AbortError')return; /* 사용자가 취소 */
   copyFallback('공유가 막혀 있어요.'); /* 인앱 브라우저 등 */
   return;
  }
 }

 /* 2) 파일 열기/다운로드 */
 const blob=new Blob([text],{type:mime});
 const url=URL.createObjectURL(blob);
 try{
  if(IS_IOS){
   /* iOS는 download 속성을 무시하고 파일을 미리보기로 엽니다.
      새 창이 차단되면(인앱 브라우저 등) 곧바로 복사 방식으로 안내합니다. */
   const w=window.open(url,'_blank');
   if(!w||w.closed||typeof w.closed==='undefined'){
    URL.revokeObjectURL(url);
    copyFallback('파일 열기가 차단됐어요.');
    return;
   }
   done('파일이 열렸어요 · 공유 버튼으로 저장하세요');
  }else{
   const a=document.createElement('a');
   a.href=url;a.download=name;
   document.body.appendChild(a);a.click();a.remove();
   done(`${name} 으로 내보냈어요`);
  }
  setTimeout(()=>URL.revokeObjectURL(url),20000);
 }catch(e){
  URL.revokeObjectURL(url);
  copyFallback('파일로 저장할 수 없어요.');
 }
}

/* obj.assets/obj.txns가 배열인지까지 검증한 뒤 DB를 통째로 교체한다. migrate()가 손상된
 * obj 때문에 중간에 throw해도 DB가 절반만 마이그레이션된 채로 남지 않도록, 실패 시 교체 전
 * 스냅샷(prev)으로 되돌리고 그 에러를 다시 던진다. 성공하면 되돌리기(undo)용으로 prev를 반환한다. */
function restoreBackup(obj){
 if(!obj||!Array.isArray(obj.assets)||!Array.isArray(obj.txns))throw new Error('invalid backup');
 const prev=JSON.parse(JSON.stringify(DB));
 DB=obj;
 try{migrate()}catch(e){DB=prev;throw e}
 return prev;
}

   save();invalidateBalances();renderCurrent();

  });

 r.readAsText(f);
});

function onSheetKeydown(e){

 if(e.key==='Tab'){
   const f=sheetFocusables(sh);if(!f.length)return;
   const first=f[0],last=f[f.length-1];
   if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}

   else if(!sh.contains(document.activeElement)){e.preventDefault();first.focus()}

/* ── 애플식 시트 제스처: 스크롤 컨테이너와 분리된 껍데기에서 처리 ────────────── */

 const moveClose=e=>{if(sh._anim)return;const p=e.touches[0];dx=p.clientX-x0;dy=p.clientY-y0;
   if(mode===null){
     if(atTop&&dy>8&&dy>Math.abs(dx)){mode='close';sh._drag=true;sh.style.transition='none'}
     else if(Math.abs(dy)>6){mode='scroll'}
   }
   if(mode==='close'){sh.style.transform=`translateY(${Math.max(0,dy)}px)`;if(e.cancelable)e.preventDefault()}};

/* ── 왼쪽 엣지 뒤로가기: body 고정 요소라 시트를 다시 그려도 파괴되지 않음 ────── */

   const b=window._pkBack;if(!b)return null;
   const sc=$('sheetScroll');const curHTML=sc?sc.innerHTML:'';const curTop=sc?sc.scrollTop:0;
   window._pkBack=null;b();const rsc=$('sheetScroll');const inHTML=rsc.innerHTML;const inTop=rsc?rsc.scrollTop:0;

   sh.parentNode.insertBefore(pv,sh); /* 시트 바로 뒤(아래 z), 최종 위치에 고정 */
   pv.dataset.top=inTop;const pvsc=pv.querySelector('.sheet-scroll');if(pvsc)pvsc.scrollTop=inTop; /* 이전 화면 스크롤 복원 */

   if(!sh||!sh.classList.contains('show')||sh._anim){x0=null;return}
   const p=e.touches[0];x0=p.clientX;y0=p.clientY;dx=0;dy=0;act=false;prev=null;W=sh.clientWidth||1;},{passive:true});

   const p=e.touches[0];dx=p.clientX-x0;dy=p.clientY-y0;
   if(!act){if(dx>6&&dx>Math.abs(dy)){act=true;sh.style.transition='none';scrim=$('scrim');

       if(prev&&b){ /* 제자리의 이전 화면을 그대로 시트로 승격 (모션 없음) */

         cleanupPrev();
         const nsc=$('sheetScroll');applyHeight(sh,nsc);attachDetent(sh,nsc);wireSheetGestures(sh,nsc);nsc.scrollTop=ptop;requestAnimationFrame(()=>{try{moveSegBlobs()}catch(e){}});
         setTimeout(()=>{if(sh.classList.contains('show')&&!sh.contains(document.activeElement)){const f=sheetFocusables(sh)[0];if(f)f.focus();else sh.focus()}},50);
       }else{sh.style.transition='none';sh.style.transform='';cleanupPrev();closeSheet();}

 edge.addEventListener('touchend',up);edge.addEventListener('touchcancel',up);
}function closeSheet(){const sh=$('sheet');sh.style.transition='';sh.style.transform='';sh.style.height='';sh.style.maxHeight='';sh.style.overflow='';sh.classList.remove('expanded','show');$('scrim').classList.remove('show');const eg=$('sheetEdgeGlobal');if(eg)eg.remove();setSheetInert(false);const rf=_sheetReturnFocus;_sheetReturnFocus=null;if(rf&&document.contains(rf))rf.focus()}

}
function txMonthRange(){

 list.forEach(t=>{if(t.date<lo)lo=t.date;if(t.date>hi)hi=t.date});

function dpMonthBlock(y,m){

function dpExtend(sc,dir){ /* 끝에 닿으면 달을 더 이어붙임 */
 const months=[...sc.querySelectorAll('.dp-month')];if(!months.length)return;
 const ref=dir>0?months[months.length-1]:months[0];

 let html='';
 for(let i=1;i<=6;i++){const d=new Date(y,m-1+dir*i,1);html+=dpMonthBlock(d.getFullYear(),d.getMonth()+1)}

 else{const before=sc.scrollHeight;months[0].insertAdjacentHTML('beforebegin',html);
   sc.scrollTop+=sc.scrollHeight-before; /* 위로 붙일 땐 스크롤 보정 */
   moveDpBlob(false);}

function dpOnScroll(sc){ /* 화면에 가장 많이 보이는 달을 상단에 표시 */
 if(sc._raf)return;

  if(sc.scrollTop<80)dpExtend(sc,-1);
  else if(sc.scrollTop+sc.clientHeight>sc.scrollHeight-80)dpExtend(sc,1);
  const viewTop=sc.scrollTop,viewBot=viewTop+sc.clientHeight;
  let cur=null,best=0;
  sc.querySelectorAll('.dp-month').forEach(mo=>{
   const top=mo.offsetTop,bot=top+mo.offsetHeight;
   const vis=Math.min(bot,viewBot)-Math.max(top,viewTop); /* 겹치는 높이 = 보이는 양 */
   if(vis>best){best=vis;cur=mo}
  });
  if(!cur)cur=sc.querySelector('.dp-month');
  if(!cur)return;
  /* 경계에서 표기가 떨리지 않도록 여유(현재 달이 15% 이내로 뒤지면 유지) */
  if(sc._curYM){
   const keep=sc.querySelector(`.dp-month[data-ym="${sc._curYM}"]`);
   if(keep&&keep!==cur){
    const kt=keep.offsetTop,kb=kt+keep.offsetHeight;
    const kvis=Math.min(kb,viewBot)-Math.max(kt,viewTop);
    if(kvis>best*0.85)cur=keep;
   }
  }
  sc._curYM=cur.dataset.ym;
  const y=+cur.dataset.y,m=+cur.dataset.m;
  const t=$('dpMText');if(t&&t.textContent!==`${y}년 ${m}월`)t.textContent=`${y}년 ${m}월`;
  _dpYM={y,m};
  sc.querySelectorAll('.dp-month').forEach(mo=>mo.classList.toggle('dim',mo!==cur)); /* 보고 있는 달만 진하게 */
 });
}

function onAlertScroll(el){const dots=$('alertDots');if(!dots)return;
 const c=el.scrollLeft+el.clientWidth/2;let i=0,best=1e9;
 [...el.children].forEach((ch,j)=>{const mid=ch.offsetLeft+ch.offsetWidth/2;const d=Math.abs(mid-c);if(d<best){best=d;i=j}});
 [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===i));}

/* toast */
function toast(msg){const t=document.createElement('div');t.className='toast';t.innerHTML=svg('check')+`<span>${esc(msg)}</span>`;
 $('toastWrap').appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
 setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},1900)}
/* toastFail: 저장/불러오기가 실제로 실패했을 때만 쓰는 경고 토스트. 성공 토스트보다 오래
 * 떠 있어야 사용자가 놓치지 않는다(save()가 화면 전환 직후 호출되는 경우가 많아서). */
function toastFail(msg){const t=document.createElement('div');t.className='toast fail';t.innerHTML=svg('alert')+`<span>${esc(msg)}</span>`;
 $('toastWrap').appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
 setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},4500)}
function undoToast(msg,undoFn){const t=document.createElement('div');t.className='toast undo';
 t.innerHTML=svg('check')+`<span>${esc(msg)}</span>`;
 const btn=document.createElement('button');btn.className='toast-undo';btn.textContent='되돌리기';let done=false;
 const tm=setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),300)},6000);
 btn.onclick=()=>{if(done)return;done=true;clearTimeout(tm);t.classList.remove('show');setTimeout(()=>t.remove(),300);undoFn()};
 t.appendChild(btn);$('toastWrap').appendChild(t);requestAnimationFrame(()=>t.classList.add('show'))}
function deleteTxnsUndo(ids){if(twGuard())return;const removed=DB.txns.filter(t=>ids.has(t.id));
 DB.txns=DB.txns.filter(t=>!ids.has(t.id));save();renderCurrent();
 undoToast(`${removed.length}개 내역을 삭제했어요`,()=>{DB.txns.push(...removed);save();renderCurrent();toast('되돌렸어요')})}
function deleteRecsUndo(ids){if(twGuard())return;const removed=DB.recurrences.filter(r=>ids.has(r.id));
 DB.recurrences=DB.recurrences.filter(r=>!ids.has(r.id));save();renderCurrent();
 undoToast(`${removed.length}개 반복 내역을 삭제했어요`,()=>{DB.recurrences.push(...removed);save();renderCurrent();toast('되돌렸어요')})}
function deleteAssetsUndo(ids){if(twGuard())return;
 const recs=activeRecsForAssets(ids);
 ids.forEach(snapshotAssetName);const removed=DB.assets.filter(a=>ids.has(a.id));
 recs.forEach(r=>r.active=false);
 DB.assets=DB.assets.filter(a=>!ids.has(a.id));save();renderCurrent();
 undoToast(`${removed.length}개 자산을 삭제했어요`+(recs.length?` · 반복거래 ${recs.length}개 비활성화`:''),()=>{
  DB.assets.push(...removed);recs.forEach(r=>r.active=true);save();renderCurrent();toast('되돌렸어요')})}

function wireMonthCarousel(viewport,which,onLabel){
 if(!viewport)return;
 if(viewport._c){if(viewport._align){viewport._align();requestAnimationFrame(viewport._align)}return}
 viewport._c=true;
 const T=()=>viewport.firstElementChild;if(!T())return;
 const step=()=>{const t=viewport.firstElementChild;const p=t&&t.children[0];
   if(!p)return viewport.clientWidth;
   const gap=parseFloat(getComputedStyle(p).marginRight)||0;
   return p.getBoundingClientRect().width+gap; /* 실측: 패널 폭 + 간격 */
 };
 const align=()=>{const t=viewport.firstElementChild;if(!t)return;
   t.style.transition='none';t.style.transform=`translateX(${-step()}px)`};
 viewport._align=align;
 align();                       /* 즉시 정렬 */
 requestAnimationFrame(align);  /* 레이아웃 확정 후 재정렬 */
 if(window.ResizeObserver){const ro=new ResizeObserver(()=>{if(!drag)align()});ro.observe(viewport)}
 let sx=0,sy=0,dx=0,drag=false,decided=false,horiz=false,shown=0,locked=false;
 const label=n=>{if(!onLabel)return;const c=curYM(which);const d=new Date(c.y,c.m-1+n,1);onLabel(d.getFullYear(),d.getMonth()+1)};
 viewport.addEventListener('touchstart',e=>{if(locked)return;
   sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;shown=0;
   drag=true;decided=false;horiz=false;T().style.transition='none'},{passive:true});
 viewport.addEventListener('touchmove',e=>{if(!drag)return;
   const cx=e.touches[0].clientX-sx,cy=e.touches[0].clientY-sy;
   if(!decided&&(Math.abs(cx)>8||Math.abs(cy)>8)){decided=true;horiz=Math.abs(cx)>Math.abs(cy)}
   if(!decided)return;
   if(!horiz){drag=false;align();label(0);return} /* 세로면 페이지 스크롤 양보 */
   if(e.cancelable)e.preventDefault();
   dx=cx;
   T().style.transform=`translateX(${-step()+dx}px)`;
   const n=Math.abs(dx)>step()*0.15?(dx>0?-1:1):0;
   if(n!==shown){shown=n;label(n)}
 },{passive:false});
 viewport.addEventListener('touchend',()=>{if(!drag)return;drag=false;
   if(!horiz)return;
   const go=Math.abs(dx)>step()*0.15;
   if(!go){const t=T();t.style.transition='transform .3s cubic-bezier(.32,.72,0,1)';
     t.style.transform=`translateX(${-step()}px)`;
     label(0);return}
   const dir=dx>0?-1:1;
   locked=true;label(dir);
   const t=T();t.style.transition='transform .32s cubic-bezier(.32,.72,0,1)'; /* iOS 감성 이징 */
   t.style.transform=`translateX(${-step()+(dir<0?step():-step())}px)`;
   if(navigator.vibrate)navigator.vibrate(8);
   let fired=false;
   const done=()=>{if(fired)return;fired=true;
     t.removeEventListener('transitionend',done);
     locked=false;
     monthStep(which,dir); /* 새 달 렌더 → 새 트랙은 즉시 제자리에 정렬됨(깜빡임 없음) */
   };
   t.addEventListener('transitionend',done);
   setTimeout(done,420); /* 안전망 (transitionend 누락 대비) */
 });
}
function curYM(which){
 if(which==='home')return ST.home;
 if(which==='ledger')return {y:ST.ledger.y,m:ST.ledger.m};
 if(which==='plan')return {y:ST.plan.y,m:ST.plan.m};

}
function wireHdrFade(page){
 if(!page||page._hdrWired)return;page._hdrWired=true;
 const upd=()=>{const y=page.scrollTop;
   const o=Math.max(0,1-y/64); /* 64px 스크롤하면 완전히 사라짐 */
   page.style.setProperty('--hdr-o',o.toFixed(3));
   const h=page.querySelector('.hdr');if(h)h.style.pointerEvents=o<.15?'none':'';
 };
 page.addEventListener('scroll',()=>{if(!page._raf){page._raf=requestAnimationFrame(()=>{page._raf=null;upd()})}},{passive:true});
 upd();
}
function moveBlob(animate){const blob=$('navBlob');if(!blob)return;
 const btn=document.querySelector(`.nav-btn[data-tab="${navTabOf(ST.tab)}"]`);if(!btn)return;
 blob.classList.toggle('warn',btn.classList.contains('warn')); /* 경고 탭이면 물방울도 경고색 */
 const w=Math.min(btn.offsetWidth-4,70);
 blob.style.left=(btn.offsetLeft+(btn.offsetWidth-w)/2)+'px';
 blob.style.width=w+'px';
 if(animate){blob.classList.add('squish');clearTimeout(blob._t);blob._t=setTimeout(()=>blob.classList.remove('squish'),260)}
}
