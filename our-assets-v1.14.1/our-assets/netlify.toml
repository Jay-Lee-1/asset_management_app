# 우리의 자산 — Netlify 설정
# 폴더를 Netlify Drop 에 올리면 이 설정이 자동 적용됩니다.

[build]
  publish = "."
  functions = "netlify/functions"

# 앱 본체와 서비스워커는 항상 최신본을 받도록 캐시하지 않습니다(업데이트 즉시 반영).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# 아이콘은 오래 캐시해도 됩니다.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
